p-forward styles such as Pale Ales, IPA, IPL, etc. should be categorized as Hoppy Gluten Free Beers. Gluten Free beers that showcase adjuncts such as fruit, field/vegetables, chili, chocolate, coffee, spice, wood or barrel-aging, wild fermentation/souring (Including Gose, Berliner, Lambics, etc.) or any non-traditional/unique ingredients and/or flavor outcomes should be categorized as Specialty Gluten Free beers. NOTE: These guidelines do not supersede any government regulations. Wine, mead, flavored malt beverages or beverages other than 'beer' as defined by the TTB (U.S. Trade and Tax Bureau) are not considered 'glutenfree beer' under these guidelines. Gluten-reduced beers’ original ingredients would have gluten content that has been reduced by enzymes or other processes to reduced levels. Gluten-reduced beers should be categorized in the classic style category most appropriate for the beer, rather than as Gluten-Free Beer. To allow for accurate judging brewer is required to identify carbohydrate sources and fermentation type used to make the beer, and the classic ale or lager beer style being elaborated upon (if there is one) with regard to flavor, aroma and appearance. The brewer may indicate ‘no classic style’ in instances where the base beer does not hew to a category within these competition guidelines as well as any additional ingredients used in brewing the beer. Beer entries not accompanied by this information will be at a disadvantage and/or ineligible for judging."]]}]},{"n":"27","name":"Hoppy Gluten-Free Beer","has":false,"subs":[{"id":"27","name":"Hoppy Gluten-Free Beer","cat":"Hoppy Gluten-Free Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","30+"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with underlying style"],["Clarity","Varies with underlying style"],["Malt aroma & flavor","Varies with underlying style. Grains and fermentables which differ from those typically used to produce a given beer style can and will produce flavor and aroma outcomes that differ from traditional versions. Such differences are to be expected and are acceptable."],["Hop aroma & flavor","Varies with underlying hoppy style"],["Bitterness","Varies with underlying hoppy style"],["Fermentation","Although brewers may design and identify these beers according to defined style guidelines, these beers should be evaluated on their own merits without strict adherence to defined style parameters."],["Body","Varies with underlying style"],["Notes","This category includes lagers, ales or other beers made from fermentable sugars, grains and converted carbohydrates and must also include some portion of cereal. All ingredients must be free of gluten. Within the framework of these guidelines, beers brewed with barley, wheat, spelt, rye, and other gluten-containing ingredients may not be categorized as Gluten-Free. Gluten-Free Beers may contain malted grains that are gluten-free. Within the framework of these guidelines, these beers are hop-forward Gluten Free varieties ranging from Pale Ales to IPA and including hoppy lager styles such as Cold IPA or India Pale Lagers. Some dark beer varieties (such as black IPA, or hop-forward stout varieties) may be appropriately entered here but must have dominant hop character. Gluten Free beers that showcase adjuncts such as fruit, field/vegetables, chili, chocolate, coffee, spice, wood or barrel-aging, wild fermentation/souring (Including Gose, Berliner, Lambics, etc.) or any non-traditional/unique ingredients and/or flavor outcomes should be categorized as Specialty Gluten Free beers. NOTE: These guidelines do not supersede any government regulations. Wine, mead, flavored malt beverages or beverages other than 'beer' as defined by the TTB (U.S. Trade and Tax Bureau) are not considered 'glutenfree beer' under these guidelines. Gluten-reduced beers’ original ingredients would have gluten content that has been reduced by enzymes or other processes to reduced levels. Gluten-reduced beers should be categorized in the classic style category most appropriate for the beer, rather than as Gluten-Free Beer. To allow for accurate judging brewer is required to identify carbohydrate sources and fermentation type used to make the beer, and the hop-forward ale or lager beer style being elaborated upon (if there is one) with regard to flavor, aroma and appearance. The brewer may indicate ‘no classic style’ in instances where the base beer does not hew to a category within these competition guidelines as well as any additional ingredients used in brewing the beer. Beer entries not accompanied by this information will be at a disadvantage and/or ineligible for judging."]]}]},{"n":"28","name":"Specialty Gluten-Free Beer","has":false,"subs":[{"id":"28","name":"Specialty Gluten-Free Beer","cat":"Specialty Gluten-Free Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with underlying style"],["Clarity","Varies with underlying style"],["Malt aroma & flavor","Varies with underlying style. Grains and fermentables which differ from those typically used to produce a given beer style can and will produce flavor and aroma outcomes that differ from traditional versions. Such differences are to be expected and are acceptable."],["Bitterness","Varies with underlying style"],["Body","Varies with underlying style"],["Notes","This category includes lagers, ales or other beers made from fermentable sugars, grains and converted carbohydrates and must also include some portion of cereal. All ingredients must be free of gluten. Within the framework of these guidelines, beers brewed with barley, wheat, spelt, rye, and other gluten-containing ingredients may not be categorized as Gluten-Free. Gluten-Free Beers may contain malted grains that are gluten-free. Within the framework of these guidelines, these beers are Gluten-Free varieties that showcase, fruit, field/vegetables, chili, chocolate, coffee, spice, wood-aging or any non-traditional/unique ingredients and/or flavor outcomes. Sour beers, including kettle-sours and wild fermentations are appropriately entered here. While traditional, Belgian witbiers or other traditionally spiced/adjunct styles are appropriately entered in here due to the added spices. NOTE: These guidelines do not supersede any government regulations. Wine, mead, flavored malt beverages or beverages other than 'beer' as defined by the TTB (U.S. Trade and Tax Bureau) are not considered 'glutenfree beer' under these guidelines. Gluten-reduced beers’ original ingredients would have gluten content that has been reduced by enzymes or other processes to reduced levels. Gluten-reduced beers should be categorized in the classic style category most appropriate for the beer, rather than as Gluten-Free Beer. To allow for accurate judging brewer is required to identify carbohydrate sources and fermentation type used to make the beer, and the specialty, experimental or hybrid beer style being elaborated upon (if there is one) with regard to flavor, aroma and appearance. The brewer may indicate ‘no classic style’ in instances where the base beer does not hew to a category within these competition guidelines as well as any additional ingredients used in brewing the beer. Beer entries not accompanied by this information will be at a disadvantage and/or ineligible for judging."]]}]},{"n":"29","name":"American-Style Sour Ale","has":true,"subs":[{"id":"29A","name":"American-Style Sour Ale","cat":"American-Style Sour Ale","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Pale to black"],["Clarity","Chill haze, bacteria, and yeast-induced haze is acceptable at any temperature."],["Malt aroma & flavor","Low. In darker versions, any of roasted malt, caramel, or chocolate aroma and flavor attributes should be present at low levels."],["Hop aroma & flavor","None to high"],["Bitterness","None to high"],["Fermentation","Moderate to intense, yet balanced, fruity esters are present. Diacetyl, DMS, and Brettanomyces should not be present. The evolution of natural acidity at medium-low to high levels develops a balanced complexity and is expressed as a refreshing, pleasant sourness, in harmony with other attributes. The acidity present is usually in the form of lactic, acetic, and other organic acids naturally developed with acidified malt in the mash or in kettle or post wort fermentation and is produced by various microorganisms including certain bacteria and yeasts. Acidic character can be a complex balance of several types of acid and attributes of age. Wood vessels may be used during the fermentation and aging process, but wood-derived flavors such as vanillin should not be present. There should be no residual flavors from liquids previously aged in a barrel such as bourbon or sherry."],["Body","Low to high"],["Notes","Beers exhibiting wood-derived characters or characters of liquids previously aged in wood are categorized as Wood-Aged Sour Beer. Fruited versions are categorized elsewhere. To allow for accurate judging the brewer must provide additional information about the entry to allow for comparison between diverse entries. Such information must include the classic, experimental or hybrid style of the underlying base beer being made sour; because these beers often defy categorization and the base beer may not hew to an existing style guideline outlined herein, brewer may indicate ‘no classic style’. Such information could also identify microbes, special ingredients or special processes used that influence sensory outcomes. Beer entries not accompanied by this information will be at a disadvantage during judging."]]},{"id":"29B","name":"Fruited American Sour","cat":"American-Style Sour Ale","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Can range from pale to black depending on underlying beer style and is often influenced by the color of added fruit"],["Clarity","Chill haze, bacteria, and yeast-induced haze is acceptable at any temperature."],["Malt aroma & flavor","Low. In darker versions, any of roasted malt, caramel, or chocolate aroma and flavor attributes should be present at low levels."],["Hop aroma & flavor","None to high"],["Bitterness","None to high and in balance with fruit character"],["Fermentation","Moderate to intense, yet balanced, fruity esters are present. Diacetyl, DMS, and Brettanomyces should not be present. The evolution of natural acidity at medium-low to high levels develops a balanced complexity and is expressed as a refreshing, pleasant sourness, in harmony with other attributes. The acidity present is usually in the form of lactic, acetic, and other organic acids naturally developed with acidified malt in the mash or in kettle or post wort fermentation and is produced by various microorganisms, including certain bacteria and yeasts. Acidic character can be a complex balance of several types of acid and attributes of age. Wood vessels may be used during the fermentation and aging process, but wood-derived flavors such as vanillin should not be present. Attributes arising from liquids previously aged in a barrel, such as bourbon or sherry, should not be present."],["Body","Low to high"],["Notes","Fruit aromas, ranging from subtle to intense, should be present. Fruit or fruit extracts, used as an adjunct in either the mash, kettle, primary or secondary fermentation, provide harmonious fruit character ranging from subtle to intense. Beers exhibiting wood-derived attributes or evidence of liquids previously aged in wood are categorized as Fruited Wood-Aged Sour Beer. Within the framework of these guidelines, coconut is defined as a vegetable, and beers containing coconut are categorized as Field Beer. Likewise beers containing chili peppers are categorized as Chili Beer. Fruited versions of Berliner-Style Weisse and Belgian-Style Sour Ale are categorized elsewhere. To allow for accurate judging the brewer must provide additional information about the entry to allow for comparison between diverse entries. Such information must include the classic, experimental or hybrid style of the underlying base beer being made sour; because these beers often defy categorization and the base beer may not hew to an existing style guideline outlined herein, brewer may indicate ‘no classic style’. Such information must identify fruit(s) used, and could also identify microbes, special ingredients or special processes used that influence sensory outcomes. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"30","name":"Brett Beer","has":false,"subs":[{"id":"30","name":"Brett Beer","cat":"Brett Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Any color is acceptable. Beer color may be influenced by the color of added fruits or other ingredients."],["Clarity","Chill or yeast haze is allowable at low to medium levels at any temperature"],["Malt aroma & flavor","In darker versions, any of roasted malt, caramel or chocolate aromas and flavors are present at low levels."],["Hop aroma & flavor","Low to high"],["Bitterness","Low to high"],["Fermentation","Medium to high fruity esters are present. Subtle acidity/tartness resulting from Brettanomyces fermentation results in a complex flavor profile. Brettanomyces character should be present at low to high levels, expressed as any of horsey, goaty, leathery, phenolic or fruity aroma and flavor attributes. Brettanomyces character may or may not be dominant. Subtle acidity/tartness from Brettanomyces should be low to medium-low but may increase with exposure to oxygen during barrel aging. Cultured yeast strains may be used in the fermentation. Beers fermented with Brettanomyces that do not exhibit attributes typical of Brettanomyces fermentation are categorized elsewhere. Beers in this style should not incorporate bacteria or exhibit a bacteria-derived flavor profile. Diacetyl and DMS should not be present."],["Body","Low to high"],["Notes","Fruited versions will exhibit fruit flavors in balance with other elements. Wood vessels may be used for fermentation and aging; such beers may or may not exhibit attributes typical of wood-aging such as vanillin or of liquids previously aged in a barrel (bourbon, sherry, etc.) A beer exhibiting additional sensory attributes arising from microbes other than Brett is categorized as Mixed Culture Brett Beer. Various India Pale Ales fermented with Brett are categorized as Specialty India Pale Ale. To allow for accurate judging the brewer must provide additional information about the entry to allow for comparison between diverse entries. Such information must include the classic, experimental or hybrid style of the underlying base beer; because these beers often defy categorization and the base beer may not hew to an existing style guideline outlined herein, brewer may indicate ‘no classic style’. Such information must identify fruit(s) or other ingredients used (if any), and could also include microbes or special processes used that influence sensory outcomes. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"31","name":"Mixed-Culture Brett Beer","has":false,"subs":[{"id":"31","name":"Mixed-Culture Brett Beer","cat":"Mixed-Culture Brett Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Any color is acceptable. Beer color may be influenced by the color of added fruits or other ingredients."],["Clarity","Chill haze, bacteria and yeast-induced haze is allowable at low to medium levels at any temperature."],["Malt aroma & flavor","In darker versions, any of roasted malt, caramel, or chocolate aromas and flavors are present at low levels."],["Hop aroma & flavor","Low to high"],["Bitterness","Low to high"],["Fermentation","Medium to high fruity esters are present. Acidity resulting from fermentation with Brettanomyces or bacteria results in a complex flavor profile. Brettanomyces character should be present and expressed as any of horsey, goaty, leathery, phenolic, fruity, or acidic aroma and flavor attributes. Cultured yeast may be used in the fermentation. Bacteria should be incorporated and in evidence. Bacteria will contribute acidity which may or may not dominate the flavor profile. Diacetyl and DMS should not be present."],["Body","Low to high"],["Notes","Fruited versions will exhibit fruit flavors in balance with other elements. Wood vessels may be used for fermentation and aging; such beers may or may not exhibit attributes typical of wood-aging such as vanillin or of liquids previously aged in a barrel (bourbon, sherry, etc.). To allow for accurate judging the brewer must provide additional information about the entry to allow for comparison between diverse entries. Such information must include the classic, experimental or hybrid style of the underlying base beer; because these beers often defy categorization and the base beer may not hew to an existing style guideline outlined herein, brewer may indicate ‘no classic style’. Such information must identify fruit(s) or other ingredients (if any), and could include microbes or special processes used that influence sensory outcomes. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"32","name":"Wood- and Barrel-Aged Beer","has":false,"subs":[{"id":"32","name":"Wood- and Barrel-Aged Beer","cat":"Wood- and Barrel-Aged Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","3.75%-8.00%"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with underlying style"],["Clarity","Varies with underlying style"],["Malt aroma & flavor","Varies with underlying style"],["Hop aroma & flavor","Varies with underlying style"],["Bitterness","Varies with underlying style"],["Fermentation","Typical of underlying style of beer being aged. Within the framework of these guidelines, these beers contain alcohol less than or up to (but not exceeding) 8.0% abv or 6.4% abw when consumed."],["Body","Varies with underlying style"],["Notes","Within the framework of these guidelines these beers meet the criteria for content shown above. Stronger (>6.4% abw or >8.0% abv) beers of any color should be categorized in other wood-aged beer styles. These are any traditional or experimental style of lager, ale or hybrid beer aged in either a wooden barrel or in contact with wood. These beers are aged with the intention of developing unique attributes imparted by the wood and/or by liquids that had previously been stored in contact with the wood. Wood aging does not necessarily impart wood flavors but does result in distinctive sensory outcomes. Used sherry, rum, whiskey, tequila, port, wine and other barrels are often used, imparting complexity and uniqueness to a beer. A balance of aroma, flavor and mouthfeel results from the marriage of new beer with attributes imparted by the wood or barrel. Wood-aged beers which exhibit sensory attributes typical of Brettanomyces alone, or of Brettanomyces and other microbes, are categorized as Brett Beer or Mixed-Culture Brett Beer respectively. Sour wood-aged beers and Fruited sour wood-aged beers are categorized as Sour Wood-Aged or Fruited Sour Wood-Aged Beer, respectively. To allow for accurate judging the brewer must provide additional information about the entry including the classic, experimental or hybrid ale or lager beer style being aged in wood; because these beers often defy categorization and the base beer may not hew to an existing style guideline outlined herein, brewer may indicate ‘no classic style’. Such information must identify fruit(s), spice(s) or other ingredients used (if any), and could include type of wood used (new or old, oak or other wood type), previous liquids in the barrel if any (port/ whiskey/ wine/ sherry/ other), etc. Beer entries not accompanied by this information will be at a disadvantage during judging. Beers brewed with chili are allowable in this category in some situations but flavor outcomes from wood/barrel aging must be the focus.."]]}]},{"n":"33","name":"Wood- and Barrel-Aged Strong Beer","has":false,"subs":[{"id":"33","name":"Wood- and Barrel-Aged Strong Beer","cat":"Wood- and Barrel-Aged Strong Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV",">8.0%"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with underlying style and can be influenced by the color of added fruit(s) if any"],["Clarity","Varies with underlying style"],["Malt aroma & flavor","Varies with underlying style"],["Hop aroma & flavor","Varies with underlying style"],["Bitterness","Varies with underlying style"],["Fermentation","Typical of underlying style of beer being aged. Within the framework of these guidelines, these beers contain alcohol greater than 6.4% abw or 8.0% abv when consumed. Alcohol may be evident in stronger versions, in harmony with other flavor and aroma attributes, and not harsh."],["Body","Varies with underlying style"],["Notes","Within the framework of these guidelines, these are any traditional or experimental style of lager, ale or hybrid beer (with the exception of various stronger stout styles) aged in either a wooden barrel or in contact with wood, which meet the criteria for alcohol content shown below. Lower alcohol (<=6.4% abw or <=8.0% abv) wood-aged beers should be categorized as other wood-aged beer styles. Strong wood-aged stouts with alcohol above 6.4% abw or 8.0% abv are categorized as Wood Aged Strong Stout. These beers are aged with the intention of developing unique attributes imparted by the wood and/or by liquids that had previously been stored in contact with the wood. Wood aging does not necessarily impart wood flavors but does result in distinctive sensory outcomes. Used sherry, rum, whiskey, tequila, port, wine and other barrels are often used, imparting complexity and uniqueness to a beer. A balance of aroma, flavor and mouthfeel results from the marriage of new beer with attributes imparted by the wood or barrel. Wood-Aged Beers which exhibit sensory attributes typical of Brettanomyces alone, or of Brettanomyces and other microbes, are categorized as Brett Beer or Mixed-Culture Brett Beer respectively. Sour wood-aged beers should be categorized elsewhere. Fruited or spiced wood-aged beers which meet the criteria for alcohol content and which exhibit attributes of wood-aging are appropriately categorized here and may take on the color, flavors and aromas of added fruits or spices. However, sour versions of fruited or spiced wood-aged beers are categorized elsewhere. To allow for accurate judging the brewer must provide additional information about the entry including the classic, experimental or hybrid ale or lager beer style being aged in wood; because these beers often defy categorization and the base beer may not hew to an existing style guideline outlined herein, brewer may indicate ‘no classic style’. Such information must identify fruit(s), spice(s) or other ingredients used (if any), and could include type of wood used (new or old, oak or other wood type), previous liquids in the barrel if any (port/ whiskey/ wine/ sherry/ other), etc. Beer entries not accompanied by this information will be at a disadvantage during judging. Beers brewed with chili are allowable in this category in some situations but flavor outcomes from wood/barrel aging must be the focus.."]]}]},{"n":"34","name":"Wood- and Barrel-Aged Strong Stout","has":false,"subs":[{"id":"34","name":"Wood- and Barrel-Aged Strong Stout","cat":"Wood- and Barrel-Aged Strong Stout","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV",">8.0%"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Characteristically very dark to black, varying with underlying strong stout style"],["Clarity","Opaque"],["Malt aroma & flavor","Varies with underlying stout style"],["Hop aroma & flavor","Varies with underlying stout style"],["Bitterness","Varies with underlying stout style"],["Fermentation","Typical of underlying style of strong stout being aged. Within the framework of these guidelines, these beers contain alcohol greater than 6.4% abw or 8.0% abv when consumed. Alcohol may be evident in stronger versions, in harmony with other flavor and aroma attributes, and not harsh."],["Body","Varies with underlying stout style"],["Notes","Within the framework of these guidelines, these are any traditional or experimental strong stout (but NOT dessert/pastry-style stouts) aged in either a wooden barrel or in contact with wood, which meet the criteria for alcohol content shown above. These beers are aged with the intention of developing unique attributes imparted by the wood and/or by liquids that had previously been stored in contact with the wood. Wood aging does not necessarily impart wood flavors, but does result in distinctive sensory outcomes. Used sherry, rum, whiskey, tequila, port, wine and other barrels are often used, imparting complexity and uniqueness to a beer. A balance of aroma, flavor and mouthfeel results from the marriage of new beer with attributes imparted by the wood or barrel. Lower alcohol (<=6.4% abw or <=8.0% abv) woodaged stouts should be categorized as other wood-aged beer styles and dessert/pastry-style stouts should be classified as Wood- and Barrel-aged Dessert or Pastry Beer. Wood-aged stouts which exhibit sensory attributes typical of Brettanomyces alone, or of Brettanomyces and other microbes, are categorized as Brett Beer or Mixed-Culture Brett Beer respectively. Sour wood-aged strong stouts (with or without fruit) should be categorized elsewhere. Fruited or spiced wood-aged strong stouts which meet the criteria for alcohol content and which exhibit attributes of wood-aging are appropriately categorized here and may take on the flavors and aromas (and perhaps hue) of added fruits or spices. To allow for accurate judging the brewer must provide additional information about the entry including the classic, experimental or hybrid ale or lager beer style being aged in wood; because these beers often defy categorization and the base beer may not hew to an existing style guideline outlined herein, brewer may indicate ‘no classic style’. Such information must identify fruit(s), spice(s) or other ingredients used (if any), and could include type of wood used (new or old, oak or other wood type), previous liquids in the barrel if any (port/ whiskey/ wine/ sherry/ other), etc. Beer entries not accompanied by this information will be at a disadvantage during judging. Beers brewed with chili are allowable in this category in some situations but flavor outcomes from wood/barrel aging must be the focus.."]]}]},{"n":"35","name":"Wood- and Barrel-Aged Sour Beer","has":true,"subs":[{"id":"35A","name":"Fruited Wood- and Barrel-Aged Sour Beer","cat":"Wood- and Barrel-Aged Sour Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with style, and may take on color of added fruits or other ingredients"],["Clarity","Varies with underlying style"],["Malt aroma & flavor","Varies with underlying style and in harmony with fruit aromas and flavors"],["Hop aroma & flavor","Varies with underlying style"],["Bitterness","Varies with underlying style"],["Fermentation","Typical of underlying style of sour beer being aged"],["Body","Varies with underlying style"],["Notes","These are fruited versions of any traditional or experimental style of lager, ale or hybrid beer aged in either a wooden barrel or in contact with wood, and exhibiting acidity derived from exposure to bacteria. These beers are aged in the presence of microflora (either present in the wood or introduced at some time in the brewing process) with the intention of introducing sourness to the beer. These beers are aged with the intention of developing unique attributes imparted by the wood and/or by liquids that had previously been stored in contact with the wood. Wood aging does not necessarily impart wood flavors, but does result in distinctive sensory outcomes. Used sherry, rum, whiskey, tequila, port, wine and other barrels are often used, imparting complexity and uniqueness to a beer. A balance of aroma, flavor and mouthfeel results from the marriage of new beer with fruit, attributes imparted by the wood or barrel, and with sourness and/or other attributes derived from bacteria. These beers may or may not have Brettanomyces character. For purposes of competition, entries made with combinations of fruit(s) and or spices and or other ingredients, and which therefore represent combinations of multiple hybrid beer styles, are nonetheless categorized here as Fruited Wood-Aged Sour Beer. To allow for accurate judging the brewer must provide additional information about the entry including the classic, experimental or hybrid ale or lager beer style being aged in wood; because these beers often defy categorization and the base beer may not hew to an existing style guideline outlined herein, brewer may indicate ‘no classic style’. Such information must identify spice(s) or other ingredients used (if any), souring method, type of wood used (new or old, oak or other wood type), previous liquids in the barrel if any (port/ whiskey/ wine/ sherry/other), etc. Beer entries not accompanied by this information will be at a disadvantage during judging."]]},{"id":"35B","name":"Wood- and Barrel-Aged Sour Beer","cat":"Wood- and Barrel-Aged Sour Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with underlying style"],["Clarity","Varies with underlying style"],["Malt aroma & flavor","Varies with underlying style"],["Hop aroma & flavor","Varies with underlying style"],["Bitterness","Varies with underlying style"],["Fermentation","Typical of underlying style of sour beer being aged"],["Body","Varies with underlying style"],["Notes","These are any traditional or experimental style of lager, ale or hybrid beer aged in either a wooden barrel or in contact with wood, and exhibiting acidity derived from exposure to bacteria. These beers are aged in the presence of microflora (either present in the wood or introduced at some time in the brewing process) with the intention of introducing sourness to the beer. These beers are aged with the intention of developing unique attributes imparted by the wood, or by liquids that had previously been stored in contact with the wood. Wood-aging does not necessarily impart wood flavors but does result in distinctive sensory outcomes. Used sherry, rum, whiskey, tequila, port, wine, and other barrels are often used, imparting complexity and uniqueness to a beer. A balance of aroma, flavor, and mouthfeel results from the marriage of new beer with attributes imparted by the wood or barrel, and with sourness or other attributes derived from bacteria. Wood-Aged Sour Beer fermented with Brettanomyces or which exhibit sensory attributes typical of Brettanomyces is categorized elsewhere. To allow for accurate judging the brewer must provide additional information about the entry including the classic, experimental or hybrid ale or lager beer style being aged in wood; because these beers often defy categorization and the base beer may not hew to an existing style guideline outlined herein, brewer may indicate ‘no classic style’. Such information must identify spice(s) or other ingredients used (if any), souring method, type of wood used (new or old, oak or other wood type), previous liquids in the barrel if any (port/ whiskey/ wine/ sherry/other), etc. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"36","name":"Kellerbier or Zwickelbier","has":true,"subs":[{"id":"36A","name":"Unfiltered European-Style Ale","cat":"Kellerbier or Zwickelbier","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies depending on the underlying European origin ale style"],["Clarity","Can be slightly hazy to moderately cloudy. A small amount of yeast haze is acceptable and traditional. These beers must be unfiltered but may become clear with age. May exhibit poor head retention."],["Malt aroma & flavor","Varies depending on the underlying style"],["Hop aroma & flavor","Varies depending on underlying style. Low level attributes typical of late or dry hopping may be present in some versions."],["Bitterness","Varies depending on underlying style"],["Fermentation","Low to medium yeast aroma and flavor is desirable. Very low to moderately low levels of sulfur should be apparent. Low levels of acetaldehyde or other volatiles, normally reduced during lagering, may or may not be apparent. The presence of sulfur and acetaldehyde should enhance the flavor of these beers. Fruity-estery levels may vary slightly from the underlying styles due to age and presence of yeast."],["Body","Varies depending on underlying style"],["Notes","Kellerbier ales are unfiltered versions of ale styles of European origin. These can include traditional Kolsch, Alt, as well as less common traditional or contemporary European-origin ale styles. Carbonation may vary with underlying style. These unfiltered beers are packaged and served with very low to moderate amounts of yeast. Contemporary versions may be filtered and dosed with yeast during packaging. Beers containing non-standard ingredients or aged in flavor-imparting vessels should be categorized elsewhere. During registration brewers may specify pouring instructions, choosing quiet pouring or intentional rousing of yeast. Entries will be presented during judging as specified by entering brewer. To allow for accurate judging the brewer must provide the classic ale style on which the entry is based. Beer entries not accompanied by this information will be at a disadvantage during judging.."]]},{"id":"36B","name":"Unfiltered European-Style Lager","cat":"Kellerbier or Zwickelbier","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies depending on the underlying European origin lager style"],["Clarity","Can be slightly hazy to moderately cloudy. A small amount of yeast haze is acceptable and traditional. These beers must be unfiltered but may become clear with age. May exhibit poor head retention."],["Malt aroma & flavor","Varies depending on the underlying style"],["Hop aroma & flavor","Varies depending on underlying style. Low level attributes typical of late or dry hopping may be present in some versions."],["Bitterness","Varies depending on underlying style"],["Fermentation","Low to medium yeast aroma and flavor is desirable. Very low to moderately low levels of sulfur should be apparent. Low levels of acetaldehyde or other volatiles, normally reduced during lagering, may or may not be apparent. The presence of sulfur and acetaldehyde should enhance the flavor of these beers. Fruity-estery levels may vary slightly from the underlying styles due to age and presence of yeast."],["Body","Varies depending on underlying style"],["Notes","Kellerbier lagers are unfiltered versions of lager styles of European origin. These can include Munich-Style Helles, Dunkel, Dortmunder/Export, Bohemian Pilsener, German Pilsener, Bock, as well as less common traditional or contemporary European-origin lager styles. Carbnation may vary with underlying style. These unfiltered beers are packaged and served with very low to moderate amounts of yeast. Contemporary versions may be filtered and dosed with yeast during packaging. Beers containing non-standard ingredients or aged in flavor-imparting vessels should be categorized elsewhere. During registration brewers may specify pouring instructions, choosing quiet pouring or intentional rousing of yeast. Entries will be presented during judging as specified by entering brewer. To allow for accurate judging the brewer must provide the classic lager style on which the entry is based. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"37","name":"Smoke Beer","has":true,"subs":[{"id":"37A","name":"Smoke Porter","cat":"Smoke Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Dark brown to black"],["Clarity","Opaque"],["Malt aroma & flavor","Smoked porters will exhibit mild to assertive smoke malt aroma and flavor in balance with other aroma attributes. Black malt character can be present in some porters, while others may be absent of strong roast character. Roast barley character is absent to low depending on underlying porter style being smoked. Medium to high malt sweetness with caramel or chocolate flavor attributes is acceptable."],["Hop aroma & flavor","None to medium"],["Bitterness","Medium to medium-high"],["Fermentation","Low to medium fruity esters are acceptable"],["Body","Medium to full"],["Notes","To allow for accurate judging the brewer must list the traditional or experimental base style of porter being smoked, as well as the wood type used as a smoke source (e.g. ‘alder smoked brown porter’). Beer entries not accompanied by this information will be at a disadvantage during judging."]]},{"id":"37B","name":"Bamberg-Style Weiss Rauchbier","cat":"Smoke Beer","st":[["Original gravity","1.047-1.056"],["Final gravity","1.008-1.016"],["ABV","4.90%-5.60%"],["IBU","10-15"],["Color SRM (EBC)","4-18 (8-36 EBC)"]],"d":[["Color","Pale to chestnut brown"],["Clarity","If served with yeast, appearance may be very cloudy."],["Malt aroma & flavor","In darker versions, a detectable degree of roast malt may be present without being aggressive. Smoky malt aroma and flavor, ranging from low to high, should be present. Smoke character should be smooth, not harshly phenolic, suggesting a mild sweetness."],["Hop aroma & flavor","Not present"],["Bitterness","Low"],["Fermentation","The aroma and flavor of a Weiss Rauchbier with yeast should be fruity and phenolic. The phenolic characteristics are often described as clove, nutmeg, vanilla, and smoke. Banana esters are often present at low to medium-high levels. No diacetyl should be perceived. Weissbiers are well attenuated and very highly carbonated."],["Body","Medium to full"],["Notes","Beers in this style are made with at least 50 percent wheat malt. They are often roused during pouring, and, when yeast is present, will have a yeasty flavor and a fuller mouthfeel. To allow for accurate judging the brewer must list the underlying base German wheat beer style being smoked, as well as the wood type used as a smoke source (e.g. ‘alder smoked dunkelweizen’). Beer entries not accompanied by this information will be at a disadvantage during judging."]]},{"id":"37C","name":"Bamberg-Style Helles Rauchbier","cat":"Smoke Beer","st":[["Original gravity","1.044-1.05"],["Final gravity","1.0081.012"],["ABV","4.80%-5.60%"],["IBU","18-25"],["Color SRM (EBC)","4-5.5 (8-11 EBC)"]],"d":[["Color","Light pale to gold"],["Clarity","Appearance should be clear. Chill haze should not be present"],["Malt aroma & flavor","Malt character is prominent with malt aromas suggesting lightly toasted sweet, malted barley. Smoke beechwood character ranges from very low to medium. Smoky aroma should be not harshly phenolic. Sulfur may be present at low levels. There should be no caramel character. Smoke flavor may create a perception of mild sweetness."],["Hop aroma & flavor","Hop aroma and flavor is very low to low, derived from noble-type hops."],["Bitterness","Low to medium"],["Fermentation","Fruity esters and diacetyl should not be present. Very low levels of sulfurrelated compounds are acceptable."],["Body","Medium"]]},{"id":"37D","name":"Bamberg-Style Maerzen Rauchbier","cat":"Smoke Beer","st":[["Original gravity","1.05-1.06"],["Final gravity","1.0121.02"],["ABV","5.10%-6.00%"],["IBU","18-25"],["Color SRM (EBC)","4-15 (8-30 EBC)"]],"d":[["Color","Pale to light brown"],["Clarity","Appearance should be clear. Chill haze should not be present"],["Malt aroma & flavor","Sweet toasted malt aroma should be present. Medium-low to medium toasted malt sweetness should be present. Aroma and flavor of smoked beechwood ranges from very low to medium. Smoke flavors should be smooth, without harshness. Aroma should strike a balance between malt, hop, and smoke."],["Hop aroma & flavor","Hop aroma and flavor is very low to low, derived from noble-type hops."],["Bitterness","Low to medium"],["Fermentation","Fruity esters and diacetyl should not be present"],["Body","Full"]]},{"id":"37E","name":"Bamberg-Style Bock Rauchbier","cat":"Smoke Beer","st":[["Original gravity","1.066-1.074"],["Final gravity","1.0181.024"],["ABV","6.30%-7.60%"],["IBU","20-30"],["Color SRM (EBC)","20-30 (40-60 EBC)"]],"d":[["Color","Dark brown to very dark"],["Clarity","Appearance should be clear. Chill haze should not be present"],["Malt aroma & flavor","Medium to medium-high malt aroma and flavor should be present with very low to medium-high beechwood smoke aromas and flavors. Smoke flavors should be smooth, without harshness. Smoke flavor may create a perception of mild sweetness."],["Hop aroma & flavor","Very low"],["Bitterness","Medium, increasing proportionately with starting gravity."],["Fermentation","Fruity esters are usually absent, but if present should be very low. Diacetyl should not be present."],["Body","Medium to full"]]},{"id":"37F","name":"Other Smoke Beer","cat":"Smoke Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Any beer of any style incorporating smoke, and therefore may range from very light to black"],["Clarity","Varies with underlying beer style"],["Malt aroma & flavor","Varies with underlying beer style"],["Hop aroma & flavor","Varies with underlying beer style"],["Bitterness","Varies with underlying beer style"],["Fermentation","For Smoke Beers based on lager styles, any phenolic notes (if present) should be derived from smoke; in such lagers yeast-derived phenolics should not be present."],["Body","Varies with underlying beer style"],["Notes","Any style of beer can be smoked. The goal is to reach a balance between the style's character and the smoky properties. Any smoke beer that does not fit other smoke beer categories are appropriately categorized here. To allow for accurate judging the brewer must list the smoke source (wood-based or otherwise), and may list any other ingredients or processes used. The brewer must also indicate the classic or experimental ale or lager style of the underlying base beer (e.g. ‘tea-smoked dry stout’); the brewer may indicate ‘no classic style’ in instances where the base beer does not hew to a category within these competition guidelines (e.g. ‘alder smoked ale, no classic style’). Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"38","name":"American-Style Light Lager","has":true,"subs":[{"id":"38A","name":"American-Style Light Lager","cat":"American-Style Light Lager","st":[["Original gravity","1.024-1.04"],["Final gravity","0.9921.008"],["ABV","3.50%-4.40%"],["IBU","4-10"],["Color SRM (EBC)","1.5-4 (3-8 EBC)"]],"d":[["Color","Very light to pale"],["Clarity","Chill haze should not be present"],["Malt aroma er 12 oz. (355 ml)"]]}]},{"n":"39","name":"International Light Lager","has":true,"subs":[{"id":"39A","name":"International Light Lager","cat":"International Light Lager","st":[["Original gravity","1.038-1.046"],["Final gravity","1.0061.01"],["ABV","4.10%-5.10%"],["IBU","9-18"],["Color SRM (EBC)","2-5 (4-10 EBC)"]],"d":[["Color","Straw to gold"],["Clarity","Chill haze should not be present"],["Malt aroma & flavor","Malt sweetness is absent"],["Hop aroma & flavor","Not present to very low"],["Bitterness","Very low"],["Fermentation","Sugar adjuncts are often used to lighten the body and flavor, sometimes contributing to very low to low fruity esters such as apple or pear. DMS, diacetyl, and acetaldehyde should not be present."],["Body","Low"],["Notes","Sugar, corn, rice, and other cereal grains or carbohydrates sources are used as adjuncts."]]},{"id":"39B","name":"German-Style Leichtbier","cat":"International Light Lager","st":[["Original gravity","1.026-1.034"],["Final gravity","1.0061.01"],["ABV","2.50%-3.70%"],["IBU","16-24"],["Color SRM (EBC)","2-4 (4-8 EBC)"]],"d":[["Color","Straw to pale"],["Clarity","Appearance should be clear. Chill haze should not be present"],["Malt aroma & flavor","Low to medium"],["Hop aroma & flavor","Low to medium"],["Bitterness","Medium"],["Fermentation","Fruity esters and diacetyl should not be present. Very low levels of sulfurrelated compounds are acceptable."],["Body","Very low"]]}]},{"n":"40","name":"Mexican-Style Light Lager","has":false,"subs":[{"id":"40","name":"Mexican-Style Light Lager","cat":"Mexican-Style Light Lager","st":[["Original gravity","1.026-1.044"],["Final gravity","1.0031.01"],["ABV","3.20%-4.20%"],["IBU","8-17"],["Color SRM (EBC)","2-3 (4-6 EBC)"]],"d":[["Color","Straw to pale gold"],["Clarity","Appearance should be clear; Chill haze should not be present"],["Malt aroma & flavor","Low to medium-low pale malt sweetness and aroma may be present. May have adjunct flavors from corn and/or rice"],["Hop aroma & flavor", y be present. Rice character may range from clean and neutral to expressive including nutty, savory, or aromatic notes depending on variety of rice used."],["Hop aroma & flavor","Low to medium and in harmony with malt profile. Hops should not dominate"],["Bitterness","Low to medium"],["Fermentation","Clean, neutral fermentation profile. Very low fruity esters may be present. Acetaldehyde, DMS or diacetyl should not be present."],["Body","Low to medium"],["Notes","These beers are brewed with 15% or more rice. Rice expression may vary in the beer, from neutral to very expressive and may exhibit flavor and aroma profiles of the specific rice varietal used, as well as a clean, dry finish. Hops should be integrated and not pronounced. Beers featuring a dominant hop or dryhop profile are classified into other hoppy lager categories."]]}]},{"n":"45","name":"International-Style Pilsener","has":false,"subs":[{"id":"45","name":"International-Style Pilsener","cat":"International-Style Pilsener","st":[["Original gravity","1.04-1.052"],["Final gravity","1.0081.014"],["ABV","4.60%-5.30%"],["IBU","15-40"],["Color SRM (EBC)","3-6 (6-12 EBC)"]],"d":[["Color","Straw to gold"],["Clarity","Appearance should be clear. Chill haze should not be present"],["Malt aroma & flavor","A malty sweet aroma and flavor may be present at low levels, along with adjunct flavors from corn, rice, wheat or other grains."],["Hop aroma & flavor","Low to medium"],["Bitterness","Low to medium"],["Fermentation","Very low levels of DMS aroma and flavor are acceptable. Fruity esters and isoamyl acetate may be allowable in minimal levels (at the edge of perception). Acetaldehyde, and diacetyl should not be present."],["Body","Low to medium"],["Notes","These beers are often brewed with rice, corn, wheat, or other grains and may exhibit flavor profiles of those specific adjuncts used. Sugar adjuncts may also be used."]]}]},{"n":"46","name":"American Pilsener","has":true,"subs":[{"id":"46A","name":"American-Style Pi nolic, fruity and/or acidic aromas and flavors. The unique combination of yeast and lactic acid bacteria fermentation yields a beer that is acidic and highly attenuated."],["Body","Very low"],["Notes","Carbonation is high. Specialty Berliners are brewed or served with fruit or fruit syrups, spices or herbal syrups, darker malts or a wide range of other ingredients, and will exhibit sensory attributes typical of those ingredients, such as hue, aroma, taste and body. To allow for accurate judging, brewers must list the fruit(s), herb(s) or spice(s), darker malt(s) or other flavor(s) or ingredients used which differentiate these beers from traditional Berliners. Entries not accompanied by this information will be at a disadvantage during judging.."]]}]},{"n":"65","name":"Gose","has":true,"subs":[{"id":"65A","name":"Leipzig-Style Gose","cat":"Gose","st":[["Original gravity","1.036-1.056"],["Final gravity","1.0081.012"],["ABV","4.40%-5.40%"],["IBU","5-15"],["Color SRM (EBC)","2-7 (4-14 EBC)"]],"d":[["Color","Straw to light amber"],["Clarity","Clear to hazy. Haze may or may not be from yeast."],["Malt aroma & flavor","Malt sweetness and attributes are not present to very low"],["Hop aroma & flavor","Not present"],["Bitterness","Not present to low"],["Fermentation","Medium to high lactic acid character should be present and expressed as a sharp, refreshing sourness. These beers are not excessively aged."],["Body","Low to medium-low"],["Notes","These beers typically contain malted barley and unmalted wheat, with some versions also containing oats. Salt (table salt) and coriander may be present in low amounts. A Gose brewed with fruit(s), spices (other than salt or coriander), darker malts or other ingredients is categorized as Contemporary-Style Gose. Carbonation is high to very high. Effervescent. To allow for accurate judging the brewer must list any special ingredient(s) used, such as grains, citrus, salt, coriander or others if present. The brewer may provide information about the brewing process that influences sensory outcomes. Beer entries not accompanied by this information will be at a disadvantage during judging.."]]},{"id":"65B","name":"Contemporary Gose","cat":"Gose","st":[["Original gravity","1.036-1.056"],["Final gravity","1.0081.012"],["ABV","4.40%-5.40%"],["IBU","5-30"],["Color SRM (EBC)","3-9 (6-18 EBC)"]],"d":[["Color","Usually straw to medium amber and can take on the color of added fruits or other ingredients such as darker malts."],["Clarity","Clear to hazy. Haze may or may not result from yeast"],["Malt aroma & flavor","Malt aroma and flavor is not present to very low"],["Hop aroma & flavor","Very low to low"],["Bitterness","Not present to medium"],["Fermentation","Horsey, leathery, or earthy aromas contributed by Brettanomyces yeasts may be present but at low levels as these beers do not undergo prolonged aging. Contemporary Gose may be fermented with pure beer yeast strains, or with yeast mixed with bacteria. Alternatively, they may be spontaneously fermented. Low to medium lactic acid character is present in all examples expressed as a sharp, refreshing sourness."],["Body","Low to medium-low"],["Notes","Contemporary-Style Gose may be brewed with malted or unmalted barley, wheat, and oats. Contemporary examples may also contain other grains. As in traditional examples, low level salt (table salt) and coriander additions may or may not be present in Contemporary Gose. Attributes from the use of a wide variety of herbs, spices, flowers, fruits, or other ingredients not found in traditional Leipzig-Style Gose may also be present and in harmony with overall flavor profile. To allow for accurate judging brewer must list the grain(s), spice(s), fruit(s) or other flavor(s) or ingredients used, and/or information about the brewing process such as ageing, bacteria or yeast used if any, which differentiate these beers from traditional Gose. Beer entries not accompanied by this information will be at a disadvantage during
