aracter are categorized as Smoke Beer."]]},{"id":"71B","name":"Scottish-Style Heavy Ale","cat":"Scottish-Style Ale","st":[["Original gravity","1.035-1.04"],["Final gravity","1.011.014"],["ABV","3.50%-4.10%"],["IBU","12-20"],["Color SRM (EBC)","8-30 (16-60 EBC)"]],"d":[["Color","Amber to dark brown"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Malty, caramel aroma is present. The style exhibits a medium degree of sweet malt and caramel. The overall impression is smooth and balanced."],["Hop aroma & flavor","Should not be present"],["Bitterness","Perceptible but low"],["Fermentation","Yeast attributes such as diacetyl and sulfur are acceptable at very low levels. Bottled versions may contain higher amounts of carbon dioxide than is typical for lightly carbonated draft versions. Fruity esters, if present, are low."],["Body","Medium with a soft chewy character"],["Notes","These beers differ significantly from Scotch Ale, especially regarding original gravity, alcohol content, and malt attributes. While there are conflicting theories as to whether traditional Scottish Heavy Ale exhibited peat smoke character, the current marketplace offers many examples with peat smoke character present at low to medium-low levels. Peat smoke attributes may be absent or present at low to medium-low levels. Versions exhibiting higher levels of smoke character are categorized as Smoke Beer."]]},{"id":"71C","name":"Scottish-Style Export Ale","cat":"Scottish-Style Ale","st":[["Original gravity","1.04-1.05"],["Final gravity","1.011.018"],["ABV","4.10%-6.00%"],["IBU","15-25"],["Color SRM (EBC)","9-19 (18-38 EBC)"]],"d":[["Color","Medium amber to dark chestnut brown"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Sweet malt and caramel aromas and flavors define the character of a Scottish Export"],["Hop aroma & flavor","Should not be present"],["Bitterness","Low to medium"],["Fermentation","Fruity esters, if present, are low. Yeast attributes such as diacetyl and sulfur are acceptable at very low levels. Bottled versions may contain higher amounts of carbon dioxide than is typical for lightly carbonated draft versions."],["Body","Medium"],["Notes","These beers differ significantly from Scotch Ale, especially regarding original gravity, alcohol content, and malt attributes. While there are conflicting theories as to whether traditional Scottish Export Ale exhibited peat smoke character, the current marketplace offers many examples with peat smoke character present at low to medium-low levels. Peat smoke attributes may be absent or present at low to medium-low levels. Versions exhibiting higher levels of smoke character are categorized as Smoke Beer."]]}]},{"n":"72","name":"Irish-Style Red Ale","has":false,"subs":[{"id":"72","name":"Irish-Style Red Ale","cat":"Irish-Style Red Ale","st":[["Original gravity","1.04-1.048"],["Final gravity","1.011.014"],["ABV","4.00%-4.80%"],["IBU","20-28"],["Color SRM (EBC)","11-18 (22-36 EBC)"]],"d":[["Color","Copper-red to reddish-brown"],["Clarity","Chill haze or yeast haze may be present at low levels"],["Malt aroma & flavor","Low to medium candy-like caramel malt sweetness should be present in flavor. A toasted malt character should be present, and there may be a slight roast barley or roast malt presence."],["Hop aroma & flavor","Not present to medium"],["Bitterness","Medium"],["Fermentation","Low level fruity esters are acceptable. Diacetyl is usually absent in these beers but may be present at very low levels."],["Body","Medium"]]}]},{"n":"73","name":"English-Style Brown Ale","has":false,"subs":[{"id":"73","name":"English-Style Brown Ale","cat":"English-Style Brown Ale","st":[["Original gravity","1.04-1.05"],["Final gravity","1.0081.014"],["ABV","4.20%-6.00%"],["IBU","12-25"],["Color SRM (EBC)","12-45 (24-90 EBC)"]],"d":[["Color","Copper to Black"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Roast malt may contribute to a biscuit or toasted aroma profile. Roast malt may contribute to the flavor profile. Malt profile can range from dry to sweet."],["Hop aroma & flavor","Very low"],["Bitterness","Very low to low"],["Fermentation","Low to medium-low level fruity esters are appropriate. Diacetyl is usually absent in these beers but may be present at very low levels."],["Body","Medium"]]}]},{"n":"74","name":"Belgian-Style Witbier","has":false,"subs":[{"id":"74","name":"Belgian-Style Witbier","cat":"Belgian-Style Witbier","st":[["Original gravity","1.038-1.05"],["Final gravity","1.0081.014"],["ABV","4.00%-5.50%"],["IBU","10-17"],["Color SRM (EBC)","2-4 (4-8 EBC)"]],"d":[["Color","Straw to pale"],["Clarity","Unfiltered starch and yeast haze should be visible. Wits are traditionally bottle conditioned and served cloudy."],["Malt aroma & flavor","Low, but with a noticeable wheat character"],["Hop aroma & flavor","Hop aroma is not present to low. Hop flavor is not present."],["Bitterness","Low, from noble-type hops."],["Fermentation","Low to medium fruity esters are present. Mild phenolic spiciness and yeast flavors may be present. Mild acidity is appropriate. Diacetyl should not be present."],["Body","Medium, with a degree of creaminess from wheat starch and/or oats."],["Notes","Witbiers are brewed with malted barley, unmalted wheat and sometimes oats. Since the 1960's, they are brewed with coriander and orange peel; modern versions sometimes feature other spices or citrus peel types. If present, characteristics of added spice should be balanced and not overpower other flavor attributes."]]}]},{"n":"75","name":"Saison","has":true,"subs":[{"id":"75A","name":"Classic Saison","cat":"Saison","st":[["Original gravity","1.040-1.060"],["Final gravity","1.0041.008"],["ABV","4.50%-6.50%"],["IBU","20-38"],["Color SRM (EBC)","2-15 (4-30 EBC)"]],"d":[["Color","Straw to amber"],["Clarity","Chill haze or slight yeast haze is acceptable"],["Malt aroma & flavor","Low, but providing foundation for the overall balance. If used, specialty grains (malted or unmalted wheat, spelt, etc.) may have a noticeable character."],["Hop aroma & flavor","Medium to high and characterized by any of floral, herbal, spicy, woody or other attributes typical of traditional European-type hops."],["Bitterness","Medium-low to high, but not assertive."],["Fermentation","Fruity esters are medium to medium-high. Low to medium-low level phenolics may or may not be present. If present, phenolics should not be harsh or dominant and should be in harmony with ester profile and hops with spice-like or other attributes. Fruity and spicy attributes derived from Belgian yeast are common. Diacetyl should not be present. In more traditional versions, Brettanomyces yeast-derived aroma and flavor attributes including any of slightly acidic, fruity, horsey, goaty, or leather-like, may be present. These beers are well attenuated and often bottle conditioned contributing some yeast character and sometimes high carbonation."],["Body","Very low to low"],["Notes","Classic saisons are well attenuated, should have a refreshing character, high drinkability and be well balanced. Versions which exhibit sensory attributes typical of wood-aging are characterized as Specialty Saison."]]},{"id":"75B","name":"Specialty Saison","cat":"Saison","st":[["Original gravity","1.04-1.08"],["Final gravity","1.0051.014"],["ABV","5.00%-9.30%"],["IBU","20-40"],["Color SRM (EBC)","3-20 (6-40 EBC)"]],"d":[["Color","Straw to dark brown; may take on hue of fruit(s), darker malts, or other ingredients"],["Clarity","Chill haze or slight yeast haze is acceptable"],["Malt aroma & flavor","Typically low to medium-low, but may vary in beers made with specialty malts."],["Hop aroma & flavor","Low to medium-high"],["Bitterness","Medium to medium-high"],["Fermentation","Fruity esters are medium to high. Diacetyl should not be present. Complex alcohols, herbs, spices, low Brettanomyces attributes including slightly acidic, fruity, horsey, goaty and leatherlike, as well as clove-like and smoky phenolics may be present but should stay in balance. Herb or spice flavors may be present. A low level of sour acidic flavor is acceptable when in balance with other components. Because these beers are often bottle conditioned, they may display some yeast character and high carbonation."],["Body","Low to medium"],["Notes","Specialty Saison represents a very wide family of beers which deviate substantially from Classic Saison in appearance and sensory outcomes. Such beers may be brewed with dark malts, fruit(s), spice(s), or a wide range of ingredients. Ingredients including spices, herbs, flowers, fruits, vegetables, fermentable sugars and carbohydrates, special yeasts of all types, wood-aging, etc. may contribute unique attributes to these beers. Earthy aromas are acceptable. Color, body, malt character, esters, alcohol level, and hop character should harmonize with attributes from special ingredients. Versions of Saison which exhibit sensory attributes typical of wood-aging are categorized as Specialty Saison. To allow for accurate judging, brewers must list the fruit(s), herb(s) or spice(s), darker malt(s) or other flavor(s), ingredients or wood-aging used which differentiate these beers from Classic Saison. Entries not accompanied by this information will be at a disadvantage during judging.."]]}]},{"n":"76","name":"Belgian-Style Abbey Ale","has":true,"subs":[{"id":"76A","name":"Belgian-Style Blonde Ale","cat":"Belgian-Style Abbey Ale","st":[["Original gravity","1.054-1.068"],["Final gravity","1.011.014"],["ABV","6.30%-7.90%"],["IBU","15-40"],["Color SRM (EBC)","2-7 (4-14 EBC)"]],"d":[["Color","Straw to light amber"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Low to medium"],["Hop aroma & flavor","Very low to medium. Noble-type hops are commonly used."],["Bitterness","Very low to medium-low"],["Fermentation","Medium to medium-high fruity esters are balanced with low to medium level malt attributes. Low level yeast-derived phenolic spiciness may be present. Diacetyl and acidic character should not be present."],["Body","Low to medium"]]},{"id":"76B","name":"Belgian-Style Dubbel","cat":"Belgian-Style Abbey Ale","st":[["Original gravity","1.06-1.075"],["Final gravity","1.0121.016"],["ABV","6.30%-7.60%"],["IBU","20-40"],["Color SRM (EBC)","16-36 (32-72 EBC)"]],"d":[["Color","Brown to very dark"],["Clarity","Chill haze is acceptable at low temperatures. Slight yeast haze may be present in bottle conditioned versions."],["Malt aroma & flavor","Any of cocoa, dark or dried fruit, or caramel aroma attributes should be present along with malty sweetness. Very low level of roasted aroma and flavor is acceptable."],["Hop aroma & flavor","Absent, or low if present."],["Bitterness","Medium-low to medium"],["Fermentation","Fruity esters are present at low to medium levels. Clove-like phenolic flavor and aroma may be present at low to medium-low levels. Diacetyl character should not be present."],["Body","Low to medium"],["Notes","Head should be dense and mousse-like. Herbs or spices such as coriander or others may be used in subtle amounts to enhance overall aroma or flavor, or may be absent."]]},{"id":"76C","name":"Other Belgian-Style Abbey Ale","cat":"Belgian-Style Abbey Ale","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","a wide range of color and appearance"],["Clarity","Varies with underlying style"],["Malt aroma & flavor","Varies with underlying style"],["Hop aroma & flavor","Varies with underlying style"],["Bitterness","Varies with underlying style"],["Fermentation","Varies with underlying style"],["Body","Varies with underlying style"],["Notes","Recognizing the uniqueness, variety and traditions of beers based on Belgian-style abbey ale, the beers entered in this subcategory do not fit existing competition style guidelines for Dubbel, Tripel or Quadrupel. Stronger versions of traditional Abbey Ale styles, such as Quintupel, etc., would be appropriately entered in this category. Versions of Abbey Ale styles made with spices, non-traditional hops or malts or other flavorings would be appropriately entered in this category. However, fruited versions of Belgian-style Abbey Ales are categorized as Belgian-Style Fruit Beers. To allow for accurate judging the brewer must provide additional information about the entry including the classic or historical style being elaborated upon, the regional tradition of the style, the brewer’s interpretation of the style and/or any special ingredients or processing used (‘Belgian Single brewed with ginger, oats and dark crystal malt’ for example). The brewer may indicate ‘no classic style’ in instances where the base beer does not hew to a category within these competition guidelines. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"77","name":"Belgian-Style Tripel","has":false,"subs":[{"id":"77","name":"Belgian-Style Tripel","cat":"Belgian-Style Tripel","st":[["Original gravity","1.063-1.092"],["Final gravity","1.0081.014"],["ABV","7.10%-10.10%"],["IBU","20-50"],["Color SRM (EBC)","4-9 (8-17.5 EBC)"]],"d":[["Color","Pale to light amber"],["Clarity","Chill haze is acceptable at low temperatures. Traditional Tripels are bottle conditioned and may exhibit slight yeast haze. However, yeast should not be intentionally roused."],["Malt aroma & flavor","Medium-low to medium malt aroma and sweetness from very pale malts should be present. There should be no roasted or dark malt character."],["Hop aroma & flavor","Low to medium noble-type hop aroma"],["Bitterness","Low to medium-high"],["Fermentation","A complex, sometimes mildly spicy, aroma and flavor characterize this style. Clove-like phenolic aroma and flavor may be present but at very low levels. Fruity esters should be present but in balance with the other aromas and flavors. Pear and banana esters are common. Traditional Tripels are well-attenuated. Fusel alcohols should remain in balance and not overwhelm the overall aroma and flavor. Warming alcohol strength and flavor should be present, but in balance with flavor."],["Body","Medium"],["Notes","Head should be dense and mousse-like. Herbs or spices such as coriander or others may be used in subtle amounts to enhance overall aroma or flavor, or may be absent. Brewing sugar is used to lighten the body. Hop/malt/alcohol character should be balanced. The overall beer flavor may finish sweet, though any sweet finish should be light due to alcohol content, not residual sugar."]]}]},{"n":"78","name":"Belgian-Style Strong Specialty Ale","has":true,"subs":[{"id":"78A","name":"Belgian-Style Strong Blonde Ale","cat":"Belgian-Style Strong Specialty Ale","st":[["Original gravity","1.064-1.096"],["Final gravity","1.008-1.018"],["ABV","7.10%-11.20%"],["IBU","20-50"],["Color SRM (EBC)","2-7 (4-14 EBC)"]],"d":[["Color","Straw to light amber"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Malt character is low to medium. A complex fruitiness is often present."],["Hop aroma & flavor","Medium-low to medium-high"],["Bitterness","Medium-low to medium-high"],["Fermentation","Medium to medium-high fruity esters are present. Yeast-derived phenolic spicy flavors and aromas may be present at low to medium-low levels. Fusel alcohols should remain in balance and not overwhelm overall aroma and flavor. Diacetyl should not be present."],["Body","Low to medium"],["Notes","These beers are often brewed with light-colored Belgian candy sugar. Herbs and spices are sometimes used to delicately flavor these strong ales. These beers can be malty in overall impression or dry and highly attenuated. They can have a deceptively high alcohol character and a relatively light body for beers of high alcoholic strength. Some versions may be equally high in alcohol with a more medium in body."]]},{"id":"78B","name":"Belgian-Style Strong Dark Ale","cat":"Belgian-Style Strong Specialty Ale","st":[["Original gravity","1.064-1.096"],["Final gravity","1.012-1.018"],["ABV","7.10%-11.20%"],["IBU","20-50"],["Color SRM (EBC)","8-40 (16-80 EBC)"]],"d":[["Color","Amber to very dark"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Medium to high malt aroma and complex fruity aromas are distinctive. Medium to high malt intensity can be rich, creamy, and sweet. Fruity complexity along with soft roasted malt flavor adds distinct character."],["Hop aroma & flavor","Low to medium"],["Bitterness","Low to medium"],["Fermentation","Yeast-derived phenolic spicy flavors and aromas may be present at low to medium-low levels. Complex low to medium-high intensity fruity esters are present and in harmony with malt and other attributes. Fusel alcohols must remain in balance and not overwhelm the overall aroma and flavor."],["Body","Medium to full"],["Notes","These beers are often (though not always) brewed with dark Belgian candy sugar. Herbs and spices are sometimes used to delicately flavor these strong ales. These beers are typically well attenuated with a deceptive alcoholic strength."]]},{"id":"78C","name":"Belgian-Style Quadrupel","cat":"Belgian-Style Strong Specialty Ale","st":[["Original gravity","1.092-1.12"],["Final gravity","1.0141.02"],["ABV","10.00%-14.20%"],["IBU","25-50"],["Color SRM (EBC)","16-36 (32-72 EBC)"]],"d":[["Color","Amber to dark brown"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Caramel, dark sugar and malty sweet flavors and aromas can be intense, but not cloying, and should complement fruitiness."],["Hop aroma & flavor","Not present to very low"],["Bitterness","Low to medium"],["Fermentation","Perception of alcohol can be strong. Complex fruity attributes reminiscent of any of raisins, dates, figs, grapes, or plums are often present and may be accompanied by wine-like attributes at low levels. Clove-like phenolic flavor and aroma may be present at low to medium-low levels. Noticeable ester profile. Fusel alcohols should remain in balance and not overwhelm overall aroma and flavor. Diacetyl and DMS should not be present."],["Body","Full with creamy mouthfeel"],["Notes","Head should be dense and mousse-like. Quadrupels are well attenuated and are characterized by an intense alcohol presence balanced by other flavors, aromas and bitterness. They are well balanced with savoring/sipping-type drinkability."]]},{"id":"78D","name":"Other Belgian-Style Strong Specialty Ale","cat":"Belgian-Style Strong Specialty Ale","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV",">7.1%"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Pale to very dark"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Malt perception may vary widely depending on style"],["Hop aroma & flavor","Low to medium"],["Bitterness","Low to medium"],["Fermentation","Low levels of phenolic spiciness may be present but are not required and, if present, should be well-integrated. Complex low to medium intensity fruity esters are present, in harmony with malt and other attributes. Fusel alcohols should remain in balance and not overwhelm the overall aroma and flavor. Within the framework of these guidelines, these beers contain alcohol greater than 5.6% abw or 7.1% abv when consumed. Alcohol may be evident in stronger versions, in harmony with other flavor and aroma attributes, and not harsh."],["Body","Varies with style"],["Notes","Recognizing the uniqueness, variety and traditions of beers based on Belgian-style strong specialty ale, beers entered in this subcategory do not fit existing competition style guidelines for Belgian-Style Strong Blonde or Strong Dark Ales or other hybrid American and or Belgian styles in this competition. Examples might include entries made with and which exhibit attributes of unusual spices or other ingredients. Fruited versions are characterized as Belgian-style fruit beer. Some barrel or wood-aged versions which do not primarily present as wood-aged entries, or other strong Belgian-style or Belgian inspired ales that defy categorization, would be appropriately entered in this category. To allow for accurate judging the brewer must provide additional information about the entry, including a classic Belgian Strong Ale style being elaborated upon, the historical or regional tradition of the style, the resulting beer based on the brewer’s interpretation of the style, and/or any special ingredients or processing used. The brewer may indicate ‘no classic style’ in instances where the base beer does not hew to a category within these competition guidelines. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"79","name":"Belgian-Style or Spontaneous Sour Ale","has":true,"subs":[{"id":"79A","name":"Belgian-Style Lambic","cat":"Belgian-Style or Spontaneous Sour Ale","st":[["Original gravity","1.044-1.065"],["Final gravity","1-1.01"],["ABV","5.00%-7.60%"],["IBU","11-23"],["Color SRM (EBC)","6-13 (12-26 EBC)"]],"d":[["Color","Gold to medium amber"],["Clarity","Cloudiness is acceptable"],["Malt aroma & flavor","Sweet malt character should not be present"],["Hop aroma & flavor","Not present to very low, and can include floral or other attributes. Hop character is often achieved by using stale or aged hops."],["Bitterness","Very low"],["Fermentation","Characteristic horsey, goaty, leathery and phenolic aromas and flavors derived from Brettanomyces yeast are often present at moderate levels. High to very high fruity esters are present. Traditionally, Lambics are unblended and spontaneously fermented. They express high to very high levels of fruity esters from Brettanomyces and other yeasts, as well as bacteria and wild yeast-derived sourness. Their primary sour character should be lactic. A slight amount of acetic sourness may sometimes be present but should never be harsh or overwhelming. Some modern versions are fermented with the addition of cultured yeast and bacteria. Carbonation can range from absent to very low. Wood-derived flavors may range from low to medium. Wood-vanillin, if present, should be low."],["Body","Low with dry mouthfeel"],["Notes","Lambics originating in the Brussels area of Belgium are often simply called Lambic. Versions of this beer style made outside of the Brussels area cannot be called true Lambics. These versions are said to be 'Belgian-Style Lambic' and may be made to resemble many of the beers of true origin. Historically, traditional Lambic is dry and very well-attenuated, exhibiting no residual sweetness either from malt, sugar, or other sweeteners. Sweet \"modern\" versions may be created through the addition of sugars or other sweeteners, in which case sweetness should be restrained and balanced by complexity and acidity. Traditionally, Lambics are brewed with unmalted wheat and malted barley. A pleasant lactic acidity should be present. Acetic acid character, if present, should be minimal."]]},{"id":"79B","name":"Belgian-Style Gueuze","cat":"Belgian-Style or Spontaneous Sour Ale","st":[["Original gravity","1.044-1.065"],["Final gravity","1-1.01"],["ABV","5.00%-8.00%"],["IBU","11-23"],["Color SRM (EBC)","6-13 (12-26 EBC)"]],"d":[["Color","Gold to medium amber"],["Clarity","Appearance can range from clear to low-medium cloudiness arising from yeast, as Gueuze is traditionally bottle conditioned."],["Malt aroma & flavor","Sweet malt character is not present"],["Hop aroma & flavor","Not present to very low and can include floral or other attributes."],["Bitterness","Very low"],["Fermentation","Gueuze represents blends of aged and newly fermenting young Lambics. These unflavored blended and secondary fermented beers may range from very dry or mildly sweet in modern versions. They are characterized by intense fruity ester, sour, and acidic attributes which only result from spontaneous fermentation. Diacetyl should not be present. Characteristic horsey, goaty, leathery and phenolic aromas and flavors derived from Brettanomyces yeast are often present at moderate levels. Wood-derived flavors may range from low to medium. Wood-vanillin, if present, should be low. Carbonation can range from medium to high."],["Body","Typically low with dry mouthfeel. Highly complex flavor profile can lend an impression of fullness."],["Notes","Gueuze originating in the Brussels area of Belgium, are often simply called Gueuze. Versions of this beer style made outside of the Brussels area are said to be 'Belgian-Style Gueuze'. The Belgianstyle versions are made to resemble many of the beers of true origin. Historically, traditional Gueuze is dry and well-attenuated, exhibiting no residual sweetness either from malt, sugar, or other sweeteners. Traditionally, Gueuze is brewed with unmalted wheat, malted barley, and stale, aged hops. A pleasant lactic acidity should be present. Acetic acid, if present, should be minimal."]]},{"id":"79C","name":"Belgian-Style Flanders Oud Bruin or Oud Red Ale","cat":"Belgian-Style or Spontaneous Sour Ale","st":[["Original gravity","1.044-1.056"],["Final gravity","1.0081.016"],["ABV","4.80%-6.60%"],["IBU","5-18"],["Color SRM (EBC)","12-25 (24-50 EBC)"]],"d":[["Color","Copper to very dark. SRM/EBC color values can be misleading because the red spectrum of color is not accurately assessed by these measurement systems."],["Clarity","Chill haze is acceptable at low temperatures. Bottle conditioned versions may appear cloudy when served."],["Malt aroma & flavor","Roasted malt aromas and flavors including cocoa are acceptable at low levels. Biscuit and light caramel aromas and flavors are typical. A low to medium level of malt sweetness if often present and should be balanced by acidity from Lactobacillus."],["Hop aroma & flavor","Not present"],["Bitterness","Very low to medium-low, though acidity and wood-aging (if used) may mask higher bitterness levels."],["Fermentation","Brettanomyces-produced aromas and flavors should be present in Oud Reds and may be present in Oud Bruins. Fruity esters expressed as cherry or green apple attributes are apparent. Very slight levels of ethyl acetate (red apple) my be present. Overall flavor of Oud Bruin is fundamentally characterized by medium low to high lactic sourness. Many versions express very low to medium acetic sourness and aroma; acetic sourness may also be absent."],["Body","Low to medium-low with a refreshing mouthfeel"],["Notes","These beers showcase a pleasant, complex, vinous character and a refreshing acidity. Oaky or woody flavors may be pleasantly integrated. Flavors of distilled spirits associated with used barrels should not be present. These beers are often a blend of old and young beer to create the brewer’s intended flavor balance."]]},{"id":"79D","name":"Contemporary Belgian-Style Spontaneous Fermented Ale","cat":"Belgian-Style or Spontaneous Sour Ale","st":[["Original gravity","1.044-1.072"],["Final gravity","1.0041.016"],["ABV","5.00%-8.90%"],["IBU","11-23"],["Color SRM (EBC)","6-40 (12-80 EBC)"]],"d":[["Color","Gold to very dark"],["Clarity","Cloudiness is acceptable, as these beers are frequently bottle conditioned."],["Malt aroma & flavor","Sweet malt character is not present. Some versions may exhibit attributes typical of specialty malts."],["Hop aroma & flavor","Not present to low and can include earthy, floral or other attributes typical of aged or unaged hops."],["Bitterness","Very low"],["Fermentation","These blended and secondary fermented beers may be very dry or mildly sweet. They are characterized by intense fruity ester, sour, and acidic attributes which only result from spontaneous fermentation. Diacetyl should not be present. Characteristic horsey, goaty, leathery, and phenolic aromas and flavors derived from Brettanomyces yeast are often present at moderate levels. Aged beer is often blended with young beer to create this special style. Vanillin and other wood-derived flavors may range from absent to present at up to low-medium levels. Carbonation can be none (flat) to high."],["Body","Very low with dry mouthfeel"],["Notes","Contemporary Belgian-Style Spontaneous Fermented Ales takes its inspiration from the Traditional Gueuze whose origin is the Brussels area of Belgium. But these beers incorporate specialty malts, spice(s), fruit(s), or many other diverse ingredients and processes that influence the hue, aroma and flavor outcomes of the finished beers such that they differ significantly from traditional examples. To allow for accurate judging the brewer must list the non-traditional malts, spice(s), fruit(s)/vegetable(s), sweeteners or any other ingredients or processes used which differentiate the entry from Traditional Belgian-Style Gueuze Lambic and which influence sensory outcomes. Beer entries not accompanied by this information will be at a disadvantage during judging.."]]},{"id":"79E","name":"Wild Beer","cat":"Belgian-Style or Spontaneous Sour Ale","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Any color is acceptable. Versions made with fruits or other flavorings may take on corresponding hues."],["Clarity","Clear or hazy due to yeast, chill haze or hop haze."],["Malt aroma & flavor","Generally, these beers are highly attenuated resulting in very low to low malt character. Maltier versions should display good overall balance with other flavor components."],["Hop aroma & flavor","Very low to high"],["Bitterness","Very low to low"],["Fermentation","Aromas may vary significantly due to fermentation attributes contributed by various known and unknown microorganisms. The overall balance should be complex and balanced. Wild beers are spontaneously fermented with microorganisms that the brewer has introduced from the ambient air/environment near the brewery in which the beer is brewed. Wild Beers may not be fermented with any cultured strains of yeast or bacteria. Wild Beers may or may not be perceived as acidic. They may include a highly-variable spectrum of flavors and aromas derived from the wild microorganisms with which they are fermented. The overall balance of flavors, aromas, appearance and body are important factors in assessing these beers."],["Body","Very low to medium"],["Notes","Spontaneously fermented beers with fruit, spice or other ingredients should be categorized as Wild Beers. Within the framework of these guidelines, beers which hew to classic or traditional categories such as Belgian-Style Lambic, Gueuze, Fruit Lambic, etc. should be categorized as such, rather than as Wild Beers. To allow for accurate judging the brewer must provide additional information about the entry including the classic ale, lager or experimental base style of beer allowed to spontaneously ferment, information about the process used, and/or other ingredient(s) such as fruit, spices, etc. if any. The brewer may indicate ‘no classic style’ in instances where the base beer does not hew to a category within these competition guidelines. Beer entries not accompanied by this information will be at a disadvantage during judging."]]},{"id":"79F","name":"Other Belgian-Style Sour Ale","cat":"Belgian-Style or Spontaneous Sour Ale","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with style; may take on hues from fruit(s), vegetable(s), darker malts or other ingredients"],["Clarity","Varies with style"],["Malt aroma & flavor","Typically none to very low. Darker versions may exhibit low to mediumlow attributes of darker malt(s), varying widely with style"],["Hop aroma & flavor","Hop aroma and hop flavor varies widely with style"],["Bitterness","Varies with style"],["Fermentation","Are evocative of those found in classic Belgian-style sour ales. Characteristic horsey, goaty, leathery and phenolic aromas and flavors derived from Brettanomyces yeast are often present at moderate levels. High to very high fruity-estery aromas are present as well as bacteria and yeast-derived sourness. Some versions are fermented with the addition of cultured yeast and bacteria. Carbonation can range from very low to high. Vanillin and other wood-derived flavors should not be evident."],["Body","Typically very low with dry mouthfeel due to high degree of attenuation, but may vary somewhat."],["Notes","Beers in this subcategory recognize the uniqueness and traditions of beers based on Belgian-style sour ale, but do not adhere to classic or contemporary Belgian-style sour ale categories defined in these guidelines. Entries in this subcategory will most closely approximate, but might deviate from Lambic, Fruit Lambic, Classic Gueuze, Contemporary Spontaneous Ale or Oud Bruin subcategories. Attributes from special ingredients are in harmony with the those from the underlying beer. Entries that exhibit distinct characters resulting from wood-aging might be categorized as Wood-aged sour beers or fruited versions thereof. Entries that represent significant departures from any of the other Belgian-Style Lambic or Sour Ale subcategories might be categorized as American-style sour ales or fruited or wood-aged versions thereof. To allow for accurate judging the brewer must provide additional information about the entry, including the underlying class Belgian sour style being elaborated upon, or, the historical or regional tradition of the style, or, the brewer’s interpretation of the style, and the special ingredients or processes that make the entry unique and influence sensory outcomes. Beer entries not accompanied by this information will be at a disadvantage during judging.."]]}]},{"n":"80","name":"Belgian-Style Fruit Beer","has":true,"subs":[{"id":"80A","name":"Belgian-Style Fruit Beer","cat":"Belgian-Style Fruit Beer","st":[["Original gravity","1.03-1.11"],["Final gravity","1.0061.03"],["ABV","2.50%-12.00%"],["IBU","5-30"],["Color SRM (EBC)","5-50 (10-100 EBC)"]],"d":[["Color","Can range from pale to dark depending on underlying Belgian style, and is often influenced by the color of added fruit"],["Clarity","Clear to hazy beer is acceptable"],["Malt aroma & flavor","Can vary from not perceived to medium-high"],["Hop aroma & flavor","Low to medium"],["Bitterness","Varies with underlying Belgian style"],["Fermentation","Acidic bacterial fermentation attributes may be absent or may be present; if present, such attributes contribute to acidity and enhance fruity balance."],["Body","Varies with style"],["Notes","Fruit aromas, ranging from subtle to intense, should be present and should not be overpowered by hop aromas. Belgian-Style Fruit Beers are fermented with traditional Belgian yeast, (Wit, Abbey, Farmhouse, etc.). Fruit or fruit extracts, used as adjuncts in either the mash, kettle, primary or secondary fermentation, provide harmonious fruit character ranging from subtle to intense. Classifying these beers can be complex. Within the framework of these guidelines a beer containing coconut is categorized as Field Beer. A beer containing chili peppers is categorized as Chili Beer. Because wood vessels may be used for fermentation or aging, attributes typical of wood-aging such as vanillin, or from liquids previously aged in wood may be present. Fruited Belgian-style beers which exhibit Brettanomyces may be categorized in this style. However, a fruited Saison exhibiting Brett character should be categorized as a Specialty Saison. A fruited version of a Brett Beer is categorized as Fruited Brett Beer when such a Brett-containing beer is not based on an existing underlying Belgian beer style. A Lambic-Style fruit beer should be categorized as a Belgian-Style Fruit Lambic. Fruited Belgian-Style beers brewed with additional adjuncts could fall in this category or perhaps as Experimental Beers. Fruit beers fermented with German, British or American ale or lager yeast should be categorized as American-Style Fruit Beers or as Fruit Wheat Beers. To allow for accurate judging the brewer must list the fruit(s) used, and any other ingredients or processes used. The brewer must also indicate the classic Belgian style of the underlying base beer. Beer entries not accompanied by this information will be at a disadvantage during judging.."]]},{"id":"80B","name":"Belgian-Style Fruit Lambic","cat":"Belgian-Style Fruit Beer","st":[["Original gravity","1.036-1.072"],["Final gravity","1.0081.016"],["ABV","4.0%-9.0%"],["IBU","1015"],["Color SRM (EBC)","Color takes on hue of fruit (Color takes on hue of fruit EBC)"]],"d":[["Color","Often influenced by the color of added fruit"],["Clarity","Cloudiness is acceptable"],["Malt aroma & flavor","Malt sweetness should be absent, but sweetness of fruit or sweeteners may be low."],["Hop aroma & flavor","Hop aroma and flavor is not present. Cheesy hop character should not be present."],["Bitterness","Very low"],["Fermentation","Characteristic horsey, goaty, leathery, and phenolic aromas and flavors derived from Brettanomyces yeast are often present at moderate levels. Lactic sourness is an important part of the flavor profile, though sweetness may compromise the intensity. Fruit sourness may also be an important part of the profile. Acetic character, if present, should be minimal and well-integrated. These flavored Lambic beers may be very dry or mildly sweet. If sweetness is present, it should be in balance and not overwhelm other aspects of beer."],["Body","Dry to full"],["Notes","These beers, also known by the names Framboise, Kriek, Peche, Cassis, etc., are characterized by fruit aromas and flavors. Fruit Lambics, whose origin is the Brussels area of Belgium, are often simply called Fruit Lambic. Versions of this beer style made outside of the Brussels area are said to be 'Belgian-Style Fruit Lambics'. The Belgian-style versions are made to resemble many of the beers of true origin. Historically, traditional Lambics are dry and well-attenuated, exhibiting no residual sweetness either from malt, sugar, fruit, or other sweeteners. Some versions often have a degree of sweetness contributed by fruit sugars, other sugars, or other sweeteners. See also Belgian-Style Lambic for additional background information. Vanillin and other wood-derived flavors may range from absent to present at up to low-medium levels, and, if present, are in harmony with attribute arising from fruit. To allow for accurate judging the brewer must provide additional information about the entry, including the fruit(s) used, the underlying classic Belgian sour style being elaborated upon, or, the historical or regional tradition of the style, or, the brewer’s interpretation of the style, and any other special ingredients or processes that make the entry unique and influence sensory outcomes. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"81","name":"American-Style Brown Ale","has":false,"subs":[{"id":"81","name":"American-Style Brown Ale","cat":"American-Style Brown Ale","st":[["Original gravity","1.04-1.06"],["Final gravity","1.011.018"],["ABV","4.20%-6.30%"],["IBU","30-45"],["Color SRM (EBC)","15-26 (30-52 EBC)"]],"d":[["Color","Deep copper to very dark brown"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Medium levels of roasted malt, caramel, and chocolate aromas and flavors should be present."],["Hop aroma & flavor","Medium-low to high. Hop flavor and aroma should be in balance with and never dominate malt aroma or flavor attributes."],["Bitterness","Medium to high"],["Fermentation","Low to medium-low fruity esters may be present. Diacetyl should not be present."],["Body","Medium"]]}]},{"n":"82","name":"Porter or Stout","has":true,"subs":[{"id":"82A","name":"Brown Porter","cat":"Porter or Stout","st":[["Original gravity","1.04-1.05"],["Final gravity","1.0061.014"],["ABV","4.40%-6.00%"],["IBU","20-30"],["Color SRM (EBC)","20-35 (40-70 EBC)"]],"d":[["Color","Dark brown to very dark. May have red tint."],["Clarity","Beer color may be too dark to perceive clarity. When clarity is perceivable, chill haze is acceptable at low temperatures."],["Malt aroma & flavor","Low to medium malt sweetness. Caramel and chocolate attributes are acceptable. Strong roast barley or strong burnt or black malt character should not be present."],["Hop aroma & flavor","Very low to medium"],["Bitterness","Medium"],["Fermentation","Fruity esters are acceptable. Diacetyl is usually absent in these beers but may be present at low levels."],["Body","Low to medium"]]},{"id":"82B","name":"Classic Irish-Style Dry Stout","cat":"Porter or Stout","st":[["Original gravity","1.038-1.048"],["Final gravity","1.0081.012"],["ABV","4.10%-5.30%"],["IBU","30-40"],["Color SRM (EBC)","40+ (80+ EBC)"]],"d":[["Color","Black"],["Clarity","Opaque"],["Malt aroma & flavor","The prominence of coffee-like roasted barley and a moderate degree of roasted malt aroma and flavor defines much of the character. The hallmark dry-roasted attributes typical of Dry Stout result from the use of roasted barley. Initial malt and light caramel flavors give way to a distinctive dry-roasted bitterness in the finish."],["Hop aroma & flavor","European hop character may range from not present to low in aroma and flavor"],["Bitterness","Medium to medium-high"],["Fermentation","Fruity esters are low relative to malt and roasted barley as well as hop bitterness. Diacetyl is usually absent in these beers but may be present at very low levels. Slight acidity may be present but is not required."],["Body","Medium-light to medium"],["Notes","Head retention should be persistent"]]}]},{"n":"83","name":"Robust Porter","has":false,"subs":[{"id":"83","name":"Robust Porter","cat":"Robust Porter","st":[["Original gravity","1.045-1.06"],["Final gravity","1.0081.016"],["ABV","5.10%-6.60%"],["IBU","25-40"],["Color SRM (EBC)","30+ (60+ EBC)"]],"d":[["Color","Very dark brown to black"],["Clarity","Opaque"],["Malt aroma & flavor","Medium to medium-high. Malty sweetness, roast malt, cocoa and caramel should be in harmony with bitterness from dark malts."],["Hop aroma & flavor","Very low to medium"],["Bitterness","Medium to high"],["Fermentation","Fruity esters should be present and balanced with all other characters. Diacetyl should not be present."],["Body","Medium to full"]]}]},{"n":"84","name":"Sweet Stout or Cream Stout","has":true,"subs":[{"id":"84A","name":"Sweet Stout or Cream Stout","cat":"Sweet Stout or Cream Stout","st":[["Original gravity","1.045-1.056"],["Final gravity","1.012-1.02"],["ABV","3.20%-6.30%"],["IBU","15-25"],["Color SRM (EBC)","40+ (80+ EBC)"]],"d":[["Color","Black"],["Clarity","Opaque"],["Malt aroma & flavor","Medium to medium-high. Malt aromas and flavor from chocolate and caramel malts should contribute to the aroma and should dominate the flavor profile. Roast flavor may be present. Low to medium-low roasted malt-derived bitterness should be present."],["Hop aroma & flavor","Should not be present"],["Bitterness","Low to medium-low and serves to balance and suppress some of the sweetness without contributing apparent flavor and aroma"],["Fermentation","Fruity esters, if present, are low. Diacetyl should not be present."],["Body","Full-bodied. Body can be increased with the addition of milk sugar (lactose)."],["Notes","While chocolate and caramel malt notes are the hallmark of this style, these characteristics should be malt-derived. For the purposes of this competition stouts with added cocoa, chocolate, or other flavoring adjuncts (aside from Lactose), should be entered into the Chocolate Beer, Dessert Beer, or other appropriate category."]]},{"id":"84B","name":"Oatmeal Stout","cat":"Sweet Stout or Cream Stout","st":[["Original gravity","1.038-1.056"],["Final gravity","1.0081.02"],["ABV","3.80%-6.10%"],["IBU","20-40"],["Color SRM (EBC)","20+ (40+ EBC)"]],"d":[["Color","Dark brown to black"],["Clarity","Beer color may be too dark to perceive. When clarity is perceivable, chill haze is acceptable at low temperatures."],["Malt aroma & flavor","Coffee, caramel, roasted malt, or chocolate aromas should be prominent. Roasted malt character of caramel or chocolate should be smooth without bitterness."],["Hop aroma & flavor","Optional, but if present should not upset the overall balance."],["Bitterness","Medium"],["Fermentation","Oatmeal is used in the grist, resulting in a pleasant, full flavor without being grainy. Fruity esters are not present to very low. Diacetyl is usually absent in these beers but may be present at very low levels."],["Body","Full with an often-silky mouthfeel"]]}]},{"n":"85","name":"American or Export Stout","has":true,"subs":[{"id":"85A","name":"American-Style Stout","cat":"American or Export Stout","st":[["Original gravity","1.05-1.075"],["Final gravity","1.011.022"],["ABV","5.70%-8.00%"],["IBU","35-60"],["Color SRM (EBC)","40+ (80+ EBC)"]],"d":[["Color","Black"],["Clarity","Opaque"],["Malt aroma & flavor","Coffee-like roasted barley and roasted malt aromas are prominent. Low to medium malt sweetness with any of caramel, chocolate, or roasted coffee attributes present at low to medium levels, with a distinct dry-roasted bitterness in the finish. Astringency from roasted malt and roasted barley is low. Slight roasted malt acidity is acceptable."],["Hop aroma & flavor","Medium to high, often with any of citrusy, resiny or other attributes typical of many American hop varieties."],["Bitterness","Medium to high"],["Fermentation","Fruity esters are low. Diacetyl is usually absent in these beers but may be present at very low levels."],["Body","Medium to full"],["Notes","Head retention should be persistent"]]},{"id":"85B","name":"Export Stout","cat":"American or Export Stout","st":[["Original gravity","1.052-1.072"],["Final gravity","1.008-1.02"],["ABV","5.60%-8.00%"],["IBU","30-60"],["Color SRM (EBC)","40+ (80+ EBC)"]],"d":[["Color","Black"],["Clarity","Opaque"],["Malt aroma & flavor","Coffee-like roasted barley and roasted malt aromas are prominent. Initial malt and light caramel flavors give way to a distinctive dry-roasted bitterness in the finish."],["Hop aroma & flavor","Low to medium-low"],["Bitterness","May be analytically high, but the perception is lessened by malt sweetness."],["Fermentation","Fruity esters are low. Diacetyl is usually absent in these beers but may be present at very low levels. Slight acidity is acceptable."],["Body","Medium to full"],["Notes","Head retention should be persistent"]]}]},{"n":"86","name":"Imperial Stout","has":true,"subs":[{"id":"86A","name":"British-Style Imperial Stout","cat":"Imperial Stout","st":[["Original gravity","1.08-1.1"],["Final gravity","1.021.03"],["ABV","7.00%-12.00%"],["IBU","45-65"],["Color SRM (EBC)","20-35+ (40-70+ EBC)"]],"d":[["Color","Ranging from dark copper typical of some historic examples, to very dark more typical of contemporary examples"],["Clarity","Opaque in darker versions. When clarity is perceivable, chill haze is acceptable at low temperatures."],["Malt aroma & flavor","Extremely rich malty flavor, often expressed as toffee or caramel, and may be accompanied by very low roasted malt astringency."],["Hop aroma & flavor","Very low to medium, with floral, citrus or herbal qualities."],["Bitterness","Medium and should not overwhelm the overall balance. The bitterness may be higher in darker versions while maintaining balance with sweet malt."],["Fermentation","Fruity esters can be medium to high. Diacetyl should not be present."],["Body","Full"],["Notes","This style was also originally called 'Russian Imperial Stout'."]]},{"id":"86B","name":"American-Style Imperial Stout","cat":"Imperial Stout","st":[["Original gravity","1.08-1.1"],["Final gravity","1.021.03"],["ABV","7.00%-12.00%"],["IBU","50-80"],["Color SRM (EBC)","40+ (80+ EBC)"]],"d":[["Color","Black"],["Clarity","Opaque"],["Malt aroma & flavor","Extremely rich malty aroma is typical. Extremely rich malty flavor with full sweet malt character is typical. Roasted malt astringency and bitterness can be moderate but should not dominate the overall character."],["Hop aroma & flavor","Medium-high to high, exhibiting any of floral, citrus, herbal, or any other attributes typical of American hops."],["Bitterness","Medium-high to very high and balanced with rich malt character."],["Fermentation","High Alcohol content is evident. Fruity esters can be high. Diacetyl should not be present."],["Body","Full"]]}]},{"n":"87","name":"Strong British Ale or Aged Beer","has":true,"subs":[{"id":"87A","name":"Unpeated Scotch Ale","cat":"Strong British Ale or Aged Beer","st":[["Original gravity","1.072-1.085"],["Final gravity","1.016-1.028"],["ABV","6.60%-8.50%"],["IBU","25-35"],["Color SRM (EBC)","15-30 (30-60 EBC)"]],"d":[["Color","Light reddish-brown to very dark"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Scotch Ales are aggressively malty with a rich and dominant sweet malt aroma and flavor. A caramel character is often part of the profile. Dark roasted malt flavors may be present at low levels."],["Hop aroma & flavor","Not present to very low"],["Bitterness","Not present to very low"],["Fermentation","Fruity esters, if present, are generally at low levels. Diacetyl is usually absent in these beers but may be present at low levels."],["Body","Full"],["Notes","Pleasant, low-level oxidation is acceptable in Scotch Ales. Examples exhibiting more prevalent oxidation are categorized as Aged Beer. Within the framework of these competition guidelines, entries in this subcategory will not exhibit peaty/smoky character. Entries exhibiting low to medium level peat smoke attributes are categorized as Peated Scotch Ale."]]},{"id":"87B","name":"Peated Scotch Ale","cat":"Strong British Ale or Aged Beer","st":[["Original gravity","1.072-1.085"],["Final gravity","1.016-1.028"],["ABV","6.60%-8.50%"],["IBU","25-35"],["Color SRM (EBC)","15-30 (30-60 EBC)"]],"d":[["Color","Light reddish-brown to very dark"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Scotch Ales are aggressively malty with a rich and dominant sweet malt aroma and flavor. A caramel character is often part of the profile. Dark roasted malt flavors may be evident at low levels."],["Hop aroma & flavor","Not present to very low"],["Bitterness","Not present to very low"],["Fermentation","Fruity esters, if present, are generally at low levels. Diacetyl is usually absent in these beers but may be present at low levels."],["Body","Full"],["Notes","Pleasant, low level oxidation is acceptable in Scotch Ales. Examples exhibiting more prevalent oxidation are categorized as Aged Beer. Within the framework of these competition guidelines, entries in this subcategory will exhibit low to medium peaty/smoky character. Versions exhibiting higher levels of smoke character are categorized as Smoke Beer. Entries exhibiting no peat smoke attributes are categorized as Unpeated Scotch Ale.."]]},{"id":"87C","name":"Old Ale","cat":"Strong British Ale or Aged Beer","st":[["Original gravity","1.058-1.088"],["Final gravity","1.014-1.03"],["ABV","6.30%-9.10%"],["IBU","30-60"],["Color SRM (EBC)","12-30 (24-60 EBC)"]],"d":[["Color","Copper-red to very dark"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Fruity esters can enhance and complement the malt aroma and flavor profile. Old Ales have malt and sometimes caramel sweetness."],["Hop aroma & flavor","Very low to medium"],["Bitterness","Present but minimal, and balanced with malt flavors."],["Fermentation","Fruity esters can contribute to the character of these beers. Alcohol types can be varied and complex. A distinctive quality of Old Ales is that they undergo an aging process, often for years. Aging can occur on their yeast either in bulk storage or through conditioning in the bottle. This contributes to a rich, wine-like, and often sweet, oxidized character. Complex estery attributes may also emerge. Diacetyl is usually absent in these beers but may be present at very low levels."],["Body","Medium to full"],["Notes","Low level attributes typical of wood aging such as vanillin are acceptable. Brettanomyces and acidity reflect historical character; low level attributes such as horsey, goaty, leathery, phenolic, etc. and acidity may be present and balanced with other flavors. Attributes arising from liquids previously aged in a barrel, such as bourbon or sherry, should not be present. Beers that exhibit such attributes are categorized as wood- and barrel-aged beers."]]},{"id":"87D","name":"Strong Ale","cat":"Strong British Ale or Aged Beer","st":[["Original gravity","1.06-1.125"],["Final gravity","1.0141.04"],["ABV","7.00%-11.30%"],["IBU","30-60"],["Color SRM (EBC)","8-21 (16-42 EBC)"]],"d":[["Color","Amber to dark brown"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Medium to high malt and caramel sweetness. Very low levels of roast malt may be present."],["Hop aroma & flavor","Not present to very low"],["Bitterness","Present but minimal, and balanced with malt flavors."],["Fermentation","Rich, often sweet and complex fruity ester attributes can contribute to the profile of Strong Ales. Alcohol types can be varied and complex. Diacetyl is usually absent in these beers but may be present at very low levels."],["Body","Medium to full"]]},{"id":"87E","name":"Aged Beer","cat":"Strong British Ale or Aged Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with underlying style"],["Clarity","Varies with underlying style"],["Malt aroma & flavor","Varies with underlying style"],["Hop aroma & flavor","Varies with underlying style"],["Bitterness","Varies with underlying style"],["Fermentation","Aged Beers are any beers aged for over one year. A brewer may brew any type of beer of any strength and enhance its character with various aging conditions for an extended time. In general, beers with high hopping rates, roast malt, high alcohol content, and complex herbal, smoke or fruit character are the best candidates for aging. Aged Beers may be aged in bottles, cans, kegs or other nonwooden vessels. Aged character may be expressed in mouthfeel, aroma, and flavor. Often, aged character is the result of oxidative reactions that either bring individual flavor components into harmony or are unique flavors unto themselves. Sherry-like and fruity flavors often develop during aging, and hop character often changes. No matter what the effect, the overall character should be balanced and without aggressive flavors. The level of change created by aging will vary with the duration of aging and the underlying beer style. Mildlyflavored beers are more likely to develop aggressive and unpleasant oxidation. Positive transformations are more likely to occur in beers with higher levels of hops, malt, or alcohol."],["Body","Varies with underlying style"],["Notes","Within the framework of these guidelines, various Wood- and Barrel-Aged Beers which subsequently undergo aging of one or more years in glass or stainless, and, which clearly exhibit sensory outcomes of that additional aging, may be categorized as Aged Beers. However, Brett Beers, Sour Beers or any other beers exhibiting attributes of aging in the presence of any microflora must be categorized elsewhere. Beers which have undergone aging, but which do not exhibit attributes typical of aging, are categorized within their base styles. To allow for accurate judging the brewer must provide additional information about the entry including the classic ale, lager or experimental style of the beer being aged, experimental or interesting techniques or ingredients, length of aging time, the material in which the s are often high. Diacetyl is usually absent in these beers but may be present at very low levels."],["Body","Full"],["Notes","Vinous, sherry-like, or port-like attributes arising from oxidation may be considered positive when in harmony with overall flavor profile. Low carbonation may be acceptable in this style. Low levels of wood- or barrel-derived character are acceptable if the base Barleywine remains the primary sensory impression."]]},{"id":"88C","name":"American-Style Wheat Wine Ale","cat":"Barley Wine or Wheat Wine","st":[["Original gravity","1.088-1.12"],["Final gravity","1.0241.032"],["ABV","8.50%-12.20%"],["IBU","45-85"],["Color SRM (EBC)","5+ (10+ EBC)"]],"d":[["Color","Gold to black"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Any of bready, wheat, honey or caramel malt aroma and flavor attributes are often present. High residual malt sweetness should be present."],["Hop aroma & flavor","Low to medium"],["Bitterness","Medium to medium-high"],["Fermentation","Fruity esters are often high and balanced by a complexity of alcohols and high alcohol content. Diacetyl is usually absent in these beers but may be present at very low levels. Phenolic yeast character, sulfur, and DMS should not be present. Oxidized, stale, and aged attributes are not typical of this style."],["Body","Full"],["Notes","This style is brewed with at least 50% wheat malt."]]}]},{"n":"89","name":"International-Style Pale Ale","has":true,"subs":[{"id":"89A","name":"International-Style Pale Ale","cat":"International-Style Pale Ale","st":[["Original gravity","1.04-1.06"],["Final gravity","1.0061.014"],["ABV","4.40%-6.60%"],["IBU","20-42"],["Color SRM (EBC)","5-12 (10-24 EBC)"]],"d":[["Color","Gold to copper"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Very low to medium malt flavor and aroma should be present. Low caramel malt aroma and flavor may be present."],["Hop aroma & flavor","Hop aroma is low to high. , spices, or other flavorings are categorized as Specialty India Pale Ale. Any use of thiolized yeasts, terpene blends or any other advanced hop products should not overwhelm the beer and should be in harmony with overall flavor profile"]]}]},{"n":"103","name":"Fresh Hop Beer","has":false,"subs":[{"id":"103","name":"Fresh Hop Beer","cat":"Fresh Hop Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with underlying style"],["Clarity","Chill haze is acceptable at low temperatures. Hop haze is allowable at any temperature."],["Malt aroma & flavor","Varies with underlying style"],["Hop aroma & flavor","Fresh hop aroma and flavor is prominent exhibiting green grass-like, fresh mown hay/grass or other fresh hop attributes."],["Bitterness","Varies with underlying style"],["Fermentation","Fruity esters may present at levels consistent with the underlying beer style being made with fresh hops"],["Body","Varies with underlying style"],["Notes","These ales or lagers are brewed with freshly harvested hops, typically no more than 72 hours prior to being added. Such hops might be undried fresh or frozen cones or ground material, or freshly kilned dried cones or pellets. Due to the large volume of plant material these beers encounter during the brewing and/or conditioning process, they should exhibit some perceptible chlorophyllic character, mouthfeel, and/or texture that should be harmonious with base style characteristics. These beers distinctly highlight the fresh hops used and are typically consumed while fresh to maximize the bright fresh hop attributes. Aging these beers will typically modify and reduce fresh-hop characters resulting in unique flavor outcomes. Within the framework of these guidelines, Fresh Hop India Pale Ales are classified as Fresh Hop Beers rather than Specialty India Pale Ales. To allow for accurate judging the brewer must identify an underlying ale or lager beer style being elaborated upon with fresh hops. The brewer may indicate 'no classic style' in instances where the base beer does not hew to a category within these competition guidelines. The brewer may also name the fresh hop variety(ies) used, and may include processing information such as the process point or vessel when fresh hops were added (kettle, whirlpool, hop back, fermenter, bright tank, etc. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"104","name":"Craft Malt Beer","has":false,"subs":[{"id":"104","name":"Craft Malt Beer","cat":"Craft Malt Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","-"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with underlying style, if any."],["Clarity","Varies with underlying style, if any."],["Malt aroma & flavor","Varies with underlying style (if any) but should be apparent and showcase profile of malt(s) used."],["Hop aroma & flavor","Varies with underlying style, if any. Hop flavor and aroma should provide balance but not dominate the unique expression of the varying types of malt used in the beer."],["Bitterness","Varies with underlying style, if any. Hop bitterness should provide balance but not dominate the unique expression of the varying types of malt used in the beer."],["Fermentation","Varies with underlying style, if any."],["Body","Varies with underlying style, if any."],["Notes","Beers in this category contain at least 50% of the malt produced at a craft maltster. For the purpose of this competition, craft malt is described as the product of a craft malt house that produces less than 10,000 metric tons per year with over 50% of the grains malted are grown within a 500-mile radius of the malthouse. Beers may exhibit the characteristics of a classic or experimental style. Brewers are asked to provide supplemental information about entries in this category to allow for accurate evaluation of diverse entries. Such information might include an underlying beer style(s) upon which the entry is based (if such style(s) is apparent), or other information unique to the entry such as types and percentage of craft malt used which influence perceived sensory outcomes. Brewers who do not provide this information may be at a disadvantage. In addition to technical acumen and adherence to style, if any, judges are asked to consider the unique expression of the addition of locally produced craft malt."]]}]},{"n":"105","name":"Hop Water","has":false,"subs":[{"id":"105","name":"Hop Water","cat":"Hop Water","st":[],"d":[["Overall Impression","Hop Water is a non-alcohol or alcohol-free sparkling beverage that showcases hop-derived aroma and flavor. It should emphasize freshness, balance, drinkability, and clarity of hop expression without malt character, significant sweetness, or fermentation character. Any added ingredients, flavors, or botanicals should support and enhance hop character rather than dominate the sensory profile; hop-derived aroma and flavor should remain the defining characteristic of the beverage."],["Appearance","Typically brilliant and colorless, though slight color contributions from hops or other ingredients are acceptable. Clarity should be high; slight haze from hopping may be acceptable."],["Aroma & Flavor","Hop-derived aroma and flavor are the defining characteristics and may range from subtle to highly expressive. Hop character may include floral, citrus, tropical fruit, resinous, herbal, spicy, berry, melon, stone fruit, or dank attributes depending on hop variety(ies) used. Flavor should be clean, refreshing, and balanced. Bitterness should range from low to medium but remain smooth, soft and well-integrated without harshness, excessive lingering bitterness or hop burn. Sweetness should be absent to low. Malt-derived flavors should be absent. Aged or oxidized hop flavors should not be present. Due to lack of fermentation, acidity may be used for balance but should remain clean, crisp, and supportive without creating an overly sour impression or sharp acidic or astringent harshness. Optional complementary ingredients or natural flavors may be present if they support and do not overwhelm hop character."],["Mouthfeel","Medium to Medium-high carbonation should enhance drinkability; light body and refreshing finish. Products should avoid watery, syrupy or dull/flabby flavor profiles. While some examples made with hop pellets may have a slightly elevated polyphenol profile, they should not be overly astringent or bitter. Hop burn, excessive bitterness or sharp acidic or carbonic harshness should not be present."],["Technical Characteristics","Products are often produced through brewing, infusion, extraction, flavor blending, or carbonation processes. Fermentation character should not be apparent. Alcohol presence should be absent."],["Comments","Judging should emphasize beverage balance, quality of hop expression, refreshment, and overall drinkability rather than beer-like characteristics. Examples may range from highly aromatic and intensely hopped products to delicate and subtle sparkling hop beverages. To allow for accurate judging the entrant should provide information on hop varieties and any additional ingredients or flavorings used."]]}]},{"n":"201","name":"Tannic Cider","has":true,"subs":[{"id":"201A","name":"Tannic Cider (Dry)","cat":"Tannic Cider","st":[["Final Gravity","<1.007 (<1.8% RS)"],["Perceived Sweetness","Semi-dry to Dry"],["ABW (ABV)","2.30-7.89% (3.00%-10.00%)"],["Carbonation","Still to Sparkling"]],"d":[["Color","Pale straw to copper/pink"],["Clarity","Cloudy to Brilliant"],["Malt aroma & flavor","Very Low to Medium High. Fresh apple character may or may not be present but should not be a defining characteristic. Dry ciders may have a vinous character and English and French-inspired versions can often include bold phenolic characteristics"],["Bitterness","Medium low to High"],["Fermentation","Fruity esters low to medium-high. If malolactic character is present, it should not be a dominant characteristic. Volatile acidity in the form of ethyl acetate is a fault. Brettanomyces character, including funk/barnyard is not a fault when in balance."],["Body","Medium to High"],["Notes","This category focuses on dry versions of high-tannin ciders. Ciders with a final gravity below 1.007 (1.8% RS) are appropriately entered here, depending on perceived sweetness. The ciders utilize apple or pear varieties often purposefully grown for cider production. These bittersweet/bittersharp varieties often impart significant levels of tannin and varietal specific flavor characteristics. Dry ciders should not be too austere and should display complex characteristics while maintaining balance. To allow for accurate judging the cidermaker must indicate the regional cider style and/or production technique as well as apple varietal(s) used & carbonation level. Within the framework of the competition, ciders featuring prominent barrel-derived flavor characteristics should be entered as Experimental or Barrel-Aged Cider. Entries not accompanied by this information will be at a disadvantage during judging."]]},{"id":"201B","name":"Tannic Cider (Sweet)","cat":"Tannic Cider","st":[["Final Gravity","> 1.007 ( >1.8% RS)"],["Perceived Sweetness","Semi-sweet to Sweet"],["ABW (ABV)","2.30-7.89% (3.00%-10.00%)"],["Carbonation","Still to Sparkling"]],"d":[["Color","Pale straw to copper/pink"],["Clarity","Cloudy to Brilliant"],["Malt aroma & flavor","Very Low to Medium High. Fresh apple character may or may not be present but should not be a defining characteristic. English and French-inspired versions can often include bold phenolic characteristics"],["Bitterness","Medium low to High"],["Fermentation","Fruity esters low to medium-high. If malolactic character is present, it should not be a dominant characteristic. Volatile acidity in the form of ethyl acetate is a fault. Brettanomyces character, including funk/barnyard is not a fault when in balance."],["Body","Medium to High"],["Notes","This category focuses on sweet versions of high-tannin ciders. Ciders with a final gravity above 1.007 (1.8% RS) are appropriately entered here, depending on perceived sweetness. The ciders utilize apple or pear varieties often purposefully grown for cider production. These bittersweet/bittersharp varieties often impart significant levels of tannin and varietal specific flavor characteristics. Sweet ciders should not be cloying and should display complex characteristics while maintaining balance. To allow for accurate judging the cidermaker must indicate the regional cider style and/or production technique as well as apple varietal(s) used & carbonation level. Within the framework of the competition, ciders featuring prominent barrel-derived flavor characteristics should be entered as Experimental or Barrel-Aged Cider. Entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"202","name":"No/Low Tannin Cider","has":true,"subs":[{"id":"202A","name":"No/Low Tannin Cider (Dry)","cat":"No/Low Tannin Cider","st":[["Final Gravity","< 1.007 (<1.8% RS)"],["Perceived Sweetness","Off-dry to Dry"],["ABW (ABV)","2.30-7.89% (3.0%-10.0%)"],["Carbonation","Still to Sparkling"]],"d":[["Color","Light straw to copper/pink"],["Clarity","Lightly hazy to Brilliant"],["Malt aroma & flavor","Medium to High. Fresh apple or pear character should be present and is a defining characteristic."],["Bitterness","None to Low"],["Fermentation","Fruity esters low to medium. Clean fermentation profile without evidence of wild fermentation."],["Body","Low to Full"],["Notes","This category focuses on modern interpretations of cider often utilizing apples or pears of culinary interest. Ciders with a final gravity below 1.007 (1.8% RS) are appropriately entered here, depending on perceived sweetness. Intensity of dryness should be balanced. Fermentation character should be clean without evidence of wild or malolactic fermentation. Dry versions of No/Low-Tannin Ciders may present with more acidity than sweet versions and should be refreshing without sacrificing body or flavor. To allow for accurate judging the cidermaker may indicate the regional cider style and/or production technique as well as apple varietal(s) used; if apple varietal is specified, judges will expect characteristics of that varietal; if ABV is above typical range, entrant should provide details about apple varieties, growing conditions and production methods used. Within the framework of the competition, ciders featuring prominent barrel-derived flavor characteristics should be entered as Experimental or Barrel-Aged Cider."]]},{"id":"202B","name":"No/Low Tannin Cider (Sweet)","cat":"No/Low Tannin Cider","st":[["Final Gravity",">1.007 (<1.8% RS)"],["Perceived Sweetness","Semi-sweet to Sweet"],["ABW (ABV)","2.30-7.89% (3.0%-10.0%)"],["Carbonation","Still to Sparkling"]],"d":[["Color","Light straw to copper/pink"],["Clarity","Lightly hazy to Brilliant"],["Malt aroma & flavor","Medium to High. Fresh apple or pear character should be present and is a defining characteristic."],["Bitterness","None to Low"],["Fermentation","Fruity esters low to medium. Clean fermentation profile without evidence of wild fermentation."],["Body","Low to Full"],["Notes","This category focuses on modern interpretations of cider often utilizing apples or pears of culinary interest. Ciders with a final gravity above 1.007 (1.8% RS) are appropriately entered here, depending on perceived sweetness. Intensity of sweetness should be balanced. Fermentation character should be clean without evidence of wild or malolactic fermentation. Sweet versions of No/Low-Tannin Ciders may present with less acidity than dry versions and should be refreshing without sacrificing body or flavor. To allow for accurate judging the cidermaker may indicate the regional cider style and/or production technique as well as apple varietal(s) used; if apple varietal is specified, judges will expect characteristics of that varietal; if ABV is above typical range, entrant should provide details about apple varieties, growing conditions and production methods used. Within the framework of the competition, ciders featuring prominent barrel-derived flavor characteristics should be entered as Experimental or Barrel-Aged Cider. To allow for accurate judging the cidermaker may indicate the regional cider style and/or production technique as well as apple varietal(s) used; if apple varietal is specified, judges will expect characteristics of that varietal; if ABV is above typical range, entrant should provide details about apple varieties, growing conditions and production methods used. Within the framework of the competition, ciders featuring prominent barrel-derived flavor characteristics should be entered as Experimental or Barrel-Aged Cider."]]}]},{"n":"203","name":"Fruited Cider","has":true,"subs":[{"id":"203A","name":"Fruited Cider (Dry)","cat":"Fruited Cider","st":[["Final Gravity","< 1.007 (<1.8% RS)"],["Perceived Sweetness","Varies"],["ABW (ABV)","2.30-7.89% (3.0%-10.0%)"],["Carbonation","Still to Sparkling"]],"d":[["Color","Varies"],["Clarity","Cloudy to Brilliant"],["Malt aroma & flavor","Apple or pear aroma and flavor should be well integrated into added fruits used while maintaining balance."],["Bitterness","None to High"],["Fermentation","Fermentation characteristics should reflect the base style, with any added fruit providing additional layers of flavor and complexity."],["Body","Low to High"],["Notes","This category focuses on dry ciders with added fruit. Ciders with a final gravity below 1.007 (1.8% RS) are appropriately entered here, depending on perceived sweetness. Dry ciders may include co-fermented fruit and the base cider characteristics can be preserved, transformed, or highlighted. Cider character must be present and should be in harmony with added fruits elements. To allow for accurate judging the cidermaker must indicate the underlying base (e.g. “No/Low Tannin Cider”, “Tannic Cider”) and/or production technique, sweetness level and carbonation level as well as any specific fruit(s) or ingredients used in production; Entries not accompanied by this information will be at a disadvantage during judging. Within the framework of the competition, ciders featuring both fruits and botanical elements may be appropriately entered here if fruit characteristic is the dominant flavor of the cider. Ciders with prominent barrel-derived flavor characteristics should be entered as Experimental or Barrel-Aged Cider. Ingredients generally used as “fruit” in culinary applications are allowed in this category (i.e. hibiscus, rhubarb, etc.). Ciders using only added vegetables, herbs, chilis or spices should be entered in the Botanical cider category."]]},{"id":"203B","name":"Fruited Cider (Sweet)","cat":"Fruited Cider","st":[["Final Gravity","> 1.007 (>1.8% RS)"],["Perceived Sweetness","Varies"],["ABW (ABV)","2.30-7.89% (3.0%-10.0%)"],["Carbonation","Still to Sparkling"]],"d":[["Color","Varies"],["Clarity","Cloudy to Brilliant"],["Malt aroma & flavor","Apple or pear aroma and flavor should be well integrated into added fruits used while maintaining balance."],["Bitterness","None to High"],["Fermentation","Fermentation characteristics should reflect the base style, with any added fruit providing additional layers of flavor and complexity."],["Body","Low to High"],["Notes","This category focuses on sweet ciders with added fruit. Ciders with a final gravity above 1.007 (1.8% RS) are appropriately entered here, depending on perceived sweetness. Sweet ciders may include post-fermentation additions of fruit and the base cider characteristics can be preserved, transformed, or highlighted. Cider character must be present and should be in harmony with added fruits elements. To allow for accurate judging the cidermaker must indicate the underlying base (e.g. “No/Low Tannin Cider”, “Tannic Cider”) and/or production technique, sweetness level and carbonation level as well as any specific fruit(s) or ingredients used in production; Entries not accompanied by this information will be at a disadvantage during judging. Within the framework of the competition, ciders featuring both fruits and botanical elements may be appropriately entered here if fruit characteristic is the dominant flavor of the cider. Ciders with prominent barrel-derived flavor characteristics should be entered as Experimental or Barrel-Aged Cider. Ingredients generally used as “fruit” in culinary applications are allowed in this category (i.e. hibiscus, rhubarb, etc.). Ciders using only added vegetables, herbs, chilis or spices should be entered in the Botanical cider category."]]}]},{"n":"204","name":"Botanical or Spiced Cider","has":false,"subs":[{"id":"204","name":"Botanical or Spiced Cider","cat":"Botanical or Spiced Cider","st":[["Perceived Sweetness","Varies"],["ABW (ABV)","2.30-7.89% (3.0%-10.0%)"],["Carbonation","Still to Sparkling"]],"d":[["Color","Light straw to amber but may vary with color of added botanical(s)"],["Clarity","Cloudy to Brilliant"],["Malt aroma & flavor","Apple or pear aroma and flavor should be well integrated into the botanicals used while maintaining balance."],["Bitterness","None to High"],["Fermentation","Fermentation characteristics should reflect the base style, with any experimental treatments adding additional layers of flavor and complexity."],["Body","Low to High"],["Notes","This category focuses on ciders with added botanicals (including herbs, spices, hops, vegetables, chilis). The base cider characteristics can be preserved, transformed, or highlighted. Cider character must be present and should be in harmony with added botanical elements. To allow for accurate judging the cidermaker must indicate the underlying base (e.g. “No/Low Tannin Cider”, “Tannic Cider”) and/or production technique, sweetness level and carbonation level as well as any specific spices/botanicals used in production; Entries not accompanied by this information will be at a disadvantage during judging. Within the framework of the competition, ciders featuring both fruits and botanical elements may be appropriately entered in this category if spice/botanical element is the dominant flavor of the cider. Ciders with prominent barrel-derived flavor characteristics should be entered as Experimental or Barrel-Aged Cider."]]}]},{"n":"205","name":"Experimental, Barrel-Aged or Specialty Cider","has":false,"subs":[{"id":"205","name":"Experimental, Barrel-Aged or Specialty Cider","cat":"Experimental, Barrel-Aged or Specialty Cider","st":[],"d":[["Color","Varies"],["Clarity","Cloudy to Brilliant"],["Malt aroma & flavor","Varies - if appropriate, should highlight the experimental techniques or barrel treatments utilized"],["Bitterness","None to High"],["Fermentation","Fermentation characteristics should reflect the base style, with any experimental treatments adding additional layers of flavor and complexity."],["Body","Low to High"],["Notes","This category focuses on combinations of fruits, spices, adjuncts, fortifications, fermentations, barrel treatments or other experimental processes that produce a cider that does not fit well in any of the other categories. The base cider characteristics can be preserved, transformed, or highlighted. Ciders featuring prominent barrel or wood-aging flavors, sugar concentration or spirit fortification are appropriately categorized here. Ciders that are barrel-aged with a generally neutral in terms of barrel-derived flavor may be appropriately categorized elsewhere. To allow for accurate judging the cidermaker must indicate the underlying traditional/contemporary cider style and/or production technique, sweetness level & carbonation level. Entrant must also list any experimental techniques, processes or ingredients used in production. For barrel-aged entries, entrants should specify
