ruit, and other), sulfur/diesel-like, citrusy, and grassy"],["Bitterness","Medium-high to very high"],["Fermentation","Fruity esters are low to high, acceptable but not essential."],["Body","Medium-low to medium with a dry finish"],["Notes","Diacetyl and DMS should not be present. The use of water with high mineral content may result in a crisp, dry beer rather than a malt-accentuated version. Hop attributes are dominant and balanced with malt character."]]}]},{"n":"66","name":"Barley Wine-Style Ale","has":true,"subs":[{"id":"66A","name":"American-Style Barley Wine Ale","cat":"Barley Wine-Style Ale","st":[["Original gravity","1.09-1.12"],["Final gravity","1.024-1.028"],["ABV","8.50%-12.20%"],["IBU","60-100"],["Color SRM (EBC)","11-18 (22-36 EBC)"]],"d":[["Color","Amber to deep red/copper-garnet"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Caramel or toffee malt aroma attributes are often present. High residual malty sweetness, often exhibiting caramel or toffee attributes, should be present."],["Hop aroma & flavor","Medium to very high, exhibiting a wide range of attributes."],["Bitterness","High"],["Fermentation","Complex alcohols are evident. Fruity esters are often high. Diacetyl is usually absent in these beers but may be present at very low levels."],["Body","Full"],["Notes","Vinous, sherry-like, or port-like attributes arising from oxidation may be considered positive when in harmony with overall flavor profile. Low carbonation may be acceptable in this style."]]},{"id":"66B","name":"British-Style Barley Wine Ale","cat":"Barley Wine-Style Ale","st":[["Original gravity","1.085-1.12"],["Final gravity","1.024-1.028"],["ABV","8.50%-12.20%"],["IBU","40-65"],["Color SRM (EBC)","11-36 (22-72 EBC)"]],"d":[["Color","Tawny copper to deep red/copper-garnet"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Residual malty sweetness is high"],["Hop aroma & flavor","Hop aroma and flavor are very low to medium. English type hops are often used but are not required for this style."],["Bitterness","Low to medium"],["Fermentation","Complexity of alcohols and fruity ester attributes are often high and balanced with the high alcohol content. Low levels of diacetyl are acceptable. Low carbonation is acceptable in this style. Caramel and some oxidized character (vinous aromas or flavors) may be considered positive attributes."],["Body","Full"]]}]},{"n":"67","name":"German-Style Koelsch","has":false,"subs":[{"id":"67","name":"German-Style Koelsch","cat":"German-Style Koelsch","st":[["Original gravity","1.042-1.048"],["Final gravity","1.006-1.01"],["ABV","4.80%-5.30%"],["IBU","22-30"],["Color SRM (EBC)","3-6 (6-12 EBC)"]],"d":[["Color","Straw to gold"],["Clarity","Chill haze should not be present"],["Malt aroma & flavor","Malt character is very low to low with soft sweetness. Caramel character should not be present."],["Hop aroma & flavor","Low and, if present, should express noble hop character."],["Bitterness","Medium to medium-high"],["Fermentation","Fruity esters are absent to low, expressed as pear, apple, or wine-like attributes when present. Diacetyl should not be present."],["Body","Low to medium-low. Dry and crisp."],["Notes","The Koelsch style is originally from the Köln area. Traditional examples often display persistent head retention. Small amounts of wheat can be used in brewing beers of this style. Koelsch-style beers are fermented at warmer temperatures than is typical for lagers, but at lower temperatures than most English and Belgian-style ales. They are aged cold. Ale yeast is used for fermentation. Lager yeast is sometimes used for bottle conditioning or final cold conditioning."]]}]},{"n":"68","name":"Gose","has":true,"subs":[{"id":"68A","name":"Leipzig-Style Gose","cat":"Gose","st":[["Original gravity","1.036-1.056"],["Final gravity","1.008-1.012"],["ABV","4.40%-5.40%"],["IBU","5-15"],["Color SRM (EBC)","2-7 (4-14 EBC)"]],"d":[["Color","Straw to light amber"],["Clarity","Clear to hazy. Haze may or may not be from yeast."],["Malt aroma & flavor","Malt sweetness and attributes are not present to very low"],["Hop aroma & flavor","Not present"],["Bitterness","Not present to low"],["Fermentation","Medium to high lactic acid character should be present and expressed as a sharp, refreshing sourness. These beers are not excessively aged."],["Body","Low to medium-low"],["Notes","These beers typically contain malted barley and unmalted wheat, with some versions also containing oats. Salt (table salt) and coriander may be present in low amounts. A Gose brewed with fruit(s), spices (other than salt or coriander), darker malts or other ingredients is categorized as Contemporary-Style Gose. Carbonation is high to very high. Effervescent. To allow for accurate judging the brewer must list any special ingredient(s) used, such as grains, citrus, salt, coriander or others if present. The brewer may provide information about the brewing process that influences sensory outcomes. Beer entries not accompanied by this information will be at a disadvantage during judging."]]},{"id":"68B","name":"Contemporary Gose","cat":"Gose","st":[["Original gravity","1.036-1.056"],["Final gravity","1.008-1.012"],["ABV","4.40%-5.40%"],["IBU","5-30"],["Color SRM (EBC)","3-9 (6-18 EBC)"]],"d":[["Color","Usually straw to medium amber and can take on the color of added fruits or other ingredients such as darker malts."],["Clarity","Clear to hazy. Haze may or may not result from yeast"],["Malt aroma & flavor","Malt aroma and flavor is not present to very low"],["Hop aroma & flavor","Very low to low"],["Bitterness","Not present to medium"],["Fermentation","Horsey, leathery, or earthy aromas contributed by Brettanomyces yeasts may be present but at low levels as these beers do not undergo prolonged aging. Contemporary Gose may be fermented with pure beer yeast strains, or with yeast mixed with bacteria. Alternatively, they may be spontaneously fermented. Low to medium lactic acid character is present in all examples expressed as a sharp, refreshing sourness."],["Body","Low to medium-low"],["Notes","Contemporary-Style Gose may be brewed with malted or unmalted barley, wheat, and oats. Contemporary examples may also contain other grains. As in traditional examples, low level salt (table salt) and coriander additions may or may not be present in Contemporary Gose. Attributes from the use of a wide variety of herbs, spices, flowers, fruits, or other ingredients not found in traditional Leipzig-Style Gose may also be present and in harmony with overall flavor profile. To allow for accurate judging brewer must list the grain(s), spice(s), fruit(s) or other flavor(s) or ingredients used, and/or information about the brewing process such as ageing, bacteria or yeast used if any, which differentiate these beers from traditional Gose. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"69","name":"Berliner-Style Weisse","has":true,"subs":[{"id":"69A","name":"Berliner-Style Weisse","cat":"Berliner-Style Weisse","st":[["Original gravity","1.028-1.044"],["Final gravity","1.004-1.006"],["ABV","2.80%-5.00%"],["IBU","3-6"],["Color SRM (EBC)","2-4 (4-8 EBC)"]],"d":[["Color","Straw to pale. These are the lightest of all the German wheat beers."],["Clarity","May appear hazy or cloudy from yeast or chill haze"],["Malt aroma & flavor","Malt sweetness is absent"],["Hop aroma & flavor","Not present"],["Bitterness","Not present to very low"],["Fermentation","Fruity esters are low to medium. Diacetyl should not be present. Brettanomyces character may be absent or present at low to medium levels and, if present, may be expressed as any of horsey, goaty, leathery, phenolic, fruity, or acidic aroma and flavor attributes. The unique combination of yeast and lactic acid bacteria fermentation yields a beer that is acidic and highly attenuated."],["Body","Very low"],["Notes","Carbonation is high. Traditionally, some Berliners were brewed or served with fruit, spices, or syrups. Some more contemporary versions have been brewed with other ingredients such as darker malts. Any such versions will take on corresponding hues, and may exhibit flavor and aroma attributes typical of such ingredients. For purposes of this competition, all entries brewed, packaged or served with fruit, spices, darker malts or other ingredients are categorized as Specialty Berliner Weisse.."]]},{"id":"69B","name":"Specialty Berliner-Style Weisse","cat":"Berliner-Style Weisse","st":[["Original gravity","1.028-1.044"],["Final gravity","1.004-1.006"],["ABV","2.80%-5.00%"],["IBU","3-6"],["Color SRM (EBC)","2-4 (higher if darker malts are used) (4-8 (higher if darker malts are used) EBC)"]],"d":[["Color","While traditional Berliners are the lightest of all the German wheat beers, ranging from straw to pale, Specialty Berliners are brewed, packaged or served with fruit(s), darker malt(s), syrups or other ingredients, and therefore may take on corresponding hues."],["Clarity","May appear hazy or cloudy from yeast or chill haze"],["Malt aroma & flavor","Malt sweetness is absent. Very low to low level attributes of darker malts (if used) may be present."],["Hop aroma & flavor","Not present"],["Bitterness","Not present to very low"],["Fermentation","Fruity esters are low to medium. Diacetyl should not be perceived. Brettanomyces character may be absent or present at low to medium levels, and if present may be expressed as horsey, goaty, leathery, phenolic, fruity and/or acidic aromas and flavors. The unique combination of yeast and lactic acid bacteria fermentation yields a beer that is acidic and highly attenuated."],["Body","Very low"],["Notes","Carbonation is high. Specialty Berliners are brewed or served with fruit or fruit syrups, spices or herbal syrups, darker malts or a wide range of other ingredients, and will exhibit sensory attributes typical of those ingredients, such as hue, aroma, taste and body. To allow for accurate judging, brewers must list the fruit(s), herb(s) or spice(s), darker malt(s) or other flavor(s) or ingredients used which differentiate these beers from traditional Berliners. Entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"70","name":"South German-Style Weissbier","has":true,"subs":[{"id":"70A","name":"South German-Style Hefeweizen","cat":"South German-Style Weissbier","st":[["Original gravity","1.047-1.056"],["Final gravity","1.008-1.016"],["ABV","4.90%-5.60%"],["IBU","10-15"],["Color SRM (EBC)","3-9 (6-18 EBC)"]],"d":[["Color","Straw to amber"],["Clarity","If served with yeast, appearance may be very cloudy."],["Malt aroma & flavor","Very low to medium-low"],["Hop aroma & flavor","Not present to very low"],["Bitterness","Very low"],["Fermentation","Medium-low to medium-high fruity and phenolic attributes are hallmarks of this style. Phenolic attributes such as clove, nutmeg, smoke, and vanilla are present. Banana ester aroma and flavor should be present at low to medium-high levels. Diacetyl should not be present."],["Body","Medium to full"],["Notes","Beers in this style are made with at least 50 percent malted wheat, and are very highly carbonated. These beers are typically (though not always) roused during pouring, and when yeast is present, they will have a yeasty flavor and a characteristically fuller, creamier mouthfeel."]]},{"id":"70B","name":"South German-Style Kristal Weizen","cat":"South German-Style Weissbier","st":[["Original gravity","1.047-1.056"],["Final gravity","1.008-1.016"],["ABV","4.90%-5.60%"],["IBU","10-15"],["Color SRM (EBC)","3-9 (6-18 EBC)"]],"d":[["Color","Straw to amber"],["Clarity","Clear with no chill haze present. Because the beer is filtered, no yeast should be present."],["Malt aroma & flavor","Malt sweetness is very low to medium-low"],["Hop aroma & flavor","Not present to very low"],["Bitterness","Very low"],["Fermentation","The aroma and flavor are very similar to Hefeweizen with the caveat that fruity and phenolic characters are not combined with the yeasty flavor and fuller-bodied mouthfeel of yeast. The phenolic characteristics are often described as clove-like or nutmeg-like and can be smoky or even vanilla-like. A Banana-like ester aroma and flavor is often present. Diacetyl should not be present. Kristal Weizen is well attenuated and very highly carbonated."],["Body","Medium to full"],["Notes","Beers in this style are made with at least 50 percent malted wheat. They have no yeast flavor, and exhibit a cleaner, drier mouthfeel than counterparts served with yeast."]]},{"id":"70C","name":"South German-Style Bernsteinfarbenes Weizen","cat":"South German-Style Weissbier","st":[["Original gravity","1.048-1.056"],["Final gravity","1.008-1.016"],["ABV","4.80%-5.40%"],["IBU","10-15"],["Color SRM (EBC)","9-13 (18-26 EBC)"]],"d":[["Color","Amber to light brown. The German word 'Bernsteinfarben' means amber colored."],["Clarity","If served with yeast, appearance may be very cloudy."],["Malt aroma & flavor","Distinct sweet maltiness and caramel or bread-like character arises from the use of medium-colored malts."],["Hop aroma & flavor","Not present"],["Bitterness","Low"],["Fermentation","The phenolic and estery aromas and flavors typical of Weissbiers are present but less pronounced in Bernsteinfarbenes Weissbiers. These beers should be well attenuated and very highly carbonated. Diacetyl should not be present."],["Body","Medium to full"],["Notes","Beers in this style are made with at least 50 percent wheat malt. It is often roused during pouring, and, when yeast is present, will have a yeasty flavor and a fuller mouthfeel."]]}]},{"n":"71","name":"South German-Style Dunkel Weizen","has":false,"subs":[{"id":"71","name":"South German-Style Dunkel Weizen","cat":"South German-Style Dunkel Weizen","st":[["Original gravity","1.048-1.056"],["Final gravity","1.008-1.016"],["ABV","4.80%-5.40%"],["IBU","10-15"],["Color SRM (EBC)","10-25 (20-50 EBC)"]],"d":[["Color","Copper-brown to very dark"],["Clarity","If served with yeast, appearance may be very cloudy"],["Malt aroma & flavor","Distinct sweet maltiness and a chocolate-like character from dark or roasted malts exemplify beer in this style. Dark barley malts are frequently used along with dark Cara or color malts."],["Hop aroma & flavor","Not present"],["Bitterness","Low"],["Fermentation","The phenolic and estery aromas and flavors typical of Weissbiers are present but less pronounced in Dunkel Weissbiers. Dunkel Weissbiers should be well attenuated and very highly carbonated. Diacetyl should not be present"],["Body","Medium to full"],["Notes","Beers in this style are made with at least 50 percent wheat malt. They are often roused during pouring, and, when yeast is present, will have a yeasty flavor and a characteristically fuller mouthfeel."]]}]},{"n":"72","name":"South German-Style Weizenbock","has":false,"subs":[{"id":"72","name":"South German-Style Weizenbock","cat":"South German-Style Weizenbock","st":[["Original gravity","1.066-1.08"],["Final gravity","1.016-1.028"],["ABV","7.00%-9.50%"],["IBU","15-35"],["Color SRM (EBC)","4.5-30 (9-60 EBC)"]],"d":[["Color","Gold to very dark"],["Clarity","If served with yeast, appearance may be very cloudy."],["Malt aroma & flavor","Medium malty sweetness should be present. If dark, a mild roast malt character should emerge in the flavor and, to a lesser degree, in the aroma."],["Hop aroma & flavor","Not present"],["Bitterness","Low"],["Fermentation","Balanced, clove-like phenolic and fruity ester banana notes produce a wellrounded flavor and aroma. Diacetyl should not be present. Carbonation should be high."],["Body","Medium to full"],["Notes","Beers in this style are made with at least 50 percent wheat malt. They are often roused during pouring, and, when yeast is present, will have a yeasty flavor and a fuller mouthfeel."]]}]},{"n":"73","name":"German-Style Altbier","has":false,"subs":[{"id":"73","name":"German-Style Altbier","cat":"German-Style Altbier","st":[["Original gravity","1.044-1.052"],["Final gravity","1.008-1.014"],["ABV","4.60%-5.60%"],["IBU","25-52"],["Color SRM (EBC)","11-19 (22-38 EBC) 74. [Biere de Garde moved to Subcat of Specialty Saison - cat 77]"]],"d":[["Color","Copper to dark brown"],["Clarity","Clear to slightly hazy. Chill haze should not be present"],["Malt aroma & flavor","A variety of malts contributes to medium-low to medium malt aroma and flavor. Toast aroma typical of Munich malts should be present. Slight nuttiness is acceptable. Roast malt character should be present at low levels and well-integrated with the overall malt profile. Smoke character should not be present."],["Hop aroma & flavor","Low to medium with hop flavor more perceptible than aroma, with attributes typical of traditional German noble hops."],["Bitterness","Medium to high, producing a clean dry finish."],["Fermentation","Fruity esters are absent to low, with attributes expressed subtly as citrus, pear, dark cherry or plum. A slight sulfur aroma is acceptable. Diacetyl should not be present."],["Body","Medium-low to medium."],["Notes","The Altbier style is originally from the Dusseldorf area. The overall impression is clean, crisp and flavorful with a dry finish."]]}]},{"n":"75","name":"Belgian-Style Witbier","has":false,"subs":[{"id":"75","name":"Belgian-Style Witbier","cat":"Belgian-Style Witbier","st":[["Original gravity","1.038-1.05"],["Final gravity","1.008-1.014"],["ABV","4.00%-5.50%"],["IBU","10-17"],["Color SRM (EBC)","2-4 (4-8 EBC)"]],"d":[["Color","Straw to pale"],["Clarity","Unfiltered starch and yeast haze should be visible. Wits are traditionally bottle conditioned and served cloudy."],["Malt aroma & flavor","Low, but with a noticeable wheat character"],["Hop aroma & flavor","Hop aroma is not present to low. Hop flavor is not present."],["Bitterness","Low, from noble-type hops."],["Fermentation","Low to medium fruity esters are present. Mild phenolic spiciness and yeast flavors may be present. Mild acidity is appropriate. Diacetyl should not be present."],["Body","Medium, with a degree of creaminess from wheat starch and/or oats."],["Notes","Witbiers are brewed with malted barley, unmalted wheat and sometimes oats. Since the 1960's, they are brewed with coriander and orange peel; modern versions sometimes feature other spices or citrus peel types. If present, characteristics of added spice should be balanced and not overpower other flavor attributes."]]}]},{"n":"76","name":"Classic Saison","has":false,"subs":[{"id":"76","name":"Classic Saison","cat":"Classic Saison","st":[["Original gravity","1.040-1.060"],["Final gravity","1.004-1.008"],["ABV","4.50%-6.50%"],["IBU","30-50"],["Color SRM (EBC)","2-15 (4-30 EBC)"]],"d":[["Color","Straw to amber"],["Clarity","Chill haze or slight yeast haze is acceptable"],["Malt aroma & flavor","Low, but providing foundation for the overall balance. If used, specialty grains (malted or unmalted wheat, spelt, etc.) may have a noticeable character."],["Hop aroma & flavor","Medium to high and characterized by any of floral, herbal, spicy, woody or other attributes typical of traditional European-type hops."],["Bitterness","Medium-low to high, but not assertive."],["Fermentation","Fruity esters are medium to medium-high. Low to medium-low level phenolics may or may not be present. If present, phenolics should not be harsh or dominant and should be in harmony with ester profile and hops with spice-like or other attributes. Fruity and spicy attributes derived from Belgian yeast are common. Diacetyl should not be present. In more traditional versions, Brettanomyces yeast-derived aroma and flavor attributes including any of slightly acidic, fruity, horsey, goaty, or leather-like, may be present. These beers are well attenuated and often bottle conditioned contributing some yeast character and sometimes high carbonation."],["Body","Very low to low"],["Notes","Classic saisons are well attenuated, should have a refreshing character, high drinkability and be well balanced. Versions which exhibit sensory attributes typical of wood-aging are characterized as Specialty Saison."]]}]},{"n":"77","name":"Specialty Saison","has":false,"subs":[{"id":"77","name":"Specialty Saison","cat":"Specialty Saison","st":[["Original gravity","1.04-1.08"],["Final gravity","1.005-1.014"],["ABV","5.00%-9.30%"],["IBU","20-40"],["Color SRM (EBC)","3-20 (6-40 EBC) B. French-Style Biere de Garde Color: Gold to chestnut brown/red Clarity: Chill haze is acceptable. These beers are often bottle conditioned so slight yeast haze is acceptable. Perceived Malt Aroma & Flavor: These beers are characterized by a toasted malt aroma and flavor, and a slight malt sweetness. Perceived Hop Aroma & Flavor: Low to medium from noble-type hops Perceived bitterness: Low to medium Fermentation Characteristics: Fruity ester aromas are medium to high. Whereas fruity ester flavors are low to medium. Diacetyl should not be present. Historical Bière de Garde examples may have low levels of Brettanomyces yeast-derived flavors including any of slightly acidic, fruity, horsey, goaty, or leather-like attributes. Beer displaying more pronounced levels of Brettanomyces derived attributes is categorized as Brett Beer. Alcohol may be evident in higher strength beers. Body: Low to medium Additional notes: Earthy aromas are acceptable. Original Gravity (°P) 1.060-1.080 (14.7-19.3 °P) • Apparent Extract/Final Gravity (°P) 1.010-1.016 (2.5-4.0 °P) • Alcohol by Weight (Volume) 3.50%-6.30% (4.40%-8.00%) • Hop Bitterness (IBU) 20-30 • Color SRM (EBC) 4-16 (8-32 EBC)"]],"d":[["Color","Straw to dark brown; may take on hue of fruit(s), darker malts, or other ingredients"],["Clarity","Chill haze or slight yeast haze is acceptable"],["Malt aroma & flavor","Typically low to medium-low, but may vary in beers made with specialty malts."],["Hop aroma & flavor","Low to medium-high"],["Bitterness","Medium to medium-high"],["Fermentation","Fruity esters are medium to high. Diacetyl should not be present. Complex alcohols, herbs, spices, low Brettanomyces attributes including slightly acidic, fruity, horsey, goaty and leatherlike, as well as clove-like and smoky phenolics may be present but should stay in balance. Herb or spice flavors may be present. A low level of sour acidic flavor is acceptable when in balance with other components. Because these beers are often bottle conditioned, they may display some yeast character and high carbonation."],["Body","Low to medium"],["Notes","Specialty Saison represents a very wide family of beers which deviate substantially from Classic Saison in appearance and sensory outcomes. Such beers may be brewed with dark malts, fruit(s), spice(s), or a wide range of ingredients. Ingredients including spices, herbs, flowers, fruits, vegetables, fermentable sugars and carbohydrates, special yeasts of all types, wood-aging, etc. may contribute unique attributes to these beers. Earthy aromas are acceptable. Color, body, malt character, esters, alcohol level, and hop character should harmonize with attributes from special ingredients. Versions of Saison which exhibit sensory attributes typical of wood-aging are categorized as Specialty Saison. To allow for accurate judging, brewers must list the fruit(s), herb(s) or spice(s), darker malt(s) or other flavor(s), ingredients or wood-aging used which differentiate these beers from Classic Saison. Entries not accompanied by this information will be at a disadvantage during judging.."]]}]},{"n":"78","name":"Belgian-Style Flanders Oud Bruin or Oud Red Ale","has":false,"subs":[{"id":"78","name":"Belgian-Style Flanders Oud Bruin or Oud Red Ale","cat":"Belgian-Style Flanders Oud Bruin or Oud Red Ale","st":[["Original gravity","1.044-1.056"],["Final gravity","1.008-1.016"],["ABV","4.80%-6.60%"],["IBU","5-18"],["Color SRM (EBC)","12-25 (24-50 EBC)"]],"d":[["Color","Copper to very dark. SRM/EBC color values can be misleading because the red spectrum of color is not accurately assessed by these measurement systems."],["Clarity","Chill haze is acceptable at low temperatures. Bottle conditioned versions may appear cloudy when served."],["Malt aroma & flavor","Roasted malt aromas and flavors including cocoa are acceptable at low levels. Biscuit and light caramel aromas and flavors are typical. A low to medium level of malt sweetness if often present and should be balanced by acidity from Lactobacillus."],["Hop aroma & flavor","Not present"],["Bitterness","Very low to medium-low, though acidity and wood-aging (if used) may mask higher bitterness levels."],["Fermentation","Brettanomyces-produced aromas and flavors should be present in Oud Reds and may be present in Oud Bruins. Fruity esters expressed as cherry or green apple attributes are apparent. Very slight levels of ethyl acetate (red apple) my be present. Overall flavor of Oud Bruin is fundamentally characterized by medium low to high lactic sourness. Many versions express very low to medium acetic sourness and aroma; acetic sourness may also be absent."],["Body","Low to medium-low with a refreshing mouthfeel"],["Notes","These beers showcase a pleasant, complex, vinous character and a refreshing acidity. Oaky or woody flavors may be pleasantly integrated. Flavors of distilled spirits associated with used barrels should not be present. These beers are often a blend of old and young beer to create the brewer’s intended flavor balance."]]}]},{"n":"79","name":"Belgian-Style Spontaneous Sour Ale","has":true,"subs":[{"id":"79C","name":"Belgian-Style Lambic","cat":"Belgian-Style Spontaneous Sour Ale","st":[["Original gravity","1.044-1.065"],["Final gravity","1-1.01"],["ABV","5.00%-7.60%"],["IBU","11-23"],["Color SRM (EBC)","6-13 (12-26 EBC)"]],"d":[["Color","Gold to medium amber"],["Clarity","Cloudiness is acceptable"],["Malt aroma & flavor","Sweet malt character should not be present"],["Hop aroma & flavor","Not present to very low, and can include floral or other attributes. Hop character is often achieved by using stale or aged hops."],["Bitterness","Very low"],["Fermentation","Characteristic horsey, goaty, leathery and phenolic aromas and flavors derived from Brettanomyces yeast are often present at moderate levels. High to very high fruity esters are present. Traditionally, Lambics are unblended and spontaneously fermented. They express high to very high levels of fruity esters from Brettanomyces and other yeasts, as well as bacteria and wild yeast-derived sourness. Their primary sour character should be lactic. A slight amount of acetic sourness may sometimes be present but should never be harsh or overwhelming. Some modern versions are fermented with the addition of cultured yeast and bacteria. Carbonation can range from absent to very low. Wood-derived flavors may range from low to medium. Wood-vanillin, if present, should be low."],["Body","Low with dry mouthfeel"],["Notes","Lambics originating in the Brussels area of Belgium are often simply called Lambic. Versions of this beer style made outside of the Brussels area cannot be called true Lambics. These versions are said to be 'Belgian-Style Lambic' and may be made to resemble many of the beers of true origin. Historically, traditional Lambic is dry and very well-attenuated, exhibiting no residual sweetness either from malt, sugar, or other sweeteners. Sweet \"modern\" versions may be created through the addition of sugars or other sweeteners, in which case sweetness should be restrained and balanced by complexity and acidity. Traditionally, Lambics are brewed with unmalted wheat and malted barley. A pleasant lactic acidity should be present. Acetic acid character, if present, should be minimal."]]},{"id":"79D","name":"Belgian-Style Gueuze","cat":"Belgian-Style Spontaneous Sour Ale","st":[["Original gravity","1.044-1.065"],["Final gravity","1-1.01"],["ABV","5.00%-8.00%"],["IBU","11-23"],["Color SRM (EBC)","6-13 (12-26 EBC)"]],"d":[["Color","Gold to medium amber"],["Clarity","Appearance can range from clear to low-medium cloudiness arising from yeast, as Gueuze is traditionally bottle conditioned."],["Malt aroma & flavor","Sweet malt character is not present"],["Hop aroma & flavor","Not present to very low and can include floral or other attributes."],["Bitterness","Very low"],["Fermentation","Gueuze represents blends of aged and newly fermenting young Lambics. These unflavored blended and secondary fermented beers may range from very dry or mildly sweet in modern versions. They are characterized by intense fruity ester, sour, and acidic attributes which only result from spontaneous fermentation. Diacetyl should not be present. Characteristic horsey, goaty, leathery and phenolic aromas and flavors derived from Brettanomyces yeast are often present at moderate levels. Wood-derived flavors may range from low to medium. Wood-vanillin, if present, should be low. Carbonation can range from medium to high."],["Body","Typically low with dry mouthfeel. Highly complex flavor profile can lend an impression of fullness."],["Notes","Gueuze originating in the Brussels area of Belgium, are often simply called Gueuze. Versions of this beer style made outside of the Brussels area are said to be 'Belgian-Style Gueuze'. The Belgian-style versions are made to resemble many of the beers of true origin. Historically, traditional Gueuze is dry and wellattenuated, exhibiting no residual sweetness either from malt, sugar, or other sweeteners. Traditionally, Gueuze is brewed with unmalted wheat, malted barley, and stale, aged hops. A pleasant lactic acidity should be present. Acetic acid, if present, should be minimal."]]}]},{"n":"80","name":"Belgian-Style Blonde Ale","has":true,"subs":[{"id":"80A","name":"Belgian-Style Blonde Ale","cat":"Belgian-Style Blonde Ale","st":[["Original gravity","1.054-1.068"],["Final gravity","1.01-1.014"],["ABV","6.30%-7.90%"],["IBU","15-40"],["Color SRM (EBC)","2-7 (4-14 EBC)"]],"d":[["Color","Straw to light amber"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Low to medium"],["Hop aroma & flavor","Very low to medium. Noble-type hops are commonly used."],["Bitterness","Very low to medium-low"],["Fermentation","Medium to medium-high fruity esters are balanced with low to medium level malt attributes. Low level yeast-derived phenolic spiciness may be present. Diacetyl and acidic character should not be present."],["Body","Low to medium"]]},{"id":"80B","name":"Belgian-Style Speciale Belge","cat":"Belgian-Style Blonde Ale","st":[["Original gravity","1.04-1.054"],["Final gravity","1.008-1.014"],["ABV","5.00%-6.20%"],["IBU","20-30"],["Color SRM (EBC)","4-12 (8-24 EBC)"]],"d":[["Color","Gold to amber"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Malt aroma should present with caramel or lightly toasted malt attributes and should integrate with fermentation profile."],["Hop aroma & flavor","Very low to medium. Noble-type hops are commonly used."],["Bitterness","Low to medium"],["Fermentation","Medium fruity esters are typically present. Yeast-derived phenolic spicy flavors and aromas may be present at low to medium-low levels. Diacetyl should not be present."],["Body","Low to medium"]]}]},{"n":"81","name":"Belgian-Style Dubbel","has":false,"subs":[{"id":"81","name":"Belgian-Style Dubbel","cat":"Belgian-Style Dubbel","st":[["Original gravity","1.06-1.075"],["Final gravity","1.012-1.016"],["ABV","6.30%-7.60%"],["IBU","20-40"],["Color SRM (EBC)","16-36 (32-72 EBC)"]],"d":[["Color","Brown to very dark"],["Clarity","Chill haze is acceptable at low temperatures. Slight yeast haze may be present in bottle conditioned versions."],["Malt aroma & flavor","Any of cocoa, dark or dried fruit, or caramel aroma attributes should be present along with malty sweetness. Very low level of roasted aroma and flavor is acceptable."],["Hop aroma & flavor","Absent, or low if present."],["Bitterness","Medium-low to medium"],["Fermentation","Fruity esters are present at low to medium levels. Clove-like phenolic flavor and aroma may be present at low to medium-low levels. Diacetyl character should not be present."],["Body","Low to medium"],["Notes","Head should be dense and mousse-like. Herbs or spices such as coriander or others may be used in subtle amounts to enhance overall aroma or flavor, or may be absent."]]}]},{"n":"82","name":"Belgian-Style Tripel","has":false,"subs":[{"id":"82","name":"Belgian-Style Tripel","cat":"Belgian-Style Tripel","st":[["Original gravity","1.063-1.092"],["Final gravity","1.008-1.014"],["ABV","7.10%-10.10%"],["IBU","20-50"],["Color SRM (EBC)","4-9 (8-17.5 EBC)"]],"d":[["Color","Pale to light amber"],["Clarity","Chill haze is acceptable at low temperatures. Traditional Tripels are bottle conditioned and may exhibit slight yeast haze. However, yeast should not be intentionally roused."],["Malt aroma & flavor","Medium-low to medium malt aroma and sweetness from very pale malts should be present. There should be no roasted or dark malt character."],["Hop aroma & flavor","Low to medium noble-type hop aroma"],["Bitterness","Low to medium-high"],["Fermentation","A complex, sometimes mildly spicy, aroma and flavor characterize this style. Clove-like phenolic aroma and flavor may be present but at very low levels. Fruity esters should be present but in balance with the other aromas and flavors. Pear and banana esters are common. Traditional Tripels are wellattenuated. Fusel alcohols should remain in balance and not overwhelm the overall aroma and flavor. Warming alcohol strength and flavor should be present, but in balance with flavor."],["Body","Medium"],["Notes","Head should be dense and mousse-like. Herbs or spices such as coriander or others may be used in subtle amounts to enhance overall aroma or flavor, or may be absent. Brewing sugar is used to lighten the body. Hop/malt/alcohol character should be balanced. The overall beer flavor may finish sweet, though any sweet finish should be light due to alcohol content, not residual sugar."]]}]},{"n":"83","name":"Belgian-Style Quadrupel","has":false,"subs":[{"id":"83","name":"Belgian-Style Quadrupel","cat":"Belgian-Style Quadrupel","st":[["Original gravity","1.092-1.12"],["Final gravity","1.014-1.02"],["ABV","10.00%-14.20%"],["IBU","25-50"],["Color SRM (EBC)","16-36 (32-72 EBC)"]],"d":[["Color","Amber to dark brown"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Caramel, dark sugar and malty sweet flavors and aromas can be intense, but not cloying, and should complement fruitiness."],["Hop aroma & flavor","Not present to very low"],["Bitterness","Low to medium"],["Fermentation","Perception of alcohol can be strong. Complex fruity attributes reminiscent of any of raisins, dates, figs, grapes, or plums are often present and may be accompanied by wine-like attributes at low levels. Clove-like phenolic flavor and aroma may be present at low to medium-low levels. Noticeable ester profile. Fusel alcohols should remain in balance and not overwhelm overall aroma and flavor. Diacetyl and DMS should not be present."],["Body","Full with creamy mouthfeel"],["Notes","Head should be dense and mousse-like. Quadrupels are well attenuated and are characterized by an intense alcohol presence balanced by other flavors, aromas and bitterness. They are well balanced with savoring/sipping-type drinkability."]]}]},{"n":"84","name":"Belgian-Style Strong Specialty Ale","has":true,"subs":[{"id":"84A","name":"Other Belgian-Style Strong Specialty Ale","cat":"Belgian-Style Strong Specialty Ale","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV",">7.1%"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Pale to very dark"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Malt perception may vary widely depending on style"],["Hop aroma & flavor","Low to medium"],["Bitterness","Low to medium"],["Fermentation","Low levels of phenolic spiciness may be present but are not required and, if present, should be well-integrated. Complex low to medium intensity fruity esters are present, in harmony with malt and other attributes. Fusel alcohols should remain in balance and not overwhelm the overall aroma and flavor. Within the framework of these guidelines, these beers contain alcohol greater than 5.6% abw or 7.1% abv when consumed. Alcohol may be evident in stronger versions, in harmony with other flavor and aroma attributes, and not harsh."],["Body","Varies with style"],["Notes","Recognizing the uniqueness, variety and traditions of beers based on Belgian-style strong specialty ale, beers entered in this subcategory do not fit existing competition style guidelines for Belgian-Style Strong Blonde or Strong Dark Ales or other hybrid American and or Belgian styles in this competition. Examples might include entries made with and which exhibit attributes of unusual spices or other ingredients. Fruited versions are characterized as Belgian-style fruit beer. Some barrel or wood-aged versions which do not primarily present as wood-aged entries, or other strong Belgian-style or Belgian inspired ales that defy categorization, would be appropriately entered in this category. Lower alcohol (<=5.6% abw or 7.1% abv) entries the likewise do not fit existing guidelines are categorized elsewhere. To allow for accurate judging the brewer must provide additional information about the entry, including a classic Belgian Strong Ale style being elaborated upon, the historical or regional tradition of the style, the resulting beer based on the brewer’s interpretation of the style, and/or any special ingredients or processing used. The brewer may indicate 'no classic style' in instances where the base beer does not hew to a category within these competition guidelines. Beer entries not accompanied by this information will be at a disadvantage during judging."]]},{"id":"84B","name":"Belgian-Style Strong Blonde Ale","cat":"Belgian-Style Strong Specialty Ale","st":[["Original gravity","1.064-1.096"],["Final gravity","1.008-1.018"],["ABV","7.10%-11.20%"],["IBU","20-50"],["Color SRM (EBC)","2-7 (4-14 EBC)"]],"d":[["Color","Straw to light amber"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Malt character is low to medium. A complex fruitiness is often present."],["Hop aroma & flavor","Medium-low to medium-high"],["Bitterness","Medium-low to medium-high"],["Fermentation","Medium to medium-high fruity esters are present. Yeast-derived phenolic spicy flavors and aromas may be present at low to medium-low levels. Fusel alcohols should remain in balance and not overwhelm overall aroma and flavor. Diacetyl should not be present."],["Body","Low to medium"],["Notes","These beers are often brewed with light-colored Belgian candy sugar. Herbs and spices are sometimes used to delicately flavor these strong ales. These beers can be malty in overall impression or dry and highly attenuated. They can have a deceptively high alcohol character and a relatively light body for beers of high alcoholic strength. Some versions may be equally high in alcohol with a more medium in body."]]},{"id":"84C","name":"Belgian-Style Strong Dark Ale","cat":"Belgian-Style Strong Specialty Ale","st":[["Original gravity","1.064-1.096"],["Final gravity","1.012-1.018"],["ABV","7.10%-11.20%"],["IBU","20-50"],["Color SRM (EBC)","8-40 (16-80 EBC)"]],"d":[["Color","Amber to very dark"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Medium to high malt aroma and complex fruity aromas are distinctive. Medium to high malt intensity can be rich, creamy, and sweet. Fruity complexity along with soft roasted malt flavor adds distinct character."],["Hop aroma & flavor","Low to medium"],["Bitterness","Low to medium"],["Fermentation","Yeast-derived phenolic spicy flavors and aromas may be present at low to medium-low levels. Complex low to medium-high intensity fruity esters are present and in harmony with malt and other attributes. Fusel alcohols must remain in balance and not overwhelm the overall aroma and flavor."],["Body","Medium to full"],["Notes","These beers are often (though not always) brewed with dark Belgian candy sugar. Herbs and spices are sometimes used to delicately flavor these strong ales. These beers are typically well attenuated with a deceptive alcoholic strength."]]},{"id":"84D","name":"Other Belgian-Style Abbey Ale","cat":"Belgian-Style Strong Specialty Ale","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","a wide range of color and appearance"],["Clarity","Varies with underlying style"],["Malt aroma & flavor","Varies with underlying style"],["Hop aroma & flavor","Varies with underlying style"],["Bitterness","Varies with underlying style"],["Fermentation","Varies with underlying style"],["Body","Varies with underlying style"],["Notes","Recognizing the uniqueness, variety and traditions of beers based on Belgian-style abbey ale, the beers entered in this subcategory do not fit existing competition style guidelines for Dubbel, Tripel or Quadrupel. Stronger versions of traditional Abbey Ale styles, such as Quintupel, etc., would be appropriately entered in this category. Versions of Abbey Ale styles made with spices, non-traditional hops or malts or other flavorings would be appropriately entered in this category. However, fruited versions of Belgian-style Abbey Ales are categorized as Belgian-Style Fruit Beers. To allow for accurate judging the brewer must provide additional information about the entry including the classic or historical style being elaborated upon, the regional tradition of the style, the brewer’s interpretation of the style and/or any special ingredients or processing used ('Belgian Tripel brewed with ginger, oats and dark crystal malt' for example). The brewer may indicate 'no classic style' in instances where the base beer does not hew to a category within these competition guidelines. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"85","name":"Belgian-Style Fruit Beer","has":true,"subs":[{"id":"85A","name":"Belgian-Style Fruit Lambic","cat":"Belgian-Style Fruit Beer","st":[["Original gravity","1.036-1.072"],["Final gravity","1.008-1.016"],["ABV","4.0%-9.0%"],["IBU","10-15"],["Color SRM (EBC)","Color takes on hue of fruit (Color takes on hue of fruit EBC)"]],"d":[["Color","Often influenced by the color of added fruit"],["Clarity","Cloudiness is acceptable"],["Malt aroma & flavor","Malt sweetness should be absent, but sweetness of fruit or sweeteners may be low."],["Hop aroma & flavor","Hop aroma and flavor is not present. Cheesy hop character should not be present."],["Bitterness","Very low"],["Fermentation","Characteristic horsey, goaty, leathery, and phenolic aromas and flavors derived from Brettanomyces yeast are often present at moderate levels. Lactic sourness is an important part of the flavor profile, though sweetness may compromise the intensity. Fruit sourness may also be an important part of the profile. Acetic character, if present, should be minimal and well-integrated. These flavored Lambic beers may be very dry or mildly sweet. If sweetness is present, it should be in balance and not overwhelm other aspects of beer."],["Body","Dry to full"],["Notes","These beers, also known by the names Framboise, Kriek, Peche, Cassis, etc., are characterized by fruit aromas and flavors. Fruit Lambics, whose origin is the Brussels area of Belgium, are often simply called Fruit Lambic. Versions of this beer style made outside of the Brussels area are said to be 'BelgianStyle Fruit Lambics'. The Belgian-style versions are made to resemble many of the beers of true origin. Historically, traditional Lambics are dry and well-attenuated, exhibiting no residual sweetness either from malt, sugar, fruit, or other sweeteners. Some versions often have a degree of sweetness contributed by fruit sugars, other sugars, or other sweeteners. See also Belgian-Style Lambic for additional background information. Vanillin and other wood-derived flavors may range from absent to present at up to low-medium levels, and, if present, are in harmony with attribute arising from fruit. To allow for accurate judging the brewer must provide additional information about the entry. Such information must list the fruit(s) used, and may include information about the underlying classic sour style beer being fruited. Beer entries not accompanied by this information will be at a disadvantage during judging."]]},{"id":"85B","name":"Belgian-Style Fruit Beer","cat":"Belgian-Style Fruit Beer","st":[["Original gravity","1.03-1.11"],["Final gravity","1.006-1.03"],["ABV","2.50%-12.00%"],["IBU","5-30"],["Color SRM (EBC)","5-50 (10-100 EBC)"]],"d":[["Color","Can range from pale to dark depending on underlying Belgian style, and is often influenced by the color of added fruit"],["Clarity","Clear to hazy beer is acceptable"],["Malt aroma & flavor","Can vary from not perceived to medium-high"],["Hop aroma & flavor","Low to medium"],["Bitterness","Varies with underlying Belgian style"],["Fermentation","Acidic bacterial fermentation attributes may be absent or may be present; if present, such attributes contribute to acidity and enhance fruity balance."],["Body","Varies with style"],["Notes","Fruit aromas, ranging from subtle to intense, should be present and should not be overpowered by hop aromas. Belgian-Style Fruit Beers are fermented with traditional Belgian yeast, (Wit, Abbey, Farmhouse, etc.). Fruit or fruit extracts, used as adjuncts in either the mash, kettle, primary or secondary fermentation, provide harmonious fruit character ranging from subtle to intense. Classifying these beers can be complex. Within the framework of these guidelines, coconut is defined as a vegetable, and a beer containing coconut is categorized as Field Beer. Likewise a beer containing chili peppers is categorized as Chili Beer. Because wood vessels may be used for fermentation or aging, attributes typical of wood-aging such as vanillin, or from liquids previously aged in wood may be present. Fruited Belgian-style beers which exhibit Brettanomyces may be categorized in this style. However, a fruited Saison exhibiting Brett character should be categorized as a Specialty Saison. A fruited version of a Brett Beer is categorized as Fruited Brett Beer when such a Brett-containing beer is not based on an existing underlying Belgian beer style. A LambicStyle fruit beer should be categorized as a Belgian-Style Fruit Lambic. Fruited Belgian-Style beers brewed with additional adjuncts could fall in this category or perhaps as Experimental Beers. Fruit beers fermented with German, British or American ale or lager yeast should be categorized as American-Style Fruit Beers or as Fruit Wheat Beers. To allow for accurate judging the brewer must list the fruit(s) used, and any other ingredients or processes used. The brewer must also indicate the classic Belgian style of the underlying base beer. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"86","name":"English Mild or Bitter","has":true,"subs":[{"id":"86A","name":"English-Style Pale Mild Ale","cat":"English Mild or Bitter","st":[["Original gravity","1.03-1.036"],["Final gravity","1.004-1.008"],["ABV","3.40%-4.40%"],["IBU","10-20"],["Color SRM (EBC)","6-9 (12-18 EBC)"]],"d":[["Color","Light amber to medium amber"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Malt flavor and aroma dominate the flavor profile"],["Hop aroma & flavor","Very low to low"],["Bitterness","Very low to low"],["Fermentation","Diacetyl is usually absent in these beers but may be present at very low levels. Fruity esters are very low to medium-low."],["Body", thy, stone fruit or other attributes."],["Bitterness","Medium-low to medium-high"],["Fermentation","Fruity esters are medium to medium-high. Diacetyl is usually absent in these beers but may be present at very low levels."],["Body","Medium"]]},{"id":"87C","name":"English-Style Extra Special Bitter","cat":"English-Style Pale Ale","st":[["Original gravity","1.046-1.06"],["Final gravity","1.01-1.016"],["ABV","4.80%-5.80%"],["IBU","30-45"],["Color SRM (EBC)","8-17 (16-34 EBC)"]],"d":[["Color","Amber to deep copper"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Medium to medium-high. Malt-forward profile can be complex, exhibiting note of biscuit, toast, and nuttiness without being overly sweet."],["Hop aroma & flavor","Medium to medium-high"],["Bitterness","Medium to medium-high"],["Fermentation","Low carbonation traditionally characterizes draft-cask versions, but in bottled versions, a slight increase in carbon dioxide content is acceptable. The overall impression is balanced, refreshing and thirst quenching. Fruity esters are acceptable. Diacetyl is usually absent in these beers, but if present should be extremely low."],["Body","Medium"],["Notes","Entries in this subcategory exhibit hop aroma and flavor attributes typical of traditional English hop varieties."]]}]},{"n":"88","name":"English-Style Brown Ale","has":false,"subs":[{"id":"88","name":"English-Style Brown Ale","cat":"English-Style Brown Ale","st":[["Original gravity","1.04-1.05"],["Final gravity","1.008-1.014"],["ABV","4.20%-6.00%"],["IBU","12-25"],["Color SRM (EBC)","12-45 (24-90 EBC)"]],"d":[["Color","Copper to Black"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Roast malt may contribute to a biscuit or toasted aroma profile. Roast malt may contribute to the flavor profile. Malt profile can range from dry to sweet."],["Hop aroma & flavor","Very low"],["Bitterness","Very low to low"],["Fermentation","Low to medium-low level fruity esters are appropriate. Diacetyl is usually absent in these beers but may be present at very low levels."],["Body","Medium"]]}]},{"n":"89","name":"Brown Porter","has":false,"subs":[{"id":"89","name":"Brown Porter","cat":"Brown Porter","st":[["Original gravity","1.04-1.05"],["Final gravity","1.006-1.014"],["ABV","4.40%-6.00%"],["IBU","20-30"],["Color SRM (EBC)","20-35 (40-70 EBC)"]],"d":[["Color","Dark brown to very dark. May have red tint."],["Clarity","Beer color may be too dark to perceive clarity. When clarity is perceivable, chill haze is acceptable at low temperatures."],["Malt aroma & flavor","Low to medium malt sweetness. Caramel and chocolate attributes are acceptable. Strong roast barley or strong burnt or black malt character should not be present."],["Hop aroma & flavor","Very low to medium"],["Bitterness","Medium"],["Fermentation","Fruity esters are acceptable. Diacetyl is usually absent in these beers but may be present at low levels."],["Body","Low to medium"]]}]},{"n":"90","name":"Robust Porter","has":false,"subs":[{"id":"90","name":"Robust Porter","cat":"Robust Porter","st":[["Original gravity","1.045-1.06"],["Final gravity","1.008-1.016"],["ABV","5.10%-6.60%"],["IBU","25-40"],["Color SRM (EBC)","30+ (60+ EBC)"]],"d":[["Color","Very dark brown to black"],["Clarity","Opaque"],["Malt aroma & flavor","Medium to medium-high. Malty sweetness, roast malt, cocoa and caramel should be in harmony with bitterness from dark malts."],["Hop aroma & flavor","Very low to medium"],["Bitterness","Medium to high"],["Fermentation","Fruity esters should be present and balanced with all other characters. Diacetyl should not be present."],["Body","Medium to full"]]}]},{"n":"91","name":"Sweet Stout or Cream Stout","has":false,"subs":[{"id":"91","name":"Sweet Stout or Cream Stout","cat":"Sweet Stout or Cream Stout","st":[["Original gravity","1.045-1.056"],["Final gravity","1.012-1.02"],["ABV","3.20%-6.30%"],["IBU","15-25"],["Color SRM (EBC)","40+ (80+ EBC)"]],"d":[["Color","Black"],["Clarity","Opaque"],["Malt aroma & flavor","Medium to medium-high. Malt aromas and flavor from chocolate and caramel malts should contribute to the aroma and should dominate the flavor profile. Roast flavor may be present. Low to medium-low roasted malt-derived bitterness should be present."],["Hop aroma & flavor","Should not be present"],["Bitterness","Low to medium-low and serves to balance and suppress some of the sweetness without contributing apparent flavor and aroma"],["Fermentation","Fruity esters, if present, are low. Diacetyl should not be present."],["Body","Full-bodied. Body can be increased with the addition of milk sugar (lactose)."],["Notes","While chocolate and caramel malt notes are the hallmark of this style, these characteristics should be malt-derived. For the purposes of this competition stouts with added cocoa, chocolate, or other flavoring adjuncts (aside from Lactose), should be entered into the Chocolate Beer, Dessert Beer, or other appropriate category."]]}]},{"n":"92","name":"Oatmeal Stout","has":false,"subs":[{"id":"92","name":"Oatmeal Stout","cat":"Oatmeal Stout","st":[["Original gravity","1.038-1.056"],["Final gravity","1.008-1.02"],["ABV","3.80%-6.10%"],["IBU","20-40"],["Color SRM (EBC)","20+ (40+ EBC)"]],"d":[["Color","Dark brown to black"],["Clarity","Beer color may be too dark to perceive. When clarity is perceivable, chill haze is acceptable at low temperatures."],["Malt aroma & flavor","Coffee, caramel, roasted malt, or chocolate aromas should be prominent. Roasted malt character of caramel or chocolate should be smooth without bitterness."],["Hop aroma & flavor","Optional, but if present should not upset the overall balance."],["Bitterness","Medium"],["Fermentation","Oatmeal is used in the grist, resulting in a pleasant, full flavor without being grainy. Fruity esters are not present to very low. Diacetyl is usually absent in these beers but may be present at very low levels."],["Body","Full with an often-silky mouthfeel"]]}]},{"n":"93","name":"British-Style Imperial Stout","has":false,"subs":[{"id":"93","name":"British-Style Imperial Stout","cat":"British-Style Imperial Stout","st":[["Original gravity","1.08-1.1"],["Final gravity","1.02-1.03"],["ABV","7.00%-12.00%"],["IBU","45-65"],["Color SRM (EBC)","20-35+ (40-70+ EBC)"]],"d":[["Color","Ranging from dark copper typical of some historic examples, to very dark more typical of contemporary examples"],["Clarity","Opaque in darker versions. When clarity is perceivable, chill haze is acceptable at low temperatures."],["Malt aroma & flavor","Extremely rich malty flavor, often expressed as toffee or caramel, and may be accompanied by very low roasted malt astringency."],["Hop aroma & flavor","Very low to medium, with floral, citrus or herbal qualities."],["Bitterness","Medium and should not overwhelm the overall balance. The bitterness may be higher in darker versions while maintaining balance with sweet malt."],["Fermentation","Fruity esters can be medium to high. Diacetyl should not be present."],["Body","Full"],["Notes","This style was also originally called 'Russian Imperial Stout'."]]}]},{"n":"94","name":"Old Ale, Strong Ale or Aged Beer","has":true,"subs":[{"id":"94A","name":"Old Ale","cat":"Old Ale, Strong Ale or Aged Beer","st":[["Original gravity","1.058-1.088"],["Final gravity","1.014-1.03"],["ABV","6.30%-9.10%"],["IBU","30-60"],["Color SRM (EBC)","12-30 (24-60 EBC)"]],"d":[["Color","Copper-red to very dark"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Fruity esters can enhance and complement the malt aroma and flavor profile. Old Ales have malt and sometimes caramel sweetness."],["Hop aroma & flavor","Very low to medium"],["Bitterness","Present but minimal, and balanced with malt flavors."],["Fermentation","Fruity esters can contribute to the character of these beers. Alcohol types can be varied and complex. A distinctive quality of Old Ales is that they undergo an aging process, often for years. Aging can occur on their yeast either in bulk storage or through conditioning in the bottle. This contributes to a rich, wine-like, and often sweet, oxidized character. Complex estery attributes may also emerge. Diacetyl is usually absent in these beers but may be present at very low levels."],["Body","Medium to full"],["Notes","Low level attributes typical of wood aging such as vanillin are acceptable. Brettanomyces and acidity reflect historical character; low level attributes such as horsey, goaty, leathery, phenolic, etc. and acidity may be present and balanced with other flavors. Attributes arising from liquids previously aged in a barrel, such as bourbon or sherry, should not be present. Beers that exhibit such attributes are categorized as woodand barrel-aged beers."]]},{"id":"94B","name":"Strong Ale","cat":"Old Ale, Strong Ale or Aged Beer","st":[["Original gravity","1.06-1.125"],["Final gravity","1.014-1.04"],["ABV","7.00%-11.30%"],["IBU","30-60"],["Color SRM (EBC)","8-21 (16-42 EBC)"]],"d":[["Color","Amber to dark brown"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Medium to high malt and caramel sweetness. Very low levels of roast malt may be present."],["Hop aroma & flavor","Not present to very low"],["Bitterness","Present but minimal, and balanced with malt flavors."],["Fermentation","Rich, often sweet and complex fruity ester attributes can contribute to the profile of Strong Ales. Alcohol types can be varied and complex. Diacetyl is usually absent in these beers but may be present at very low levels."],["Body","Medium to full"]]},{"id":"94C","name":"Aged Beer","cat":"Old Ale, Strong Ale or Aged Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with underlying style"],["Clarity","Varies with underlying style"],["Malt aroma & flavor","Varies with underlying style"],["Hop aroma & flavor","Varies with underlying style"],["Bitterness","Varies with underlying style"],["Fermentation","Aged Beers are any beers aged for over one year. A brewer may brew any type of beer of any strength and enhance its character with various aging conditions for an extended time. In general, beers with high hopping rates, roast malt, high alcohol content, and complex herbal, smoke or fruit character are the best candidates for aging. Aged Beers may be aged in bottles, cans, kegs or other nonwooden vessels. Aged character may be expressed in mouthfeel, aroma, and flavor. Often, aged character is the result of oxidative reactions that either bring individual flavor components into harmony or are unique flavors unto themselves. Sherry-like and fruity flavors often develop during aging, and hop character often changes. No matter what the effect, the overall character should be balanced and without aggressive flavors. The level of change created by aging will vary with the duration of aging and the underlying beer style. Mildlyflavored beers are more likely to develop aggressive and unpleasant oxidation. Positive transformations are more likely to occur in beers with higher levels of hops, malt, or alcohol."],["Body","Varies with underlying style"],["Notes","Within the framework of these guidelines, various Wood- and Barrel-Aged Beers which subsequently undergo aging of one or more years in glass or stainless, and, which clearly exhibit sensory outcomes of that additional aging, may be categorized as Aged Beers. However, Brett Beers, Sour Beers or any other beers exhibiting attributes of aging in the presence of any microflora must be categorized elsewhere. Beers which have undergone aging, but which do not exhibit attributes typical of aging, are categorized within their base styles. To allow for accurate judging the brewer must provide additional information about the entry including the classic ale, lager or experimental style of the beer being aged, experimental or interesting techniques or ingredients, length of aging time, the material in which the beer was aged (glass, stainless, etc.), and other information describing the aging process. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"95","name":"Irish-Style Red Ale","has":false,"subs":[{"id":"95","name":"Irish-Style Red Ale","cat":"Irish-Style Red Ale","st":[["Original gravity","1.04-1.048"],["Final gravity","1.01-1.014"],["ABV","4.00%-4.80%"],["IBU","20-28"],["Color SRM (EBC)","11-18 (22-36 EBC)"]],"d":[["Color","Copper-red to reddish-brown"],["Clarity","Chill haze or yeast haze may be present at low levels"],["Malt aroma & flavor","Low to medium candy-like caramel malt sweetness should be present in flavor. A toasted malt character should be present, and there may be a slight roast barley or roast malt presence."],["Hop aroma & flavor","Not present to medium"],["Bitterness","Medium"],["Fermentation","Low level fruity esters are acceptable. Diacetyl is usually absent in these beers but may be present at very low levels."],["Body","Medium"]]}]},{"n":"96","name":"Classic Irish-Style Dry Stout","has":false,"subs":[{"id":"96","name":"Classic Irish-Style Dry Stout","cat":"Classic Irish-Style Dry Stout","st":[["Original gravity","1.038-1.048"],["Final gravity","1.008-1.012"],["ABV","4.10%-5.30%"],["IBU","30-40"],["Color SRM (EBC)","40+ (80+ EBC)"]],"d":[["Color","Black"],["Clarity","Opaque"],["Malt aroma & flavor","The prominence of coffee-like roasted barley and a moderate degree of roasted malt aroma and flavor defines much of the character. The hallmark dry-roasted attributes typical of Dry Stout result from the use of roasted barley. Initial malt and light caramel flavors give way to a distinctive dryroasted bitterness in the finish."],["Hop aroma & flavor","European hop character may range from not present to low in aroma and flavor"],["Bitterness","Medium to medium-high"],["Fermentation","Fruity esters are low relative to malt and roasted barley as well as hop bitterness. Diacetyl is usually absent in these beers but may be present at very low levels. Slight acidity may be present but is not required."],["Body","Medium-light to medium"],["Notes","Head retention should be persistent"]]}]},{"n":"97","name":"Export Stout","has":false,"subs":[{"id":"97","name":"Export Stout","cat":"Export Stout","st":[["Original gravity","1.052-1.072"],["Final gravity","1.008-1.02"],["ABV","5.60%-8.00%"],["IBU","30-60"],["Color SRM (EBC)","40+ (80+ EBC)"]],"d":[["Color","Black"],["Clarity","Opaque"],["Malt aroma & flavor","Coffee-like roasted barley and roasted malt aromas are prominent. Initial malt and light caramel flavors give way to a distinctive dry-roasted bitterness in the finish."],["Hop aroma & flavor","Low to medium-low"],["Bitterness","May be analytically high, but the perception is lessened by malt sweetness."],["Fermentation","Fruity esters are low. Diacetyl is usually absent in these beers but may be present at very low levels. Slight acidity is acceptable."],["Body","Medium to full"],["Notes","Head retention should be persistent"]]}]},{"n":"98","name":"Scottish-Style Ale","has":true,"subs":[{"id":"98A","name":"Scottish-Style Light Ale","cat":"Scottish-Style Ale","st":[["Original gravity","1.03-1.035"],["Final gravity","1.006-1.01"],["ABV","2.80%-3.50%"],["IBU","9-20"],["Color SRM (EBC)","6-15 (12-30 EBC)"]],"d":[["Color","Gold to light brown"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Malty, caramel aroma may be present. A low to medium-low, soft and chewy caramel malt flavor should be present."],["Hop aroma & flavor","Should not be present"],["Bitterness","Low"],["Fermentation","Yeast attributes such as diacetyl and sulfur are acceptable at very low levels. Bottled versions may contain higher amounts of carbon dioxide than is typical for lightly carbonated draft versions. Fruity esters, if present, are low."],["Body","Low"],["Notes","These beers differ significan
