container/barrel used & aging length. Entries not accompanied by this information will be at a disadvantage during judging. Within the framework of this competition ciders featuring only added fruits and/or botanical elements are appropriately entered in the Fruited or Botanical/Spiced cider categories, based on the dominant flavor (fruit or botanical/spice, respectively). Ciders blending a combination of fruits, botanicals/spices and/or experimental ingredients or techniques are appropriately entered here. Ciders with prominent barrel-derived flavor characteristics, wild fermentation profiles should be entered as Experimental or Barrel-Aged Cider. Sweetness, alcohol, and carbonation vary."]]}]}];
const WBC=[{"n":"1","name":"American-Style Wheat Beer","has":false,"subs":[{"id":"1","name":"American-Style Wheat Beer","cat":"American-Style Wheat Beer","st":[["Original gravity","1.036-1.056"],["Final gravity","1.004-1.016"],["ABV","3.50%-5.60%"],["IBU","10-35"],["Color SRM (EBC)","2-22 (4-44 EBC)"]],"d":[["Color","Straw to dark brown"],["Clarity","Clear to cloudy"],["Malt aroma & flavor","Low to medium-low level pale malt attributes are present in paler versions. Medium-low to medium-high malt attributes such as cocoa, chocolate, caramel, toffee, or biscuit may be present in darker versions. Roast malt astringency is acceptable in darker versions when balanced with malt sweetness."],["Hop aroma & flavor","Low to high"],["Bitterness","Low to medium"],["Fermentation","low to medium fruity esters are present. Diacetyl and phenolic, clove-like attributes should not be present"],["Body","Very low to medium"],["Notes","These beers can be fermented with either ale or lager yeast. The grist should include at least 30 percent malted wheat. Versions served with yeast may exhibit somewhat higher perceived bitterness and fuller mouthfeel. If present, yeast character and flavor can range from low to medium, and should be in harmony with malt and hop attributes, and not sharp."]]}]},{"n":"2","name":"Fruit Beer","has":false,"subs":[{"id":"2","name":"Fruit Beer","cat":"Fruit Beer","st":[["Original gravity","1.03-1.11"],["Final gravity","1.006-1.03"],["ABV","2.50%-12.00%"],["IBU","5-70"],["Color SRM (EBC)","5-50 or color of fruit (10-100 or color of fruit EBC)"]],"d":[["Color","Can range from pale to very dark depending on the underlying style and is often influenced by the color of added fruit"],["Clarity","Clear or hazy is acceptable"],["Malt aroma & flavor","Not present to medium-low"],["Hop aroma & flavor","Not present to medium-low"],["Bitterness","In balance with fruit character and usually at very low to medium levels"],["Fermentation","American-Style Fruit Beers are fermented with traditional German, British or American ale or lager yeast. Beers fermented with Belgian-style, German-style Hefeweizen or other South German wheat beer or Berliner-style Weisse yeasts should be categorized elsewhere. Fruit beers exhibiting sourness should be categorized elsewhere. Attributes typical of wild fermentation should not be present."],["Body","Varies with style"],["Notes","Fruit aromas, ranging from subtle to intense, should be present and should not be overpowered by hop aromas. Fruit or fruit extracts, used as an adjunct in either the mash, kettle, primary or secondary fermentation, provide harmonious fruit character ranging from subtle to intense. Some beers may fit into this category if they contain fruity adjuncts but no actual fruit (i.e. Hibiscus or similar ingredients that impart a fruity flavor). Within the framework of these guidelines, coconut is defined as a vegetable, and a beer containing coconut is categorized as Field Beer. Likewise beers containing chili peppers are categorized as Chili Beer. Fruit beers fermented with Belgian yeast (Wit, Abbey, Farmhouse, Saison, or Brettanomyces) should be categorized as Belgian-Style Fruit Beers, or possibly as fruited Brett Beers. Fruit Beers with 30%+ wheat are categorized as Fruit Wheat Beers. All of the various IPA styles brewed with Fruit are categorized as Experimental IPA. All fruited Sour Beers are categorized elsewhere. All fruited Wood- and Barrel-Aged beers (sour or not) are categorized elsewhere. To allow for accurate judging the brewer must list the fruit(s) used, and any other ingredients or processes used. The brewer must also indicate the classic or experimental ale or lager style of the underlying base beer; the brewer may indicate 'no classic style' in instances where the base beer does not hew to a category within these competition guidelines. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"3","name":"Fruit Wheat Beer","has":false,"subs":[{"id":"3","name":"Fruit Wheat Beer","cat":"Fruit Wheat Beer","st":[["Original gravity","1.03-1.11"],["Final gravity","1.006-1.03"],["ABV","2.50%-12.00%"],["IBU","10-35"],["Color SRM (EBC)","2-10, or color of fruit (4-20, or color of fruit EBC)"]],"d":[["Color","Generally straw to light amber and often influenced by the color of added fruit."],["Clarity","Chill haze is acceptable. These beers may be served with or without yeast. When served with yeast, appearance is hazy to very cloudy."],["Malt aroma & flavor","Low to medium-low"],["Hop aroma & flavor","Low to medium"],["Bitterness","Low to medium"],["Fermentation","These beers can be fermented with either ale or lager yeast depending on the underlying wheat beer style. Low fruity esters are typical. Diacetyl should not be present. In versions served with yeast, yeasty aroma and flavor should be low to medium."],["Body","Low to medium"],["Notes","The grist should include more than 30% malted wheat. Fruit or fruit extracts contribute aroma and flavor expressing true fruit complexity. Often the fruit intensity may be more muted in Fruit Wheat Beers than in Fruit Beers so as to harmonize with wheat malt aroma & flavor. Versions served with yeast should demonstrate a full yeasty mouthfeel. Fruited examples of wheat beer styles that are not commonly brewed with fruit and do not exhibit attributes of wood-aging should be categorized as Fruit Wheat Beers. These could include fruited versions of various wheat beer styles of European origin such as Weizens, Adambier or Grodziskie. Fruited wheat beers that exhibit sourness fall within various fruited sour beer categories. Such beers could deviate from parameters shown for those styles but should be suggestive of the underlying classic beer style with fruit added. Fruited versions of Berliner Weisse or Contemporary Gose fall within those categories as they are commonly brewed with fruit. Within the framework of these guidelines, coconut is defined as a vegetable, and a beer containing coconut is categorized as Field Beer. Likewise beers containing chili peppers are categorized as Chili Beer. To allow for accurate judging the brewer must list the fruit(s) used, and any other ingredients or processes used. The brewer must also indicate the classic or experimental ale or lager wheat beer style of the underlying base beer; the brewer may indicate 'no classic style' in instances where the base beer does not hew to a category within these competition guidelines. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"4","name":"Field Beer","has":false,"subs":[{"id":"4","name":"Field Beer","cat":"Field Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Can range from pale to very dark depending on the underlying style and is often influenced by the color of added field ingredients (vegetables, nuts, etc.)"],["Clarity","Clear to hazy is acceptable"],["Malt aroma & flavor","Very low to medium-high"],["Hop aroma & flavor","Very low to medium-high"],["Bitterness","Very low to medium-high. Vegetable character should not be muted by hop character."],["Fermentation","Varies with underlying style"],["Body","Varies with underlying style"],["Notes","Vegetable aromas, ranging from subtle to intense, should be present and should not be overpowered by hop aromas. Field Beers are any beers incorporating vegetables as flavor or carbohydrate adjuncts in either the mash, kettle, primary or secondary fermentation. The vegetable character should be in harmony with other attributes and can range from subtle to intense. Within the framework of these guidelines, beers with vegetables, nuts, mushrooms, cucumber, and/or coconut are categorized as Field Beer. However, within the framework of these guidelines, India Pale Ales brewed with vegetables/nuts/coconut are categorized as Experimental India Pale Ale. All beers containing chili peppers are categorized as Chili Beer. To allow for accurate judging the brewer must list the vegetable(s) used, and any other ingredients or processes used. The brewer must also indicate the classic or experimental ale or lager style of the underlying base beer; the brewer may indicate 'no classic style' in instances where the base beer does not hew to a category within these competition guidelines. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"5","name":"Pumpkin/Squash or Pumpkin Spice Beer","has":false,"subs":[{"id":"5","name":"Pumpkin/Squash or Pumpkin Spice Beer","cat":"Pumpkin/Squash or Pumpkin Spice Beer","st":[["Original gravity","1.03-1.11"],["Final gravity","1.006-1.03"],["ABV","2.50%-12.00%"],["IBU","5-35"],["Color SRM (EBC)","5-50 (10-100 EBC)"]],"d":[["Color","Can vary from pale to very dark depending on the underlying style"],["Clarity","Clear to hazy is acceptable"],["Malt aroma & flavor","Can vary from low to medium-high depending on the underlying style"],["Hop aroma & flavor","None to medium and, if present, in harmony with spice, pumpkin or squash, and other attributes."],["Bitterness","Low to medium-low"],["Fermentation","Typical of underlying beer style"],["Body","Varies with underlying style"],["Notes","These are any beers using pumpkins (Cucurbita pepo) or winter squash as an adjunct in either the mash, kettle, primary or secondary fermentation. Pumpkin or squash aromas and flavors may range from very subtle to intense. If spiced with other ingredients, those characteristics should be present and in balance. While cinnamon, allspice, clove, and nutmeg are common spices added to American-type pumpkin beers, other spices may be used. For example, a brewer could replicate a Wit-Pumpkin spiced beer by using orange peel and coriander. To allow for accurate judging the brewer must indicate the classic or experimental ale, lager or hybrid style of the underlying base beer; the brewer may indicate ‘no classic style’ in instances where the base beer does not hew to a category within these competition guidelines. The brewer must also list the spice(s) and/or other ingredients or processes used if any. If pumpkin or squash attributes contribute to the flavor profile of the entry the brewer may indicate the type of pumpkin or squash used and how processed. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"6","name":"Chili Beer","has":false,"subs":[{"id":"6","name":"Chili Beer","cat":"Chili Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Can range from pale to very dark depending on the underlying style"],["Clarity","Can range from clear to hazy depending on the underlying beer style"],["Malt aroma & flavor","Can vary from very low to medium-high depending on the underlying style"],["Hop aroma & flavor","Very low to very high"],["Bitterness","Very low to medium-high"],["Fermentation","Chili pepper aroma and flavor attributes should be harmonious with the underlying beer style. Chili pepper character may be expressed as vegetal, spicy, or hot on the palate."],["Body","Representative of underlying style"],["Notes","Chili Beer is any beer using chili peppers for flavor, aroma, or heat. Chili character can range from subtle to intense. Chili pepper aroma may or may not be present. Within the framework of these guidelines, all beers containing chili peppers are categorized as Chili Beers. Narrow exceptions are made in other categories where chili peppers are featured as part of a spice blend and/or are subtly blend as part of a wider flavor outcome. A beer made with chili peppers which represents more than one style, such as a barrel aged sour beer or India Pale Ale made with chilis, for example, should nonetheless be categorized as Chili Beer rather than as Experimental Beer. To allow for accurate judging the brewer must list the chili(s) used, and any other ingredients or processes used. The brewer must also indicate the classic or experimental ale or lager style of the underlying base beer; the brewer may indicate 'no classic style' in instances where the base beer does not hew to a category within these competition guidelines. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"7","name":"Herb and Spice Beer","has":false,"subs":[{"id":"7","name":"Herb and Spice Beer","cat":"Herb and Spice Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies depending on underlying style"],["Clarity","Clear to hazy is acceptable"],["Malt aroma & flavor","Varies depending on intention of brewer, underlying beer style, and intensity of herb or spice aroma attributes"],["Hop aroma & flavor","Not essential but may be present and may be more assertive than herb-spice character"],["Bitterness","Very low to medium-low. Reduced hop bitterness tends to accentuate herb/spice character."],["Fermentation","Aromas and flavors of individual spices may not always be identifiable"],["Body","Varies with underlying style"],["Notes","Herb and Spice beer is any beer brewed with herbs or spices derived from leaves, roots, seeds, fruits, vegetables, flowers, etc. and which exhibits herbal or spicy attributes. Herb or spice character can range from subtle to intense. Classifying these beers can be complex. Beers which exhibit herbal or spicy character are considered Herb and Spice Beer. Beers brewed with chili peppers are categorized as Chili Beer. Beers brewed with pumpkin or in which pumpkin pie spice attributes dominate are categorized as Pumpkin/Pumpkin Spice Beer. To allow for accurate judging the brewer must list the herb(s) and or spice(s) used, and any other ingredients or processes used. The brewer must also indicate the classic or experimental ale or lager style of the underlying base beer; the brewer may indicate 'no classic style' in instances where the base beer does not hew to a category within these competition guidelines. Beer entries not accompanied by this information will be at a disadvantage during judging ."]]}]},{"n":"8","name":"Tea Beer","has":true,"subs":[{"id":"8A","name":"Other Tea Beer","cat":"Tea Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with underlying beer style and can be influenced by color of tea leaves added"],["Clarity","Appearance varies with underlying beer style and may be hazy due to presence of catechins (antioxidant flavinoids) extracted from the added tea leaves."],["Malt aroma & flavor","Varies with underlying style"],["Hop aroma & flavor","Varies with underlying style"],["Bitterness","Hop bitterness is low to medium and should be in harmony with tea character, however mild tea-derived astringency is acceptable"],["Fermentation","Varies with underlying style, but distinctive aroma and flavor of tea should be medium to high and in harmony with attributes of underlying base beer."],["Body","Varies with underlying style"],["Notes","These beers are brewed with black, oolong, pu-erh or other fermented tea either in the mash, kettle, primary or secondary fermentation producing distinct tea characteristics. These beers will contain distinct aroma and flavor of the specific fermented tea variety used and may have a mild tea-derived astringency. Within the framework of these guidelines, beers brewed with roasted green teas or green teas that exhibit a roast character are appropriately categorized here. Beers brewed with herbal, fruit or flavored teas such as chamomile, rosehip, jasmine, rooibos, hibiscus etc. should be classified in the Herb & Spice or Fruit Beer categories. Beers brewed with grain tea (barley or buckwheat tea), bark or kelp should should be entered elsewhere. To allow for accurate judging the brewer must provide additional information for judging, including the underlying base style of the beer, type of fermented tea used, and may include processing information such as the process point or vessel when green tea was added. Entries not accompanied by this information will be at a disadvantage during judging.."]]},{"id":"8B","name":"Green Tea Beer","cat":"Tea Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with underlying beer style and can be influenced by color of tea leaves added"],["Clarity","Appearance varies with underlying beer style and may be hazy due to presence of catechins (antioxidant flavinoids) extracted from the added tea leaves or powder."],["Malt aroma & flavor","Varies with underlying style"],["Hop aroma & flavor","Varies with underlying style"],["Bitterness","Hop bitterness is low to medium and should be in harmony with green tea character, however mild tea-derived astringency may be medium-low to medium."],["Fermentation","Varies with underlying style, but distinctive aroma and flavor of green tea should be medium-low to high and in harmony with attributes of underlying base beer."],["Body","Varies with underlying style"],["Notes","These beers are brewed with unfermented/green tea leaves or powder either in the mash, kettle, primary or secondary fermentation producing notable green tea characteristics. These beers will contain distinctive green tea aromas & flavors ranging from that of green foliage to chlorophyllic, as well as a mild teaderived astringency. Within the framework of these guidelines, beers brewed with roasted green teas or green teas that exhibit a roast character are categorized as Other Tea Beer. To allow for accurate judging the brewer must provide additional information for judging, including the underlying base style of the beer, type of green tea used, and may include processing information such as the process point or vessel when green tea was added. Entries not accompanied by this information will be at a disadvantage during judging.."]]}]},{"n":"9","name":"Chocolate Beer","has":false,"subs":[{"id":"9","name":"Chocolate Beer","cat":"Chocolate Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Can range from pale to very dark depending on the underlying style"],["Clarity","Clear to hazy is acceptable"],["Malt aroma & flavor","Can vary with underlying style, but malt sweetness should always be in balance with cocoa flavors and aromas"],["Hop aroma & flavor","Hop aroma may vary based on underlying style and often may be lower than is designated for underlying style allowing chocolate to contribute to the flavor profile without becoming excessively bitter."],["Bitterness","Very low to medium-low"],["Fermentation","Typical of underlying beer style. Attributes derived from chocolate or cocoa should be apparent in all such beers, ranging from subtle to intense, and in harmony with the overall flavor profile of the beer."],["Body","Varies with underlying style"],["Notes","Chocolate Beers are beers of any classic style which incorporate dark chocolate or cocoa in any form. Beers made with white chocolate do not typify this category; however, beers which clearly exhibit attributes typical of white chocolate could be categorized as chocolate beer. To allow for accurate judging the brewer must list the form of chocolate used (‘cacao nibs’ for example), and any other ingredients or processes used. The brewer must also indicate the classic or experimental ale or lager style of the underlying base beer; the brewer may indicate ‘no classic style’ in instances where the base beer does not hew to a category within these competition guidelines. Beer entries not accompanied by this information will be at a disadvantage during judging. Chocolate beers brewed with chili are allowable in some situations (mole, Mexican chocolate, etc.), but chocolate must be the most prominent characteristic.."]]}]},{"n":"10","name":"Coffee Beer","has":false,"subs":[{"id":"10","name":"Coffee Beer","cat":"Coffee Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Pale to black depending on the underlying style"],["Clarity","Clear to hazy is acceptable"],["Malt aroma & flavor","Varies with underlying style to provide balance with coffee flavor and aroma"],["Hop aroma & flavor","Varies with underlying style"],["Bitterness","Varies with underlying style"],["Fermentation","Typical of underlying style"],["Body","Reflective of the underlying beer style"],["Notes","Coffee beers incorporate coffee in any form. Coffee character should be apparent as the defining attribute of this category, ranging from subtle to intense, and should be in harmony with other attributes of the underlying beer. Other flavors arising from the use of flavored coffee may also be present. Coffee Stouts or Porters should be entered in the Coffee Stout or Porter category. Within the framework of these competition guidelines, stouts and porters made with coffee are entered elsewhere. To allow for accurate judging the brewer must list details about the coffee(s) used, and any other ingredients or processes used ('medium roast cold extract in bright tank' for example). The brewer must also indicate the classic or experimental ale or lager style of the underlying base beer; the brewer may indicate 'no classic style' in instances where the base beer does not hew to a category within these competition guidelines. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"11","name":"Coffee Stout or Porter","has":false,"subs":[{"id":"11","name":"Coffee Stout or Porter","cat":"Coffee Stout or Porter","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Dark brown to black depending on the underlying stout or porter style"],["Clarity","Beer color may be too dark to perceive clarity. When clarity is perceivable, chill haze is acceptable at low temperatures."],["Malt aroma & flavor","Varies with underlying stout or porter beer style, and balanced with coffee flavor and aroma"],["Hop aroma & flavor","Varies with underlying stout or porter style"],["Bitterness","Varies with underlying beer style, and in harmony with any dryness or astringency derived from coffee."],["Fermentation","Typical of underlying stout or porter beer style."],["Body","Reflective of the underlying stout or porter beer style"],["Notes","Coffee stouts and porters incorporate coffee in any form. Most importantly, coffee character should be apparent as the defining attribute of this category, ranging from subtle to intense, and should be in harmony with other attributes of the underlying beer. Other flavors arising from the use of flavored coffee may also be present, but should not dominate coffee character. Dessert Stouts featuring coffee or coffee flavors are categorized as Dessert Stouts. To allow for accurate judging the brewer must indicate the classic or experimental stout or porter style of the underlying base beer. The brewer must also list details about the coffee(s) used, and any other ingredients or processes used ('medium roast cold extract in bright tank' for example). Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"12","name":"Dessert or Pastry Beer","has":false,"subs":[{"id":"12","name":"Dessert or Pastry Beer","cat":"Dessert or Pastry Beer","st":[["Original gravity","1.08-1.120+"],["Final gravity","1.02-1.060+"],["ABV","7%-13%+"],["IBU","20-65"],["Color SRM (EBC)","35+ (70+ EBC)"]],"d":[["Color","Very dark to black"],["Clarity","Opaque"],["Malt aroma & flavor","Extremely rich malty aroma and flavor is typical. Coffee, caramel, roasted malt, or chocolate aromas and flavors may be evident."],["Hop aroma & flavor","If present, very low"],["Bitterness","Not present to low"],["Fermentation","High alcohol content is evident. Fruity esters may be present at low levels. Diacetyl, if present, should be at low levels."],["Body","Full"],["Notes","Beers in this category build on a strong dark beer base and incorporate culinary ingredients to create rich, sweet flavor profiles mimicking the character of desserts, pastries or candies. Examples of culinary ingredients used in these beers include, but are not limited to, chocolate, coffee, coconut, vanilla, maple syrup, peanut butter and marshmallow as well as fruits, nuts and spices. The addition of sugars from any source may contribute to the pronounced sweetness of these beers. While this category may overlap several other styles defined in these guidelines such as Chocolate or Cocoa Beers, Coffee Beers, Field beers, and others, the combination of a high-gravity beer base, elevated alcohol content and rich, sweet, dessert-like flavor profiles sets this style apart as a unique entity. Wood or barrel-aged versions of these beers are classified elsewhere. To allow for accurate judging the brewer must provide additional information about the entry including the classic style underlying strong dark beer. Such information must identify fruit(s), spice(s) or other ingredients or processes used. Beer entries not accompanied by this information will be at a disadvantage during judging.."]]}]},{"n":"13","name":"Rye Beer","has":true,"subs":[{"id":"13A","name":"Rye Beer","cat":"Rye Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","A wide range of color is acceptable. Lighter versions are straw to copper, while darker versions are dark amber to dark brown."],["Clarity","Chill haze is acceptable in versions packaged and served without yeast. In versions served with yeast, appearance may range from hazy to very cloudy."],["Malt aroma & flavor","In darker versions, malt aromas and flavors can optionally include low roasted malt character expressed as cocoa/chocolate or caramel. Aromatic toffee, caramel, or biscuit character may also be present. Low level roastiness, graininess, or tannin astringency is acceptable when balanced with low to medium malt sweetness."],["Hop aroma & flavor","Low to medium-high"],["Bitterness","Low to medium"],["Fermentation","Low levels of spicy and fruity ester aromas are typical. Yeast-derived aroma and flavor attributes such as clove-like or other phenolics may be present when consistent with underlying beer style. These beers can be fermented with either ale or lager yeast. Diacetyl should not be present. Low to medium yeast aroma may be present in versions packaged with yeast."],["Body","Low to medium. Rye can impart textural qualities ranging from dry and crisp to smooth and velvety."],["Notes","The grist should include sufficient rye so that rye character is evident in the beer. Rye character is often described as any of earthy, nutty or occasionally spicy attributes. Beers brewed with rye that do not exhibit rye character are categorized in other beer styles. Rye IPA versions should be classified in the Experimental IPA category. Versions served with yeast should possess a full yeasty mouthfeel. To allow for accurate judging the brewer must indicate the classic, experimental or hybrid ale or lager style of the underlying base beer being made with rye ('rye Vienna lager' for example). The brewer may indicate 'no classic style' in instances where the base beer does not hew to a category within these competition guidelines. The brewer may also provide information about the form of rye and how used ('caramel rye malt' for example). Beer entries not accompanied by this information will be at a disadvantage during judging."]]},{"id":"13B","name":"German-Style Rye Ale","cat":"Rye Beer","st":[["Original gravity","1.047-1.056"],["Final gravity","1.008-1.016"],["ABV","4.90%-5.60%"],["IBU","10-15"],["Color SRM (EBC)","4-25 (8-50 EBC)"]],"d":[["Color","Pale to very dark, with darker versions ranging from dark amber to dark brown."],["Clarity","Chill haze is acceptable in versions packaged and served without yeast. In versions served with yeast, appearance may range from hazy to very cloudy."],["Malt aroma & flavor","In darker versions, malt aromas and flavors can optionally include low level roasted malt characters expressed as cocoa-chocolate, caramel, toffee, or biscuit attributes. Malt sweetness can vary from low to medium. Low level of roast malt astringency is acceptable when balanced with low to medium malt sweetness."],["Hop aroma & flavor","Not present"],["Bitterness","Very low to low"],["Fermentation","Low to medium banana-like or other fruity ester aromas and flavors are typical. Clove-like or other phenolic aromas and flavors should also be present. No yeast aroma should be present in versions without yeast. Versions packaged and served without yeast will not have yeast flavor or full mouthfeel typical of beers with yeast. Versions with yeast will have low to medium yeast aroma and flavor and a full mouthfeel, but the yeast character should not overpower the balance of rye and barley malts, esters, and phenolics."],["Body","Low to medium"],["Notes","Grist should include at least 50 percent rye malt. Versions with yeast are often roused during pouring. When yeast is present, the beer should have a yeasty flavor and a fuller mouthfeel."]]}]},{"n":"14","name":"Honey Beer","has":false,"subs":[{"id":"14","name":"Honey Beer","cat":"Honey Beer","st":[["Original gravity","1.03-1.11"],["Final gravity","1.006-1.03"],["ABV","2.50%-12.00%"],["IBU","1-100"],["Color SRM (EBC)","1-100 (2-200 EBC)"]],"d":[["Color","Very light to black depending on underlying style"],["Clarity","Clear to hazy is acceptable"],["Malt aroma & flavor","Varies depending on intention of brewer"],["Hop aroma & flavor","Very low to very high"],["Bitterness","Very low to very high"],["Fermentation","Honey Beers may be brewed to a traditional style or may be experimental. Honey Beers incorporate honey as a fermentable sugar in addition to malted barley. Honey character should be present in aroma and flavor but should not be overpowering. Beers which represent various India Pale Ale and Imperial India Pale Ale styles brewed with honey are categorized as Experimental India Pale Ale."],["Body","Varies with underlying style"],["Notes","To allow for accurate judging the brewer must indicate the classic or experimental ale or lager style of the underlying base beer; the brewer may indicate 'no classic style' in instances where the base beer does not hew to a category within these competition guidelines. The brewer may also list the type of honey used and information about processing if desired ('orange blossom honey in whirlpool' for example). Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"15","name":"Classic Non-Alcohol Ale or Lager","has":false,"subs":[{"id":"15","name":"Classic Non-Alcohol Ale or Lager","cat":"Classic Non-Alcohol Ale or Lager","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","<0.5% abv"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with underlying style"],["Clarity","Varies with underlying style"],["Malt aroma & flavor","Varies with underlying style"],["Hop aroma & flavor","Varies with underlying style"],["Bitterness","Varies with underlying style"],["Fermentation","Typical of underlying style of non-alcohol beer produced. Non-alcohol (N/A) malt beverages can emulate the character of any beer style defined within these guidelines but with no or nearly no alcohol (less than 0.5 percent abv). Ethyl acetate should not be present. Due to their nature, nonalcohol malt beverages will have a profile lacking the complexity and balance of flavors that beers containing alcohol will display. N/A beers should be assessed with this is mind, and should not be given negative evaluations for reasons related to the absence of alcohol."],["Body","Varies with underlying style"],["Notes","Within the framework of these guidelines, most classic and traditional ale & lager varieties with .5% abv or less that are not categorized as Hoppy Non-alcohol or Specialty Non-Alcohol beers are appropriately entered here. Hop-forward styles such as Pale Ales, IPA, IPL, etc. should be categorized as Hoppy Non-Alcohol Beers. Non-alcohol beers that showcase, fruit, field/vegetables, chili, chocolate, coffee, spice, wood-aging, wild fermentation or any non-traditional/unique ingredients and/or flavor outcomes should be categorized as Specialty Non-Alcohol beers. Sour and barrel-aged versions should be categorized as Specialty Non-Alcohol Beers (Including Gose, Berliner, Lambics, etc.). To allow for accurate judging the brewer must indicate the hoppy style (Pale Ale, IPA, IPL, Cold IPA, etc.) of the underlying base beer being made to less than 0.5% abv; the brewer may indicate 'no classic style' in instances where the base beer does not hew to a category within these competition guidelines. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"16","name":"Hoppy Non-Alcohol Beer","has":false,"subs":[{"id":"16","name":"Hoppy Non-Alcohol Beer","cat":"Hoppy Non-Alcohol Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","<0.5% abv"],["IBU","30-85"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with underlying style"],["Clarity","Varies with underlying style"],["Malt aroma & flavor","Varies with underlying style"],["Hop aroma & flavor","Varies with underlying style"],["Bitterness","Varies with underlying style"],["Fermentation","Typical of underlying style of non-alcohol beer produced. Non-alcohol (N/A) malt beverages can emulate the character of any amber to dark beer style defined within these guidelines but with no or nearly no alcohol (less than 0.5 percent abv). Ethyl acetate should not be present. Due to their nature, non-alcohol malt beverages will have a profile lacking the complexity and balance of flavors that beers containing alcohol will display. N/A beers should be assessed with this is mind, and should not be given negative evaluations for reasons related to the absence of alcohol."],["Body","Varies with underlying style"],["Notes","Within the framework of these guidelines, these beers are hop-forward Non-Alcohol varieties ranging from Pale Ales to IPA and including hoppy lager styles such as Cold IPA or India Pale Lagers. Some dark beer varieties (such as black IPA, or hop-forward stout varieties) may be appropriately entered here but must have dominant hop character. To allow for accurate judging the brewer must indicate the classic or experimental ale or lager style of the underlying base beer being made to less than 0.5% abv; Typical types of beers entered in this category will be American/NZ Pale ales, IPA, IPL and other hop-forward category varieties. The brewer may indicate 'no classic style' in instances where the base beer does not hew to a category within these competition guidelines. Beer entries not accompanied by this information will be at a disadvantage during judging.."]]}]},{"n":"17","name":"Specialty Non-Alcohol Beer","has":false,"subs":[{"id":"17","name":"Specialty Non-Alcohol Beer","cat":"Specialty Non-Alcohol Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","<0.5% abv"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies depending on underlying style and can be influenced by the color of added fruit(s) if any."],["Clarity","Varies with underlying style"],["Malt aroma & flavor","Varies with underlying style"],["Hop aroma & flavor","Varies with underlying style"],["Bitterness","Varies with underlying style"],["Fermentation","Non-alcohol (N/A) malt beverages can emulate the character of any beer style defined within these guidelines but with no or nearly no alcohol (less than 0.5 percent abv). Ethyl acetate should not be present. Due to their nature, non-alcohol malt beverages will have a profile lacking the complexity and balance of flavors that beers containing alcohol will display. N/A beers should be assessed with this is mind, and should not be given negative evaluations for reasons related to the absence of alcohol."],["Body","Varies with underlying style"],["Notes","Non-alcohol beers that showcase, fruit, field/vegetables, chili, chocolate, coffee, spice, wood-aging or any non-traditional/unique ingredients and/or flavor outcomes should be categorized as Specialty Non-Alcohol beers. Sour beers, including kettle-sours and wild fermentations are appropriately entered here. While traditional, Belgian witbiers are appropriately entered in here due to the added spices. For purposes of competition, brewers will be asked to verify that the alcohol content of entries in this category are <0.5% abv. To allow for accurate judging the brewer must identify the underlying classic, experimental and or hybrid style(s), process(es) and or ingredients used which combine to make the less than 0.5% beer unique and which influence perceived sensory outcomes; the brewer may indicate 'no classic style' in instances where the base beer does not hew to a category within these competition guidelines. Beer entries not accompanied by this information will be at a disadvantage during judging.."]]}]},{"n":"18","name":"Session Beer","has":true,"subs":[{"id":"18A","name":"Session Beer","cat":"Session Beer","st":[["Original gravity","1.008-1.04"],["Final gravity","1.004-1.01"],["ABV","0.50%-5.00%"],["IBU","10-35"],["Color SRM (EBC)","2+ (4+ EBC)"]],"d":[["Color","The color should mimic the classic style upon which the beer is based"],["Clarity","Appearance may vary from brilliant to hazy to cloudy and should mimic the classic style upon which the beer is based"],["Malt aroma & flavor","Malt attributes should mimic the classic style upon which the beer is based, but at lower overall intensity due to lower original gravity."],["Hop aroma & flavor","Hop attributes should mimic the classic style upon which the beer is based, but at lower overall intensity in order to maintain the balance typical of that style."],["Bitterness","Should mimic the classic style upon which the beer is based, but at lower overall intensity in order to maintain the balance typical of that style."],["Fermentation","Varies with underlying style"],["Body","Varies with underlying style"],["Notes","This category includes beers of any style that 1) are at or below 5.0% abv (4.0% abw) and 2) have an original gravity and alcohol content below the range of the classic style as defined in these guidelines. These beers exhibit lower original gravity and alcohol content than the classic style. Balance and drinkability are key to a successful session beer. A beer at or below 5.0% abv (4% abw) that adheres to the specifications of a classic style is not categorized as Session Beer. For example, low gravity beers such as Belgian-Style Table Beers, Belgian-Style Session Ales, or English-Style Mild Ales should be categorized within their appropriate categories. A beer below 0.5% abv (0.4% abw) is categorized as a Non-Alcohol Malt Beverage. For purposes of this competition, brewers will be asked to verify that entries in this category contain abv that does not exceed 5.0%. Session versions of American-Style India Pale Ale and Juicy or Hazy India Pale Ale are categorized as Session India Pale Ale. Lower alcohol Belgian-Style ales which meet the respective criteria for alcohol content are categorized as Belgian-Style Table Beer or as Belgian-Style Session Ale. To allow for accurate judging the brewer must absolutely identify by name or category number the classic or experimental ale or lager style that is being created lower in alcohol and/or appropriately identify the style created ('Session Bock' for example). Beer entries not accompanied by this information will be profoundly disadvantaged during judging."]]},{"id":"18B","name":"Belgian-Style Table Beer","cat":"Session Beer","st":[["Original gravity","1.008-1.023"],["Final gravity","1.002-1.008"],["ABV","0.50%-2.00%"],["IBU","5-15"],["Color SRM (EBC)","5-50 (10-100 EBC)"]],"d":[["Color","Gold to black. Caramel color is sometimes added to adjust color."],["Clarity","Beer color may be too dark to perceive. When clarity is perceivable, chill haze is acceptable at low temperatures."],["Malt aroma & flavor","Mild malt character may be present"],["Hop aroma & flavor","Not present to very low"],["Bitterness","Very low to low"],["Fermentation","Diacetyl should not be present. Traditional versions do not use artificial sweeteners nor are they excessively sweet. More modern versions can incorporate sweeteners such as sugar and saccharin added post fermentation for additional sweetness and to increase smoothness."],["Body","Low"],["Notes","These beers may contain malted barley, wheat, and rye as well as unmalted wheat, rye, oats, and corn. Though not common, flavorings such as coriander or orange and lemon peel are sometimes added, but are barely perceptible. The mouthfeel is light to moderate, and sometimes boosted with unfermented sugars/malt sugars. Low carbonation and aftertaste are typical. To allow for accurate judging the brewer must provide additional information about the entry, including a classic Belgian beer style being elaborated upon (if appropriate), any special ingredients or processing used. Beer entries not accompanied by this information will be at a disadvantage during judging. Belgian-Style Table Beer would not be appropriately characterized as Session Beer."]]},{"id":"18C","name":"Belgian-Style Session Ale","cat":"Session Beer","st":[["Original gravity","1.018-1.04"],["Final gravity","1.002-1.01"],["ABV","2.10%-5.00%"],["IBU","5-35"],["Color SRM (EBC)","Varies"]],"d":[["Color","May vary widely"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Very low to low, exhibiting a wide range of malt-derived attributes"],["Hop aroma & flavor","Very low to low, exhibiting a wide range of hop-derived attributes"],["Bitterness","Very low to low but sufficient to balance other attributes"],["Fermentation","Phenolic spiciness may be absent or may be present at low levels. Fruity-ester complexity may range from low to medium, in harmony with malt and other attributes. Diacetyl should not be present."],["Body","Very low to low"],["Notes","Beers in this category recognize the uniqueness and traditions of Belgian brewing, but do not hew to any other Belgian-style categories defined in these guidelines. The most notable characteristic that these beers share is a modest alcohol content ranging from 2.1% - 5% abv. These beers can be lower gravity formulations of their own, or can be produced from second run wort from the production of higher gravity beers. Balance is a key component when assessing these beers. Wood-aged or fruited versions will exhibit attributes of wood-aging or fruit(s) in harmony with overall flavor profile. To allow for accurate judging the brewer must provide additional information about the entry, including the classic low gravity Belgian beer style, or the higher gravity Belgian beer style being made to lower alcohol content, along with any special ingredients or processing used. Beer entries not accompanied by this information will be at a disadvantage during judging. Belgian-Style Session Ales would not be appropriately characterized within the Session Beer category."]]},{"id":"18D","name":"South-German-Style Leichtes Weizen","cat":"Session Beer","st":[["Original gravity","1.028-1.044"],["Final gravity","1.004-1.008"],["ABV","2.50%-3.50%"],["IBU","10-15"],["Color SRM (EBC)","3.5-15 (7-30 EBC)"]],"d":[["Color","Straw to copper-amber"],["Clarity","If served with yeast, appearance may be very cloudy."],["Malt aroma & flavor","Very low to medium-low"],["Hop aroma & flavor","Not present to very low"],["Bitterness","Very low"],["Fermentation","The phenolic and estery aromas typical of Weissbiers should be present but less pronounced in this style. The overall flavor profile is less complex than Hefeweizen due to a lower alcohol content and there is less yeasty flavor. Diacetyl should not be present."],["Body","Low with a lighter mouthfeel than Hefeweizen. The German word 'leicht' means light, and as such these beers are light versions of Hefeweizen."],["Notes","Beers in this style are made with at least 50 percent wheat malt. They are often roused during pouring, and, when yeast is present, will have a yeasty flavor and a fuller mouthfeel."]]}]},{"n":"19","name":"Session India Pale Ale","has":false,"subs":[{"id":"19","name":"Session India Pale Ale","cat":"Session India Pale Ale","st":[["Original gravity","1.008-1.052"],["Final gravity","1.005-1.014"],["ABV","0.50%-5.00%"],["IBU","20-55"],["Color SRM (EBC)","3-12 (6-24 EBC)"]],"d":[["Color","Straw to copper"],["Clarity","Chill haze is acceptable at low temperatures. Hop haze is allowable at any temperature."],["Malt aroma & flavor","A low to medium maltiness may be present in aroma and flavor but varies with underlying style."],["Hop aroma & flavor","Hop aroma and flavor are medium to high, exhibiting a wide range of attributes. Overall hop character is assertive."],["Bitterness","Medium to high"],["Fermentation","Fruity esters are low to medium. Diacetyl should not be present."],["Body","Low to medium"],["Notes","Session India Pale Ales are lower alcohol versions of any of the various American, Juicy or Hazy, British or other India Pale Ale styles from around the world. Balance and high drinkability are key to a successful Session India Pale Ale. Hop aroma and flavor attributes hew to the underlying India Pale Ale style being made at lower strength. Beers exceeding 5.0% abv are not considered Session India Pale Ales. Beers under 5.0% abv (4.0% abw) which meet the criteria for another classic or traditional style category are not considered Session India Pale Ales. An India Pale Ale made to alcohol content below 0.5% abv (0.4% abw) is categorized as a Non-Alcohol Malt Beverage. For purposes of this competition, brewers will be asked to verify that entries in this category contain abv that does not exceed 5.0%. To allow for accurate judging the brewer must identify by name or category number the underlying base IPA style that is being created lower in alcohol and/or appropriately identify the style created ('Session Juicy Hazy IPA' for example). Beer entries not accompanied by this information will be profoundly disadvantaged during judging."]]}]},{"n":"20","name":"Strong Porter","has":true,"subs":[{"id":"20A","name":"Baltic-Style Porter","cat":"Strong Porter","st":[["Original gravity","1.072-1.092"],["Final gravity","1.016-1.022"],["ABV","7.60%-9.30%"],["IBU","35-40"],["Color SRM (EBC)","30+ (60+ EBC)"]],"d":[["Color","Black"],["Clarity","Opaque. When clarity is perceivable, chill haze should not be present."],["Malt aroma & flavor","Malt sweetness is medium-low to medium-high. Distinctive malt aromas and flavors of caramelized sugars, dark sugars, and dried fruits are present. Roast malt attributes may be present at low levels, but any bitterness or astringency should be in harmony with other flavor aspects."],["Hop aroma & flavor","Very low. Floral hop aroma can complement aromatics."],["Bitterness","Low to medium-low"],["Fermentation","Due to its alcoholic strength, there may be very low to low levels of complex alcohol aromas and flavors, and higher levels of fruitiness suggestive of berries, grapes, or plums, but not banana. Fruity esters, DMS, and diacetyl should not be present."],["Body","Medium to full"],["Notes","Baltic Porter is brewed with lager yeast and fermented and lagered cold producing a smooth beer. A low level of oxidation, if harmonious with other flavor components, is acceptable."]]},{"id":"20B","name":"American-Style Imperial Porter","cat":"Strong Porter","st":[["Original gravity","1.08-1.1"],["Final gravity","1.02-1.03"],["ABV","7.00%-12.00%"],["IBU","35-50"],["Color SRM (EBC)","40+ (80+ EBC)"]],"d":[["Color","Black"],["Clarity","Opaque"],["Malt aroma & flavor","No roast barley or strong burnt/black malt character should be present. Medium malt, caramel, and cocoa sweetness should be present."],["Hop aroma & flavor","Low to medium-high"],["Bitterness","Medium-low to medium"],["Fermentation","Fruity esters are present but not overpowering and should complement hop character and malt-derived sweetness. Diacetyl should not be present."],["Body","Full"]]}]},{"n":"21","name":"Other Strong Beer","has":true,"subs":[{"id":"21A","name":"Other Strong Beer","cat":"Other Strong Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","8%+"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with underlying style"],["Clarity","Varies with underlying style"],["Malt aroma & flavor","Varies with underlying style"],["Hop aroma & flavor","Varies with underlying style"],["Bitterness","Varies with underlying style"],["Fermentation","Within the framework of these guidelines, beers of any style intentionally brewed to a higher alcohol content than defined within that style’s guidelines are categorized as Other Strong Beer. These beers should achieve a balance between the style's characteristics and the additional alcohol, and are not wood- or barrel-aged. All Wood- and Barrel-Aged Beers that meet the criteria for elevated alcohol content shown below are categorized as any of several Wood- and Barrel-Aged Beers."],["Body","Varies with underlying style"],["Notes","For the purposes of this competition, entrants should review all other Strong/Imperial categories (Strong Porter, Imperial Red, Belgian Strong, etc.) first before entering this category to ensure their entry should not be classified elsewhere. IPA entries that fall outside of the standard Imperial IPA category specifications and/or have added ingredient such as fruit or spices should be entered as Experimental IPA. To allow for accurate judging the brewer must absolutely identify by name or category number the classic or experimental ale or lager style that is being created higher in alcohol and/or appropriately identify the style created ('Strong Vienna Lager' for example). Beer entries not accompanied by this information will be profoundly disadvantaged during judging."]]},{"id":"21B","name":"American-Style Wheat Wine Ale","cat":"Other Strong Beer","st":[["Original gravity","1.088-1.12"],["Final gravity","1.024-1.032"],["ABV","8.50%-12.20%"],["IBU","45-85"],["Color SRM (EBC)","5+ (10+ EBC)"]],"d":[["Color","Gold to black"],["Clarity","Chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Any of bready, wheat, honey or caramel malt aroma and flavor attributes are often present. High residual malt sweetness should be present."],["Hop aroma & flavor","Low to medium"],["Bitterness","Medium to medium-high"],["Fermentation","Fruity esters are often high and balanced by a complexity of alcohols and high alcohol content. Diacetyl is usually absent in these beers but may be present at very low levels. Phenolic yeast character, sulfur, and DMS should not be present. Oxidized, stale, and aged attributes are not typical of this style."],["Body","Full"],["Notes","This style is brewed with at least 50% wheat malt."]]},{"id":"21C","name":"American-Style Malt Liquor","cat":"Other Strong Beer","st":[["Original gravity","1.05-1.06"],["Final gravity","1.004-1.01"],["ABV","6.30%-7.60%"],["IBU","12-23"],["Color SRM (EBC)","2-6 (4-12 EBC)"]],"d":[["Color","Straw to gold"],["Clarity","Appearance should be clear. Chill haze should not be present"],["Malt aroma & flavor","Some malt sweetness is present"],["Hop aroma & flavor","Not present"],["Bitterness","Very low"],["Fermentation","Fruity esters and complex alcohol aromas and flavors are acceptable at low levels. Alcohol should not be solvent-like. DMS, diacetyl, and acetaldehyde should not be present."],["Body","Low to medium-low"],["Notes","Beers of this style are varied in character. Some malt liquors are only slightly stronger than American lagers, while others approach bock strength."]]}]},{"n":"22","name":"Experimental Beer","has":true,"subs":[{"id":"22A","name":"Ginjo Beer or Sake-Yeast Beer","cat":"Experimental Beer","st":[["Original gravity","1.04-1.09"],["Final gravity","1.008-1.02"],["ABV","4.30%-10.20%"],["IBU","12-35"],["Color SRM (EBC)","4-20 (8-40 EBC)"]],"d":[["Color","Pale to dark brown"],["Clarity","Slight chill haze is acceptable"],["Malt aroma & flavor","Very low to medium"],["Hop aroma & flavor","Low to medium and in harmony with sake-like character"],["Bitterness","Low to medium and in harmony with sake-like character"],["Fermentation","These beers are brewed with sake yeast or sake (koji) enzymes. The unique byproducts of sake yeast and koji enzymes should be distinctive and in harmony with other elements. Sake character may best be described as having mild fruitiness and mild earthiness expressed as mushroom or umami protein-like attributes. A high amount of alcohol may be evident."],["Body","Varies depending on original gravity. Mouthfeel also varies."],["Notes","High carbonation should be present. To allow for accurate judging the brewer must identify the classic ale, lager or other beer style being made with sake yeast, and may add information about other ingredient(s) or process used. The brewer may indicate 'no classic style' in instances where the base beer does not hew to a category within these competition guidelines. Beer entries not accompanied by this information will be at a disadvantage during judging."]]},{"id":"22B","name":"Wild Beer","cat":"Experimental Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Any color is acceptable. Versions made with fruits or other flavorings may take on corresponding hues."],["Clarity","Clear or hazy due to yeast, chill haze or hop haze."],["Malt aroma & flavor","Generally, these beers are highly attenuated resulting in very low to low malt character. Maltier versions should display good overall balance with other flavor components."],["Hop aroma & flavor","Very low to high"],["Bitterness","Very low to low"],["Fermentation","Aromas may vary significantly due to fermentation attributes contributed by various known and unknown microorganisms. The overall balance should be complex and balanced. Wild beers are spontaneously fermented with microorganisms that the brewer has introduced from the ambient air/environment near the brewery in which the beer is brewed. Wild Beers may not be fermented with any cultured strains of yeast or bacteria. Wild Beers may or may not be perceived as acidic. They may include a highly-variable spectrum of flavors and aromas derived from the wild microorganisms with which they are fermented. The overall balance of flavors, aromas, appearance and body are important factors in assessing these beers."],["Body","Very low to medium"],["Notes","Spontaneously fermented beers with fruit, spice or other ingredients should be categorized as Wild Beers. Within the framework of these guidelines, beers which hew to classic or traditional categories such as Belgian-Style Lambic, Gueuze, Fruit Lambic, etc. should be categorized as such, rather than as Wild Beers. To allow for accurate judging the brewer must provide additional information about the entry including the classic ale, lager or experimental base style of beer allowed to spontaneously ferment, information about the process used, and/or other ingredient(s) such as fruit, spices, etc. if any. The brewer may indicate ‘no classic style’ in instances where the base beer does not hew to a category within these competition guidelines. Beer entries not accompanied by this information will be at a disadvantage during judging."]]},{"id":"22C","name":"Fresh Hop Beer","cat":"Experimental Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with underlying style"],["Clarity","Chill haze is acceptable at low temperatures. Hop haze is allowable at any temperature."],["Malt aroma & flavor","Varies with underlying style"],["Hop aroma & flavor","Fresh hop aroma and flavor is prominent exhibiting green grass-like, fresh mown hay/grass or other fresh hop attributes."],["Bitterness","Varies with underlying style"],["Fermentation","Fruity esters may present at levels consistent with the underlying beer style being made with fresh hops"],["Body","Varies with underlying style"],["Notes","These ales or lagers are brewed with freshly harvested hops, typically no more than 72 hours prior to being added. Such hops might be undried fresh or frozen cones or ground material, or freshly kilned dried cones or pellets. Due to the large volume of plant material these beers encounter during the brewing and/or conditioning process, they should exhibit some perceptible chlorophyllic character, mouthfeel, and/or texture that should be harmonious with base style characteristics. These beers distinctly highlight the fresh hops used and are typically consumed while fresh to maximize the bright fresh hop attributes. Aging these beers will typically modify and reduce fresh-hop characters resulting in unique flavor outcomes. Within the framework of these guidelines, Fresh Hop India Pale Ales are classified as Fresh Hop Beers rather than Experimental India Pale Ales. To allow for accurate judging the brewer must identify an underlying ale or lager beer style being elaborated upon with fresh hops. The brewer may indicate 'no classic style' in instances where the base beer does not hew to a category within these competition guidelines. The brewer may also name the fresh hop variety(ies) used, and may include processing information such as the process point or vessel when fresh hops were added (kettle, whirlpool, hop back, fermenter, bright tank, etc. Beer entries not accompanied by this information will be at a disadvantage during judging."]]},{"id":"22D","name":"Experimental Beer","cat":"Experimental Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","May vary widely with ingredients used"],["Clarity","Varies with ingredients used and brewing process"],["Malt aroma & flavor","May vary widely with ingredients used and brewing process"],["Hop aroma & flavor","May vary widely with ingredients used and brewing process"],["Bitterness","May vary widely with ingredients used and brewing process"],["Fermentation","Will vary widely depending on the nature of the techniques and or ingredients used to create the beer"],["Body","May vary widely with ingredients used and brewing process"],["Notes","Experimental beers are beers that either 1. employ unique and unusual techniques and/or ingredients; or 2. beers that don’t meet the criteria of individual existing categories, representing a combination of two or more hybrid, specialty or classic categories. Experimental beers are primarily grainbased with a minimum of 51% of fermentable carbohydrates derived from malted grains. Beers produced using non-experimental techniques and/or ingredients are considered experimental beers if their properties overlap two or more existing categories and exhibit the distinctive characteristics of each of those categories. Uniqueness is the primary consideration when evaluating this category. Within the framework of these guidelines, field, fruit, chili pepper, chocolate, coffee, spice, wood-aged or other beers that fit within another individual category should not be categorized as experimental beers. experimental versions of various India Pale Ale and Imperial India Pale Ale categories are categorized as Experimental India Pale Ale. Nearly all fruited sour beers are categorized elsewhere; truly experimental versions might be categorized as Experimental Beer. To allow for accurate judging the brewer must identify the underlying classic, experimental and or hybrid style(s), process(es) and or ingredients used which combine to make the beer unique and which influence perceived sensory outcomes. The brewer may indicate 'no classic style' in instances where the base beer or the entry do not hew to a category within these competition guidelines. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"23","name":"Experimental India Pale Ale","has":false,"subs":[{"id":"23","name":"Experimental India Pale Ale","cat":"Experimental India Pale Ale","st":[["Original gravity","1.06-1.1"],["Final gravity","0.994-1.02"],["ABV","6.30%-10.60%"],["IBU","30-100"],["Color SRM (EBC)","3-40 (6-80 EBC)"]],"d":[["Color","Straw to very dark, varying widely with ingredients used"],["Clarity","May range from clear to very high degree of cloudiness. Starch, yeast, hop, protein, and other compounds can contribute to a wide range of hazy appearance within this category"],["Malt aroma & flavor","Very low to medium-low malt aroma and flavor may be present, and may exhibit attributes typical of various adjuncts and specialty malts"],["Hop aroma & flavor","Medium to very high hop aroma and flavor are present, with attributes typical of hops from any origin"],["Bitterness","Low to very high"],["Fermentation","Fruity esters are low to high and may contribute to an overall highly fruity impression regardless of the presence or absence of fruit(s) used and can contribute to the perception of sweetness and be complementary to the hop profile. Yeast choices can vary widely as can sensory outcomes; very low to low phenolic or other attributes typical of wine, champagne or Brettanomyces yeast strains may be present but are not required. Carbonation can range from average to high, with higher levels often associated with a crisp mouthfeel. Diacetyl and DMS should not be present."],["Body","Very low to medium, depending on grist and yeast choice, enzymatic treatment, finishing adjunct(s) and other fermentation parameters. Mouthfeel can vary widely from light to full and from dry to silky."],["Notes","Beers in this category recognize the cutting edge of IPA brewing around the world. Experimental India Pale Ales are either 1) any of White, Red, Brown, Rye, Brut (fermented with champagne yeasts), Brett (fermented with Brettanomyces), or many other IPA or Imperial IPA types or combinations thereof currently in production, and fruited or spiced versions of these, or 2) fruited, spiced, field (flavored with vegetables other than chili peppers), wood- and barrel-aged, or other elaborated versions of classic American, Juicy or Hazy, Imperial, British, or any other IPA categories. They range widely in color, hop, and malt intensity and attributes, hop bitterness, balance, alcohol content, body, and overall flavor experience. Dark versions of India Pale Ale that do not meet the specifications for American-Style Black Ale may be considered Experimental India Pale Ale. Fruited and spiced versions exhibit attributes typical of those ingredients, in harmony with hop impression and overall flavor experience. Lactose may be used to enhance body and balance, but should not lend to, or overwhelm, the flavor character of these beers. Classifying these beers can be complex. Categorized as Experimental India Pale Ale:Dark versions of India Pale Ale that do not meet the specifications for American-Style Black Ale may be considered Experimental India Pale Ale. India Pale Ales brewed with honey are categorized here. Spiced or fruited versions of these beers, or those made with unusual fermentables or honey, are categorized as Experimental India Pale Ale. India Pale Ales flavored with nuts, coconut or other vegetables are categorized here rather than as Field Beers. Categorized elsewhere: within the framework of these guidelines, all beers brewed with chili peppers are categorized as Chili Beers, therefore IPA's brewed w/ chili peppers in any form are categorized as Chili Beer. Fresh Hop India Pale Ales are categorized as Fresh Hop beers. For the purpose of competition, IPAs brewed with kveik or thiolized yeasts and/or aroma/flavor enhancers such as terpene blends, etc. are appropriately entered as Experimental IPA if they fall outside the parameters of other IPA categories; To allow for accurate judging the brewer must list any special ingredient(s) used such as fruits or spices, malt or sugar adjuncts or yeasts which elaborate on or deviate from classic American, Juicy Hazy or Imperial IPA production and which influence beer flavor outcomes. Brewer must list any enzymatic treatment or other special processes used. The brewer must also indicate an IPA 'type'. A few examples of supplemental information that meet these criteria are 'Brown IPA', 'Brut IPA w/enzyme and lactose', 'Red IPA w/munich malt', 'Am IPA w/cinnamon', or 'Juicy Hazy IPA w/mango'. Beer entries not accompanied by this information will be at a profound disadvantage during judging."]]}]},{"n":"24","name":"Historical Beer","has":true,"subs":[{"id":"24A","name":"Historical Beer","cat":"Historical Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with underlying style"],["Clarity","Varies with underlying style"],["Malt aroma & flavor","Varies with underlying style"],["Hop aroma & flavor","Varies with underlying style"],["Bitterness","Varies with underlying style"],["Fermentation","Varies with underlying style"],["Body","Varies with underlying style"],["Notes","Beers in this category include established historical beers or brewing traditions from any era or part of the world that do not fit within another beer style defined within these guidelines. Some Historical beers that could fit categories such as Experimental, Herb & Spice, Field Beer, etc. may be categorized as historical beers. This category pays tribute to beers that incorporate unique brewing ingredients, techniques, or both that were used in the past. Within the framework of these guidelines, examples of Historical Beers include South American Chicha, Nepalese Chong/Chang, African sorghum-based beers, and countless others. To allow for accurate judging the brewer must provide additional information about the entry including primarily the historical beer style being emulated or recreated, and any unique ingredients used and/or processing which contribute to perceived sensory outcomes. The brewer may include historical context about the entry. This information will help provide a basis for comparison between highly diverse entries, and is reviewed and edited by the competition manager to remove bias. Entries not accompanied by this information will be at a disadvantage during judging."]]},{"id":"24B","name":"Kentucky Common Beer","cat":"Historical Beer","st":[["Original gravity","1.04-1.055"],["Final gravity","1.01-1.018"],["ABV","4.00%-5.50%"],["IBU","15-30"],["Color SRM (EBC)","11-20 (22-40 EBC)"]],"d":[["Color","Medium to deep amber"],["Clarity","Chill haze or yeast haze is acceptable"],["Malt aroma & flavor","Medium-low to medium. Sweet malt is the dominant flavor attribute. Any of corn, caramel, toffee, or bready attributes may be present."],["Hop aroma & flavor","Low to medium. May exhibit floral or spicy attributes typical of early 20th century North American hop varieties."],["Bitterness","Low to medium"],["Fermentation","Low to medium-low fruity esters may be present. Very low levels of DMS, if present, are acceptable. Diacetyl should not be present."],["Body","Medium-low to medium with a dry finish enhanced by high carbonation"],["Notes","This American-born regional style proliferated around Louisville, Kentucky, from the Civil War era until Prohibition. Corn grits or flakes were commonly used at a rate or 25-35% of the total grist. Minerally attributes resulted from the use of hard brewing water. These beers were consumed very young, going from brewhouse to consumer in as little as one week. Early 20th century brewing literature mentions a slight tartness developing during fermentation as a characteristic attribute of this style. If tartness is present in modern versions, it should be at very low levels."]]},{"id":"24C","name":"Grodziskie","cat":"Historical Beer","st":[["Original gravity","1.031-1.034"],["Final gravity","1.009-1.012"],["ABV","2.50%-3.30%"],["IBU","20-30"],["Color SRM (EBC)","3-6 (6-12 EBC)"]],"d":[["Color","Straw to gold"],["Clarity","Some chill haze is acceptable at low temperatures"],["Malt aroma & flavor","Oak-smoked wheat malt comprises the entire grain bill. Low to medium-low grainy wheat malt character may be present. Smoked wheat malt aromas and flavors are medium-low to medium."],["Hop aroma & flavor","Aroma and flavor of noble hops ranges from low to medium-low. Should be slightly lower or equal to intensity of smoke aroma."],["Bitterness","Medium-low to medium-high"],["Fermentation","Very low pear-like fruity esters are acceptable. Very low levels of sulfur are optional. Diacetyl and DMS should not be present. An overall crisp flavor is achieved by managing fermentation temperatures. Sourness should not be present."],["Body","Low"],["Notes","Grodziskie (sometimes referred to as Graetzer in German) is an ale style of Polish origin is low-gravity, light-bodied, wheat ale with a note of oak smoke in aroma and flavor and clean hop bitterness. Historic versions were often bottle conditioned and highly carbonated."]]},{"id":"24D","name":"Adambier","cat":"Historical Beer","st":[["Original gravity","1.07-1.09"],["Final gravity","1.01-1.02"],["ABV","9.00%-11.00%"],["IBU","30-50"],["Color SRM (EBC)","15-35 (30-70 EBC)"]],"d":[["Color","Light brown to very dark"],["Clarity","Beer color may be too dark to perceive clarity. When clarity is perceivable, chill haze is absent."],["Malt aroma & flavor","Toast and caramel malt aroma and flavor may be present. Astringency from highly roasted malt should not be present."],["Hop aroma & flavor","Low, with attributes typical of traditional non-hybrid European hop varieties."],["Bitterness","Low to medium"],["Fermentation","A cool ale fermentation is typically used. Extensive aging and acidification can mask malt and hop character to varying degrees. Aging in barrels may contribute some level of Brettanomyces and lactic character."],["Body","Medium to full"],["Notes","The style originated in Dortmund and is a strong, dark, hoppy ale which may or may not be sour. It may also be extensively aged in wooden barrels. Traditional versions may have a low or medium-low degree of smokiness. Adambier may or may not use wheat in its formulation. Smoke character may be absent in contemporary versions. Fruited versions of this style which exhibit attributes of wood-aging should be categorized as fruited Wood- and Barrel-Aged Sour Beers. Fruited versions of this style which do not exhibit attributes of wood-aging should be categorized as Fruit Wheat Beers."]]},{"id":"24E","name":"Dutch-Style Kuyt Beer","cat":"Historical Beer","st":[["Original gravity","1.05-1.08"],["Final gravity","1.006-1.015"],["ABV","4.70%-7.90%"],["IBU","25-35"],["Color SRM (EBC)","5-12.5 (10-25 EBC)"]],"d":[["Color","Gold to copper"],["Clarity","Chill haze and other haze is acceptable"],["Malt aroma & flavor","The aroma is grainy or grainy-bready. A distinctive aroma and flavor profile arises from the use of at least 45 percent oat malt, and at least 20 percent wheat malt. Pale malt makes up the remainder of the grain bill."],["Hop aroma & flavor","Very low to low from noble hops or other traditional European varieties"],["Bitterness","Medium-low to medium"],["Fermentation","Esters may be present at low levels. Diacetyl is usually absent in these beers but may be present at very low levels. Acidity and sweet corn-like DMS should not be present."],["Body","Low to medium"],["Notes","This style of beer was popular in the Netherlands from 1400-1550."]]},{"id":"24F","name":"Finnish-Style Sahti","cat":"Historical Beer","st":[["Original gravity","1.06-1.09"],["Final gravity","1.016-1.04"],["ABV","7.00%-8.50%"],["IBU","3-16"],["Color SRM (EBC)","4-12 (8-24 EBC)"]],"d":[["Color","Pale to copper"],["Clarity","Chill haze, yeast haze and general turbidity is acceptable."],["Malt aroma & flavor","Malt aroma is medium-low to medium. Malt flavor is medium to high with malt sweetness present."],["Hop aroma & flavor","Not present to very low"],["Bitterness","Very low"],["Fermentation","These beers can vary significantly in character. Fruity ester and yeasty aromas are medium to high. Diacetyl should not be present. Bread/bakers’ yeast is traditionally used for fermentation and may produce flavors and aromas of complex alcohols, clove-like phenolics and banana fruitiness."],["Body","Medium to full"],["Notes","Juniper aroma and flavor may or may not be present due to the use of juniper boughs/branches and/or berries in the brewing process."]]},{"id":"24G","name":"Swedish-Style Gotlandsdricke","cat":"Historical Beer","st":[["Original gravity","1.04-1.05"],["Final gravity","1.01-1.014"],["ABV","5.50%-6.50%"],["IBU","15-25"],["Color SRM (EBC)","4-12 (8-24 EBC)"]],"d":[["Color","Pale to copper"],["Clarity","Chill haze or yeast haze is acceptable"],["Malt aroma & flavor","Medium-low to medium. Birchwood smoke character, derived from the malting process, should be present."],["Hop aroma & flavor","Not present to very low"],["Bitterness","Very low to medium-low"],["Fermentation","Bread/bakers’ yeast is traditionally used for fermentation and contributes to unique character of these beers. Fruity ester and yeasty aromas are medium to high. Diacetyl should not be present."],["Body","Medium to full"],["Notes","Juniper aroma and flavor should be present due to the use of juniper boughs/branches and berries in the brewing process. These beers are characterized by juniper and birchwood smoked malt."]]},{"id":"24H","name":"Breslau-Style Schoeps","cat":"Historical Beer","st":[["Original gravity","1.067-1.072"],["Final gravity","1.016-1.024"],["ABV","6.00%-7.00%"],["IBU","20-30"],["Color SRM (EBC)","2-40+ (4-80+ EBC)"]],"d":[["Color","Straw to black"],["Clarity","Chill haze is acceptable at low temperatures. Hue may be too dark to perceive clarity in some versions."],["Malt aroma & flavor","Malt sweetness is medium to medium-high with a pronounced malt character. A high proportion of pale or dark wheat malt (as much as 80 percent) is used to brew these beers as well as Pilsener and other pale, toasted, or dark specialty malts. Paler versions may have bready, aromatic biscuit malt attributes. Darker versions may exhibit roast malt bitterness at low levels, and toasted or nutty malt attributes. Caramel-like malt attributes are not present."],["Hop aroma & flavor","Very low"],["Bitterness","Medium-low to medium"],["Fermentation","Fruity esters may be present as these beers are fermented with ale yeast as opposed to wheat beer yeast. Diacetyl and phenolic aromas and flavors should not be present."],["Body","Full"],["Notes","Traditional German wheat beer yeast is not used in this style of beer."]]}]},{"n":"25","name":"Gluten-Free Beer","has":false,"subs":[{"id":"25","name":"Gluten-Free Beer","cat":"Gluten-Free Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with underlying style"],["Clarity","Varies with underlying style"],["Malt aroma & flavor","Varies with underlying style. Grains and fermentables which differ from those typically used to produce a given beer style can and will produce flavor and aroma outcomes that differ from traditional versions. Such differences are to be expected and are acceptable."],["Hop aroma & flavor","Varies with underlying style"],["Bitterness","Varies with underlying style"],["Fermentation","Although brewers may design and identify these beers according to defined style guidelines, these beers should be evaluated on their own merits without strict adherence to defined style parameters."],["Body","Varies with underlying style"],["Notes","This category includes lagers, ales or other beers made from fermentable sugars, grains and converted carbohydrates and must also include some portion of cereal. All ingredients must be free of gluten. Within the framework of these guidelines, beers brewed with barley, wheat, spelt, rye, and other glutencontaining ingredients may not be categorized as Gluten-Free. Gluten-Free Beers may contain malted grains that are gluten-free. NOTE: These guidelines do not supersede any government regulations. Wine, mead, flavored malt beverages or beverages other than 'beer' as defined by the TTB (U.S. Trade and Tax Bureau) are not considered 'gluten-free beer' under these guidelines. Gluten-reduced beers’ original ingredients would have gluten content that has been reduced by enzymes or other processes to reduced levels. Gluten-reduced beers should be categorized in the classic style category most appropriate for the beer, rather than as Gluten-Free Beer. To allow for accurate judging brewer is required to identify carbohydrate sources and fermentation type used to make the beer, and the classic ale, lager, hybrid or experimental beer style being elaborated upon (if there is one) with regard to flavor, aroma and appearance. The brewer may indicate ‘no classic style’ in instances where the base beer does not hew to a category within these competition guidelines as well as any additional ingredients used in brewing the beer. Beer entries not accompanied by this inform
