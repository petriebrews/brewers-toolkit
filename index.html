ation will be at a disadvantage and/or ineligible for judging."]]}]},{"n":"26","name":"American-Belgo-Style Ale","has":false,"subs":[{"id":"26","name":"American-Belgo-Style Ale","cat":"American-Belgo-Style Ale","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Gold to black"],["Clarity","Should conform the base beer style"],["Malt aroma & flavor","Typically low. Perception of specialty or roasted malts or barley can be very low to robust in darker versions."],["Hop aroma & flavor","Medium to very high, exhibiting American-type hop aromas not usually found in traditional Belgian styles."],["Bitterness","Medium to high, in alignment with base beer style."],["Fermentation","Fruity esters are medium to high. Belgian yeast attributes such as banana, berry, apple, coriander, spice or smoky-phenolic should be in balance with malt and hops. Diacetyl, sulfur, and attributes typical of Brettanomyces should not be present."],["Body","Medium-low to medium, in alignment with base beer style."],["Notes","American-Belgo-Style Ales are either 1) non-Belgian beer types portraying the unique characters imparted by yeasts typically used in big, fruity Belgian-style ales, or 2) defined Belgian-style beers displaying the hallmark attributes typical of American variety hops. These beers are unique unto themselves. To allow for accurate judging the brewer must indicate the classic, experimental or hybrid ale style of the underlying base beer; the brewer may indicate 'no classic style' in instances where the base beer does not hew to a category within these competition guidelines. The brewery may also provide information unique to the entry such as hop variety(ies) used, yeast type, etc. ('American IPA fermented w abbey yeast' for example). Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"27","name":"American-Style Sour or Wood & Barrel Aged Sour Beer","has":true,"subs":[{"id":"27A","name":"American-Style Sour Ale","cat":"American-Style Sour or Wood & Barrel Aged Sour Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Pale to black"],["Clarity","Chill haze, bacteria, and yeast-induced haze is acceptable at any temperature."],["Malt aroma & flavor","Low. In darker versions, any of roasted malt, caramel, or chocolate aroma and flavor attributes should be present at low levels."],["Hop aroma & flavor","None to high"],["Bitterness","None to high"],["Fermentation","Moderate to intense, yet balanced, fruity esters are present. Diacetyl, DMS, and Brettanomyces should not be present. The evolution of natural acidity at medium-low to high levels develops a balanced complexity and is expressed as a refreshing, pleasant sourness, in harmony with other attributes. The acidity present is usually in the form of lactic, acetic, and other organic acids naturally developed with acidified malt in the mash or in kettle or post wort fermentation and is produced by various microorganisms including certain bacteria and yeasts. Acidic character can be a complex balance of several types of acid and attributes of age. Wood vessels may be used during the fermentation and aging process, but wood-derived flavors such as vanillin should not be present. There should be no residual flavors from liquids previously aged in a barrel such as bourbon or sherry."],["Body","Low to high"],["Notes","Beers exhibiting wood-derived characters or characters of liquids previously aged in wood are categorized as Wood-Aged Sour Beer. Fruited versions are categorized elsewhere. To allow for accurate judging the brewer must provide additional information about the entry to allow for comparison between diverse entries. Such information must include the classic, experimental or hybrid style of the underlying base beer being made sour; because these beers often defy categorization and the base beer may not hew to an existing style guideline outlined herein, brewer may indicate 'no classic style'. Such information could also identify microbes, special ingredients or special processes used that influence sensory outcomes. Beer entries not accompanied by this information will be at a disadvantage during judging."]]},{"id":"27B","name":"Wood- and Barrel-Aged Sour Beer","cat":"American-Style Sour or Wood & Barrel Aged Sour Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with underlying style"],["Clarity","Varies with underlying style"],["Malt aroma & flavor","Varies with underlying style"],["Hop aroma & flavor","Varies with underlying style"],["Bitterness","Varies with underlying style"],["Fermentation","Typical of underlying style of sour beer being aged"],["Body","Varies with underlying style"],["Notes","These are any traditional or experimental style of lager, ale or hybrid beer aged in either a wooden barrel or in contact with wood, and exhibiting acidity derived from exposure to bacteria. These beers are aged in the presence of microflora (either present in the wood or introduced at some time in the brewing process) with the intention of introducing sourness to the beer. These beers are aged with the intention of developing unique attributes imparted by the wood, or by liquids that had previously been stored in contact with the wood. Wood-aging does not necessarily impart wood flavors but does result in distinctive sensory outcomes. Used sherry, rum, whiskey, tequila, port, wine, and other barrels are often used, imparting complexity and uniqueness to a beer. A balance of aroma, flavor, and mouthfeel results from the marriage of new beer with attributes imparted by the wood or barrel, and with sourness or other attributes derived from bacteria. Wood-Aged Sour Beer fermented with Brettanomyces or which exhibit sensory attributes typical of Brettanomyces is categorized elsewhere. To allow for accurate judging the brewer must provide additional information about the entry including the classic, experimental or hybrid ale or lager beer style being aged in wood; because these beers often defy categorization and the base beer may not hew to an existing style guideline outlined herein, brewer may indicate 'no classic style'. Such information must identify spice(s) or other ingredients used (if any), souring method, type of wood used (new or old, oak or other wood type), previous liquids in the barrel if any (port/ whiskey/ wine/ sherry/other), etc. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"28","name":"Fruited American-Style Sour Ale","has":false,"subs":[{"id":"28","name":"Fruited American-Style Sour Ale","cat":"Fruited American-Style Sour Ale","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Can range from pale to black depending on underlying beer style and is often influenced by the color of added fruit"],["Clarity","Chill haze, bacteria, and yeast-induced haze is acceptable at any temperature."],["Malt aroma & flavor","Low. In darker versions, any of roasted malt, caramel, or chocolate aroma and flavor attributes should be present at low levels."],["Hop aroma & flavor","None to high"],["Bitterness","None to high and in balance with fruit character"],["Fermentation","Moderate to intense, yet balanced, fruity esters are present. Diacetyl, DMS, and Brettanomyces should not be present. The evolution of natural acidity at medium-low to high levels develops a balanced complexity and is expressed as a refreshing, pleasant sourness, in harmony with other attributes. The acidity present is usually in the form of lactic, acetic, and other organic acids naturally developed with acidified malt in the mash or in kettle or post wort fermentation and is produced by various microorganisms, including certain bacteria and yeasts. Acidic character can be a complex balance of several types of acid and attributes of age. Wood vessels may be used during the fermentation and aging process, but wood-derived flavors such as vanillin should not be present. Attributes arising from liquids previously aged in a barrel, such as bourbon or sherry, should not be present."],["Body","Low to high"],["Notes","Fruit aromas, ranging from subtle to intense, should be present. Fruit or fruit extracts, used as an adjunct in either the mash, kettle, primary or secondary fermentation, provide harmonious fruit character ranging from subtle to intense. Beers exhibiting wood-derived attributes or evidence of liquids previously aged in wood are categorized as Fruited Wood-Aged Sour Beer. Within the framework of these guidelines, coconut is defined as a vegetable, and beers containing coconut are categorized as Field Beer. Likewise beers containing chili peppers are categorized as Chili Beer. Fruited versions of Berliner-Style Weisse and Belgian-Style Sour Ale are categorized elsewhere. To allow for accurate judging the brewer must provide additional information about the entry to allow for comparison between diverse entries. Such information must include the classic, experimental or hybrid style of the underlying base beer being made sour; because these beers often defy categorization and the base beer may not hew to an existing style guideline outlined herein, brewer may indicate 'no classic style'. Such information must identify fruit(s) used, and could also identify microbes, special ingredients or special processes used that influence sensory outcomes. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"29","name":"Brett Beer","has":false,"subs":[{"id":"29","name":"Brett Beer","cat":"Brett Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Any color is acceptable. Beer color may be influenced by the color of added fruits or other ingredients."],["Clarity","Chill or yeast haze is allowable at low to medium levels at any temperature"],["Malt aroma & flavor","In darker versions, any of roasted malt, caramel or chocolate aromas and flavors are present at low levels."],["Hop aroma & flavor","Low to high"],["Bitterness","Low to high"],["Fermentation","Medium to high fruity esters are present. Subtle acidity/tartness resulting from Brettanomyces fermentation results in a complex flavor profile. Brettanomyces character should be present at low to high levels, expressed as any of horsey, goaty, leathery, phenolic or fruity aroma and flavor attributes. Brettanomyces character may or may not be dominant. Subtle acidity/tartness from Brettanomyces should be low to medium-low but may increase with exposure to oxygen during barrel aging. Cultured yeast strains may be used in the fermentation. Beers fermented with Brettanomyces that do not exhibit attributes typical of Brettanomyces fermentation are categorized elsewhere. Beers in this style should not incorporate bacteria or exhibit a bacteria-derived flavor profile. Diacetyl and DMS should not be present."],["Body","Low to high"],["Notes","Fruited versions will exhibit fruit flavors in balance with other elements. Wood vessels may be used for fermentation and aging; such beers may or may not exhibit attributes typical of wood-aging such as vanillin or of liquids previously aged in a barrel (bourbon, sherry, etc.) A beer exhibiting additional sensory attributes arising from microbes other than Brett is categorized as Mixed Culture Brett Beer. Various India Pale Ales fermented with Brett are categorized as Experimental India Pale Ale. To allow for accurate judging the brewer must provide additional information about the entry to allow for comparison between diverse entries. Such information must include the classic, experimental or hybrid style of the underlying base beer; because these beers often defy categorization and the base beer may not hew to an existing style guideline outlined herein, brewer may indicate 'no classic style'. Such information must identify fruit(s) or other ingredients used (if any), and could also include microbes or special processes used that influence sensory outcomes. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"30","name":"Mixed-Culture Brett Beer","has":false,"subs":[{"id":"30","name":"Mixed-Culture Brett Beer","cat":"Mixed-Culture Brett Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Any color is acceptable. Beer color may be influenced by the color of added fruits or other ingredients."],["Clarity","Chill haze, bacteria and yeast-induced haze is allowable at low to medium levels at any temperature."],["Malt aroma & flavor","In darker versions, any of roasted malt, caramel, or chocolate aromas and flavors are present at low levels."],["Hop aroma & flavor","Low to high"],["Bitterness","Low to high"],["Fermentation","Medium to high fruity esters are present. Acidity resulting from fermentation with Brettanomyces or bacteria results in a complex flavor profile. Brettanomyces character should be present and expressed as any of horsey, goaty, leathery, phenolic, fruity, or acidic aroma and flavor attributes. Cultured yeast may be used in the fermentation. Bacteria should be incorporated and in evidence. Bacteria will contribute acidity which may or may not dominate the flavor profile. Diacetyl and DMS should not be present."],["Body","Low to high"],["Notes","Fruited versions will exhibit fruit flavors in balance with other elements. Wood vessels may be used for fermentation and aging; such beers may or may not exhibit attributes typical of wood-aging such as vanillin or of liquids previously aged in a barrel (bourbon, sherry, etc.). To allow for accurate judging the brewer must provide additional information about the entry to allow for comparison between diverse entries. Such information must include the classic, experimental or hybrid style of the underlying base beer; because these beers often defy categorization and the base beer may not hew to an existing style guideline outlined herein, brewer may indicate 'no classic style'. Such information must identify fruit(s) or other ingredients (if any), and could include microbes or special processes used that influence sensory outcomes. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"31","name":"Wood- and Barrel-Aged Beer","has":false,"subs":[{"id":"31","name":"Wood- and Barrel-Aged Beer","cat":"Wood- and Barrel-Aged Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","3.75%-8.00%"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with underlying style"],["Clarity","Varies with underlying style"],["Malt aroma & flavor","Varies with underlying style"],["Hop aroma & flavor","Varies with underlying style"],["Bitterness","Varies with underlying style"],["Fermentation","Typical of underlying style of beer being aged. Within the framework of these guidelines, these beers contain alcohol less than or up to (but not exceeding) 8.0% abv or 6.4% abw when consumed."],["Body","Varies with underlying style"],["Notes","Within the framework of these guidelines these beers meet the criteria for content shown above. Stronger (>6.4% abw or >8.0% abv) beers of any color should be categorized in other wood-aged beer styles. These are any traditional or experimental style of lager, ale or hybrid beer aged in either a wooden barrel or in contact with wood. These beers are aged with the intention of developing unique attributes imparted by the wood and/or by liquids that had previously been stored in contact with the wood. Wood aging does not necessarily impart wood flavors but does result in distinctive sensory outcomes. Used sherry, rum, whiskey, tequila, port, wine and other barrels are often used, imparting complexity and uniqueness to a beer. A balance of aroma, flavor and mouthfeel results from the marriage of new beer with attributes imparted by the wood or barrel. Wood-aged beers which exhibit sensory attributes typical of Brettanomyces alone, or of Brettanomyces and other microbes, are categorized as Brett Beer or Mixed-Culture Brett Beer respectively. Sour wood-aged beers and Fruited sour wood-aged beers are categorized as Sour Wood-Aged or Fruited Sour Wood-Aged Beer, respectively. To allow for accurate judging the brewer must provide additional information about the entry including the classic, experimental or hybrid ale or lager beer style being aged in wood; because these beers often defy categorization and the base beer may not hew to an existing style guideline outlined herein, brewer may indicate ‘no classic style’. Such information must identify fruit(s), spice(s) or other ingredients used (if any), and could include type of wood used (new or old, oak or other wood type), previous liquids in the barrel if any (port/ whiskey/ wine/ sherry/ other), etc. Beer entries not accompanied by this information will be at a disadvantage during judging. Beers brewed with chili are allowable in this category in some situations but flavor outcomes from wood/barrel aging must be the focus.."]]}]},{"n":"32","name":"Wood- and Barrel-Aged Strong Beer","has":false,"subs":[{"id":"32","name":"Wood- and Barrel-Aged Strong Beer","cat":"Wood- and Barrel-Aged Strong Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV",">8.0%"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with underlying style and can be influenced by the color of added fruit(s) if any"],["Clarity","Varies with underlying style"],["Malt aroma & flavor","Varies with underlying style"],["Hop aroma & flavor","Varies with underlying style"],["Bitterness","Varies with underlying style"],["Fermentation","Typical of underlying style of beer being aged. Within the framework of these guidelines, these beers contain alcohol greater than 6.4% abw or 8.0% abv when consumed. Alcohol may be evident in stronger versions, in harmony with other flavor and aroma attributes, and not harsh."],["Body","Varies with underlying style"],["Notes","Within the framework of these guidelines, these are any traditional or experimental style of lager, ale or hybrid beer (with the exception of various stronger stout styles) aged in either a wooden barrel or in contact with wood, which meet the criteria for alcohol content shown below. Lower alcohol (<=6.4% abw or <=8.0% abv) wood-aged beers should be categorized as other wood-aged beer styles. Strong wood-aged stouts with alcohol above 6.4% abw or 8.0% abv are categorized as Wood Aged Strong Stout. These beers are aged with the intention of developing unique attributes imparted by the wood and/or by liquids that had previously been stored in contact with the wood. Wood aging does not necessarily impart wood flavors but does result in distinctive sensory outcomes. Used sherry, rum, whiskey, tequila, port, wine and other barrels are often used, imparting complexity and uniqueness to a beer. A balance of aroma, flavor and mouthfeel results from the marriage of new beer with attributes imparted by the wood or barrel. Wood-Aged Beers which exhibit sensory attributes typical of Brettanomyces alone, or of Brettanomyces and other microbes, are categorized as Brett Beer or Mixed-Culture Brett Beer respectively. Sour wood-aged beers should be categorized elsewhere. Fruited or spiced wood-aged beers which meet the criteria for alcohol content and which exhibit attributes of wood- aging are appropriately categorized here and may take on the color, flavors and aromas of added fruits or spices. However, sour versions of fruited or spiced wood-aged beers are categorized elsewhere. To allow for accurate judging the brewer must provide additional information about the entry including the classic, experimental or hybrid ale or lager beer style being aged in wood; because these beers often defy categorization and the base beer may not hew to an existing style guideline outlined herein, brewer may indicate ‘no classic style’. Such information must identify fruit(s), spice(s) or other ingredients used (if any), and could include type of wood used (new or old, oak or other wood type), previous liquids in the barrel if any (port/ whiskey/ wine/ sherry/ other), etc. Beer entries not accompanied by this information will be at a disadvantage during judging. Beers brewed with chili are allowable in this category in some situations but flavor outcomes from wood/barrel aging must be the focus.."]]}]},{"n":"33","name":"Wood- and Barrel-Aged Strong Stout","has":false,"subs":[{"id":"33","name":"Wood- and Barrel-Aged Strong Stout","cat":"Wood- and Barrel-Aged Strong Stout","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV",">8.0%"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Characteristically very dark to black, varying with underlying strong stout style"],["Clarity","Opaque"],["Malt aroma & flavor","Varies with underlying stout style"],["Hop aroma & flavor","Varies with underlying stout style"],["Bitterness","Varies with underlying stout style"],["Fermentation","Typical of underlying style of strong stout being aged. Within the framework of these guidelines, these beers contain alcohol greater than 6.4% abw or 8.0% abv when consumed. Alcohol may be evident in stronger versions, in harmony with other flavor and aroma attributes, and not harsh."],["Body","Varies with underlying stout style"],["Notes","Within the framework of these guidelines, these are any traditional or experimental strong stout aged in either a wooden barrel or in contact with wood, which meet the criteria for alcohol content shown above. Lower alcohol (<=6.4% abw or <=8.0% abv) wood-aged stouts should be categorized as other wood-aged beer styles. These beers are aged with the intention of developing unique attributes imparted by the wood and/or by liquids that had previously been stored in contact with the wood. Wood aging does not necessarily impart wood flavors, but does result in distinctive sensory outcomes. Used sherry, rum, whiskey, tequila, port, wine and other barrels are often used, imparting complexity and uniqueness to a beer. A balance of aroma, flavor and mouthfeel results from the marriage of new beer with attributes imparted by the wood or barrel. Wood-aged stouts which exhibit sensory attributes typical of Brettanomyces alone, or of Brettanomyces and other microbes, are categorized as Brett Beer or Mixed-Culture Brett Beer respectively. Sour wood-aged strong stouts (with or without fruit) should be categorized elsewhere. Fruited or spiced wood-aged strong stouts which meet the criteria for alcohol content and which exhibit attributes of wood-aging are appropriately categorized here and may take on the flavors and aromas (and perhaps hue) of added fruits or spices. To allow for accurate judging the brewer must provide additional information about the entry including the classic, experimental or hybrid ale or lager beer style being aged in wood; because these beers often defy categorization and the base beer may not hew to an existing style guideline outlined herein, brewer may indicate ‘no classic style’. Such information must identify fruit(s), spice(s) or other ingredients used (if any), and could include type of wood used (new or old, oak or other wood type), previous liquids in the barrel if any (port/ whiskey/ wine/ sherry/ other), etc. Beer entries not accompanied by this information will be at a disadvantage during judging. Beers brewed with chili are allowable in this category in some situations but flavor outcomes from wood/barrel aging must be the focus.."]]}]},{"n":"34","name":"Wood- and Barrel-Aged Dessert or Pastry Beer","has":false,"subs":[{"id":"34","name":"Wood- and Barrel-Aged Dessert or Pastry Beer","cat":"Wood- and Barrel-Aged Dessert or Pastry Beer","st":[["Original gravity","1.08-1.120+"],["Final gravity","1.02-1.060+"],["ABV","7%-13%+"],["IBU","20-65"],["Color SRM (EBC)","35+ (70+ EBC)"]],"d":[["Color","Very dark to black"],["Clarity","Opaque"],["Malt aroma & flavor","Extremely rich malty aroma and flavor is typical. Coffee, caramel, roasted malt, or chocolate aromas and flavors may be evident."],["Hop aroma & flavor","If present, very low"],["Bitterness","Not present to low"],["Fermentation","High alcohol content is evident. Fruity esters may be present at low levels. Diacetyl, if present, should be at low levels."],["Body","Full"],["Notes","Beers in this category build on a strong dark beer base and incorporate culinary ingredients to create rich, sweet flavor profiles mimicking the character of desserts, pastries or candies. Examples of culinary ingredients used in these beers include, but are not limited to, chocolate, coffee, coconut, vanilla, maple syrup, peanut butter and marshmallow as well as fruits, nuts and spices. The addition of sugars from any source may contribute to the pronounced sweetness of these beers. While this category may overlap several other styles defined in these guidelines such as Chocolate or Cocoa Beers, Coffee Beers, Field beers, and others, the combination of a high-gravity beer base, elevated alcohol content, barrel-aging and rich, sweet, dessert-like flavor profiles sets this style apart as a unique entity. When barrel-aged, barrel and/or previous liquids from barrel should complement rather than dominate overall flavor profile. To allow for accurate judging the brewer must provide additional information about the entry including the classic style underlying strong dark beer, any pertinent barrel-aging information and any additional fruit(s), spice(s) or other ingredients or processes used. Beer entries not accompanied by this information will be at a disadvantage during judging.."]]}]},{"n":"35","name":"Fruited Wood- and Barrel-Aged Sour Beer","has":false,"subs":[{"id":"35","name":"Fruited Wood- and Barrel-Aged Sour Beer","cat":"Fruited Wood- and Barrel-Aged Sour Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies with style, and may take on color of added fruits or other ingredients"],["Clarity","Varies with underlying style"],["Malt aroma & flavor","Varies with underlying style and in harmony with fruit aromas and flavors"],["Hop aroma & flavor","Varies with underlying style"],["Bitterness","Varies with underlying style"],["Fermentation","Typical of underlying style of sour beer being aged"],["Body","Varies with underlying style"],["Notes","These are fruited versions of any traditional or experimental style of lager, ale or hybrid beer aged in either a wooden barrel or in contact with wood, and exhibiting acidity derived from exposure to bacteria. These beers are aged in the presence of microflora (either present in the wood or introduced at some time in the brewing process) with the intention of introducing sourness to the beer. These beers are aged with the intention of developing unique attributes imparted by the wood and/or by liquids that had previously been stored in contact with the wood. Wood aging does not necessarily impart wood flavors, but does result in distinctive sensory outcomes. Used sherry, rum, whiskey, tequila, port, wine and other barrels are often used, imparting complexity and uniqueness to a beer. A balance of aroma, flavor and mouthfeel results from the marriage of new beer with fruit, attributes imparted by the wood or barrel, and with sourness and/or other attributes derived from bacteria. These beers may or may not have Brettanomyces character. For purposes of competition, entries made with combinations of fruit(s) and or spices and or other ingredients, and which therefore represent combinations of multiple hybrid beer styles, are nonetheless categorized here as Fruited Wood-Aged Sour Beer. Fruited wood aged sour entries that hew to various fruited Belgian sour styles may be categorized as Belgian Fruit Beers depending on the strength of the wood or barrel character showcased in the beer. To allow for accurate judging the brewer must provide additional information about the entry including the classic, experimental or hybrid ale or lager beer style being aged in wood; because these beers often defy categorization and the base beer may not hew to an existing style guideline outlined herein, brewer may indicate 'no classic style'. Such information must identify fruit(s) or other ingredients used (if any), souring method, type of wood used (new or old, oak or other wood type), previous liquids in the barrel if any (port/ whiskey/ wine/ sherry/other), etc. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"36","name":"Kellerbier or Zwickelbier","has":true,"subs":[{"id":"36A","name":"Unfiltered European-Style Ale","cat":"Kellerbier or Zwickelbier","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies depending on the underlying European origin ale style"],["Clarity","Can be slightly hazy to moderately cloudy. A small amount of yeast haze is acceptable and traditional. These beers must be unfiltered but may become clear with age. May exhibit poor head retention."],["Malt aroma & flavor","Varies depending on the underlying style"],["Hop aroma & flavor","Varies depending on underlying style. Low level attributes typical of late or dry hopping may be present in some versions."],["Bitterness","Varies depending on underlying style"],["Fermentation","Low to medium yeast aroma and flavor is desirable. Very low to moderately low levels of sulfur should be apparent. Low levels of acetaldehyde or other volatiles, normally reduced during lagering, may or may not be apparent. The presence of sulfur and acetaldehyde should enhance the flavor of these beers. Fruity-estery levels may vary slightly from the underlying styles due to age and presence of yeast."],["Body","Varies depending on underlying style"],["Notes","Kellerbier ales are unfiltered versions of ale styles of European origin. These can include traditional Kolsch, Alt, as well as less common traditional or contemporary European-origin ale styles. Carbonation may vary with underlying style. These unfiltered beers are packaged and served with very low to moderate amounts of yeast. Contemporary versions may be filtered and dosed with yeast during packaging. Beers containing non-standard ingredients or aged in flavor-imparting vessels should be categorized elsewhere. During registration brewers may specify pouring instructions, choosing quiet pouring or intentional rousing of yeast. Entries will be presented during judging as specified by entering brewer. To allow for accurate judging the brewer must provide the classic European-origin ale style on which the entry is based. Beer entries not accompanied by this information will be at a disadvantage during judging."]]},{"id":"36B","name":"Unfiltered European-Style Lager","cat":"Kellerbier or Zwickelbier","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Varies depending on the underlying European origin ale style"],["Clarity","Can be slightly hazy to moderately cloudy. A small amount of yeast haze is acceptable and traditional. These beers must be unfiltered but may become clear with age. May exhibit poor head retention."],["Malt aroma & flavor","Varies depending on the underlying style"],["Hop aroma & flavor","Varies depending on underlying style. Low level attributes typical of late or dry hopping may be present in some versions."],["Bitterness","Varies depending on underlying style"],["Fermentation","Low to medium yeast aroma and flavor is desirable. Very low to moderately low levels of sulfur should be apparent. Low levels of acetaldehyde or other volatiles, normally reduced during lagering, may or may not be apparent. The presence of sulfur and acetaldehyde should enhance the flavor of these beers. Fruity-estery levels may vary slightly from the underlying styles due to age and presence of yeast."],["Body","Varies depending on underlying style"],["Notes","Kellerbier lagers are unfiltered versions of lager styles of European origin. These can include Munich-Style Helles, Dunkel, Dortmunder/Export, Bohemian Pilsener, German Pilsener, Bock, as well as less common traditional or contemporary European-origin lager styles. Carbnation may vary with underlying style. These unfiltered beers are packaged and served with very low to moderate amounts of yeast. Contemporary versions may be filtered and dosed with yeast during packaging. Beers containing non-standard ingredients or aged in flavor-imparting vessels should be categorized elsewhere. During registration brewers may specify pouring instructions, choosing quiet pouring or intentional rousing of yeast. Entries will be presented during judging as specified by entering brewer. To allow for accurate judging the brewer must provide the classic European-origin lager style on which the entry is based. Beer entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"37","name":"Smoke Beer","has":true,"subs":[{"id":"37A","name":"Other Smoke Beer","cat":"Smoke Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Any beer of any style incorporating smoke, and therefore may range from very light to black"],["Clarity","Varies with underlying beer style"],["Malt aroma & flavor","Varies with underlying beer style"],["Hop aroma & flavor","Varies with underlying beer style"],["Bitterness","Varies with underlying beer style"],["Fermentation","For Smoke Beers based on lager styles, any phenolic notes (if present) should be derived from smoke; in such lagers yeast-derived phenolics should not be present."],["Body","Varies with underlying beer style"],["Notes","Any style of beer can be smoked. The goal is to reach a balance between the style's character and the smoky properties. Any smoke beer that does not fit other smoke beer categories are appropriately categorized here. To allow for accurate judging the brewer must list the smoke source (wood-based or otherwise), and may list any other ingredients or processes used. The brewer must also indicate the classic or experimental ale or lager style of the underlying base beer (e.g. 'tea-smoked dry stout'); the brewer may indicate 'no classic style' in instances where the base beer does not hew to a category within these competition guidelines (e.g. 'alder smoked ale, no classic style'). Beer entries not accompanied by this information will be at a disadvantage during judging."]]},{"id":"37B","name":"Smoke Porter","cat":"Smoke Beer","st":[["Original gravity","Varies"],["Final gravity","Varies"],["ABV","Varies"],["IBU","Varies"],["Color SRM (EBC)","Varies"]],"d":[["Color","Dark brown to black"],["Clarity","Opaque"],["Malt aroma & flavor","Smoked porters will exhibit mild to assertive smoke malt aroma and flavor in balance with other aroma attributes. Black malt character can be present in some porters, while others may be absent of strong roast character. Roast barley character is absent to low depending on underlying porter style being smoked. Medium to high malt sweetness with caramel or chocolate flavor attributes is acceptable."],["Hop aroma & flavor","None to medium"],["Bitterness","Medium to medium-high"],["Fermentation","Low to medium fruity esters are acceptable"],["Body","Medium to full"],["Notes","To allow for accurate judging the brewer must list the traditional or experimental base style of porter being smoked, as well as the wood type used as a smoke source (e.g. 'alder smoked brown porter'). Beer entries not accompanied by this information will be at a disadvantage during judging."]]},{"id":"37C","name":"Bamberg-Style Weiss Rauchbier","cat":"Smoke Beer","st":[["Original gravity","1.047-1.056"],["Final gravity","1.008-1.016"],["ABV","4.90%-5.60%"],["IBU","10-15"],["Color SRM (EBC)","4-18 (8-36 EBC)"]],"d":[["Color","Pale to chestnut brown"],["Clarity","If served with yeast, appearance may be very cloudy."],["Malt aroma & flavor","In darker versions, a detectable degree of roast malt may be present without being aggressive. Smoky malt aroma and flavor, ranging from low to high, should be present. Smoke character should be smooth, not harshly phenolic, suggesting a mild sweetness."],["Hop aroma & flavor","Not present"],["Bitterness","Low"],["Fermentation","The aroma and flavor of a Weiss Rauchbier with yeast should be fruity and phenolic. The phenolic characteristics are often described as clove, nutmeg, vanilla, and smoke. Banana esters are often present at low to medium-high levels. No diacetyl should be perceived. Weissbiers are well attenuated and very highly carbonated."],["Body","Medium to full"],["Notes","Beers in this style are made with at least 50 percent wheat malt. They are often roused during pouring, and, when yeast is present, will have a yeasty flavor and a fuller mouthfeel. To allow for accurate judging the brewer must list the underlying base German wheat beer style being smoked, as well as the wood type used as a smoke source (e.g. 'beech wood smoked dunkelweizen')."]]},{"id":"37D","name":"Bamberg-Style Helles Rauchbier","cat":"Smoke Beer","st":[["Original gravity","1.044-1.05"],["Final gravity","1.008-1.012"],["ABV","4.80%-5.60%"],["IBU","18-25"],["Color SRM (EBC)","4-5.5 (8-11 EBC)"]],"d":[["Color","Light pale to gold"],["Clarity","Appearance should be clear. Chill haze should not be present"],["Malt aroma & flavor","Malt character is prominent with malt aromas suggesting lightly toasted sweet, malted barley. Smoke beechwood character ranges from very low to medium. Smoky aroma should be not harshly phenolic. Sulfur may be present at low levels. There should be no caramel character. Smoke flavor may create a perception of mild sweetness."],["Hop aroma & flavor","Hop aroma and flavor is very low to low, derived from noble-type hops."],["Bitterness","Low to medium"],["Fermentation","Fruity esters and diacetyl should not be present. Very low levels of sulfur-related compounds are acceptable."],["Body","Medium"]]},{"id":"37E","name":"Bamberg-Style Maerzen Rauchbier","cat":"Smoke Beer","st":[["Original gravity","1.05-1.06"],["Final gravity","1.012-1.02"],["ABV","5.10%-6.00%"],["IBU","18-25"],["Color SRM (EBC)","4-15 (8-30 EBC)"]],"d":[["Color","Pale to light brown"],["Clarity","Appearance should be clear. Chill haze should not be present"],["Malt aroma & flavor","Sweet toasted malt aroma should be present. Medium-low to medium toasted malt sweetness should be present. Aroma and flavor of smoked beechwood ranges from very low to medium. Smoke flavors should be smooth, without harshness. Aroma should strike a balance between malt, hop, and smoke."],["Hop aroma & flavor","Hop aroma and flavor is very low to low, derived from noble-type hops."],["Bitterness","Low to medium"],["Fermentation","Fruity esters and diacetyl should not be present"],["Body","Full"]]},{"id":"37F","name":"Bamberg-Style Bock Rauchbier","cat":"Smoke Beer","st":[["Original gravity","1.066-1.074"],["Final gravity","1.018-1.024"],["ABV","6.30%-7.60%"],["IBU","20-30"],["Color SRM (EBC)","20-30 (40-60 EBC)"]],"d":[["Color","Dark brown to very dark"],["Clarity","Appearance should be clear. Chill haze should not be present"],["Malt aroma & flavor","Medium to medium-high malt aroma and flavor should be present with very low to medium-high beechwood smoke aromas and flavors. Smoke flavors should be smooth, without harshness. Smoke flavor may create a perception of mild sweetness."],["Hop aroma & flavor","Very low"],["Bitterness","Medium, increasing proportionately with starting gravity."],["Fermentation","Fruity esters are usually absent, but if present should be very low. Diacetyl should not be present."],["Body","Medium to full"]]}]},{"n":"38","name":"International Light Lager","has":true,"subs":[{"id":"38A","name":"German-Style Leichtbier","cat":"International Light Lager","st":[["Original gravity","1.026-1.034"],["Final gravity","1.006-1.01"],["ABV","2.50%-3.70%"],["IBU","16-24"],["Color SRM (EBC)","2-4 (4-8 EBC)"]],"d":[["Color","Straw to pale"],["Clarity","Appearance should be clear. Chill haze should not be present"],["Malt aroma & flavor","Low to medium"],["Hop aroma & flavor","Low to medium"],["Bitterness","Medium"],["Fermentation","Fruity esters and diacetyl should not be present. Very low levels of sulfur-related compounds are acceptable."],["Body","Very low"]]},{"id":"38B","name":"International Light Lager","cat":"International Light Lager","st":[["Original gravity","1.038-1.046"],["Final gravity","1.006-1.01"],["ABV","4.10%-5.10%"],["IBU","9-18"],["Color SRM (EBC)","2-5 (4-10 EBC)"]],"d":[["Color","Straw to gold"],["Clarity","Chill haze should not be present"],["Malt aroma & flavor","Malt sweetness is absent"],["Hop aroma & flavor","Not present to very low"],["Bitterness","Very low"],["Fermentation","Sugar adjuncts are often used to lighten the body and flavor, sometimes contributing to very low to low fruity esters such as apple or pear. DMS, diacetyl, and acetaldehyde should not be present."],["Body","Low"],["Notes","Sugar, corn, rice, and other cereal grains or carbohydrates sources are used as adjuncts."]]}]},{"n":"39","name":"International-Style Pilsener","has":false,"subs":[{"id":"39","name":"International-Style Pilsener","cat":"International-Style Pilsener","st":[["Original gravity","1.04-1.052"],["Final gravity","1.008-1.014"],["ABV","4.60%-5.30%"],["IBU","15-40"],["Color SRM (EBC)","3-6 (6-12 EBC)"]],"d":[["Color","Straw to gold"],["Clarity","Appearance should be clear. Chill haze should not be present"],["Malt aroma & flavor","A malty sweet aroma and flavor may be present at low levels, along with adjunct flavors from corn, rice, wheat or other grains."],["Hop aroma & flavor","Low to medium"],["Bitterness","Low to medium"],["Fermentation","Very low levels of DMS aroma and flavor are acceptable. Fruity esters and isoamyl acetate may be allowable in minimal levels (at the edge of perception). Acetaldehyde, and diacetyl should not be present."],["Body","Low to medium"],["Notes","These beers are often brewed with rice, corn, wheat, or other grains and may exhibit flavor profiles of those specific adjuncts used. Sugar adjuncts may also be used."]]}]},{"n":"40","name":"Rice Lager","has":false,"subs":[{"id":"40","name":"Rice Lager","cat":"Rice Lager","st":[["Original gravity","1.040-1.052"],["Final gravity","1.004-1.008"],["ABV","4.0%-6.0%"],["IBU","15-30"],["Color SRM (EBC)","2-6 (4-12 EBC)"]],"d":[["Color","Pale straw to gold"],["Clarity","Appearance should be clear. Chill haze should not be present"],["Malt aroma & flavor","A subtle malty sweet aroma and flavor may be present at low levels. Very mild fusel or ester-derived sweetness from the use of rice may be present. Rice character may range from clean and neutral to expressive including nutty, savory, or aromatic notes depending on variety of rice used."],["Hop aroma & flavor","Low to medium and in harmony with malt profile. Hops should not dominate"],["Bitterness","Low to medium"],["Fermentation","Clean, neutral fermentation profile. Very low fruity esters may be present. Acetaldehyde, DMS or diacetyl should not be present."],["Body","Low to medium"],["Notes","These beers are brewed with 15% or more rice. Rice expression may vary in the beer, from neutral to very expressive and may exhibit flavor and aroma profiles of the specific rice varietal used, as well as a clean, dry finish. Hops should be integrated and not pronounced. Beers featuring a dominant hop or dryhop profile are classified into other hoppy lager categories."]]}]},{"n":"41","name":"Hoppy Lager","has":true,"subs":[{"id":"41A","name":"India Pale Lager","cat":"Hoppy Lager","st":[["Original gravity","1.05-1.065"],["Final gravity","1.006-1.016"],["ABV","5.60%-7.90%"],["IBU","50-70"],["Color SRM (EBC)","2.5-6 (5-12 EBC)"]],"d":[["Color","Straw to gold"],["Clarity","Hop haze is allowable. Chill haze should not be present"],["Malt aroma & flavor","Very low to medium, and may exhibit bready, cracker-like, or other attributes typical of pale malts"],["Hop aroma & flavor","High to very high with attributes typical of hops of any origin"],["Bitterness","Medium-high to to very high, but not harsh"],["Fermentation","Fruity esters range from absent to medium-low. DMS, acetaldehyde, and diacetyl should not be present."],["Body","low to medium"],["Notes","This style of beer should exhibit the fresh character of hops. Some versions may be brewed with corn, rice, or other adjunct grains, and may exhibit attributes typical of those adjuncts."]]},{"id":"41B","name":"Other Hoppy Lager","cat":"Hoppy Lager","st":[["Original gravity","Typical of underlying lager style"],["Final gravity","Typical of underlying lager style"],["ABV","Typical of underlying lager style"],["IBU","Typical of underlying lager style"],["Color SRM (EBC)","Typical of underlying lager style"]],"d":[["Color","Will vary with style"],["Clarity","Light hop haze may be present at low temperatures"],["Malt aroma & flavor","Low to medium, typical of underlying lager beer style"],["Hop aroma & flavor","Medium to high with attributes typical of hops of any origin"],["Bitterness","Medium to high and not harsh"],["Fermentation","DMS, fruity esters and diacetyl should not be present. Fruit-like attributes from late or dry hopping arising from higher hopping rates and or the use of atypical hop varieties may be present at low to high levels."],["Body","Low to medium, in alignment with base beer style."],["Notes","Recognizing the uniqueness, variety and experimentation within formerly traditional lager beer styles, beers entered in this subcategory do not fit existing lager beer style competition guidelines but instead exhibit hop aroma and flavor attributes which differ from, and at higher levels than, those found in lager styles defined elsewhere throughout these guidelines. Examples might include entries made with aroma hop varieties not normally associated with traditional lager beer styles and which exhibit attributes (e.g. tropical, stone fruit, pine, etc.) unusual to those styles. Hop bitterness, aroma and flavor are in harmony and balance with alcohol, malt and other attributes of the entry. Entries with alcohol content and flavor profile typical of India Pale Lager are categorized as India Pale Lager. To allow for accurate judging the brewer must indicate the classic lager style of the underlying base beer, and may indicate hop varieties used and when introduced in the brewing process (for example: 'American Lager dry hopped with nelson sauvin during fermentation'). Beer entries not accompanied by this information will be at a disadvantage during judging.."]]}]},{"n":"42","name":"Italian-Style Pilsener","has":false,"subs":[{"id":"42","name":"Italian-Style Pilsener","cat":"Italian-Style Pilsener","st":[["Original gravity","1.044-1.052"],["Final gravity","1.006-1.013"],["ABV","4.5%-5.3%"],["IBU","25-50"],["Color SRM (EBC)","3-4 (6-8 EBC)"]],"d":[["Color","Straw to Gold"],["Clarity","Appearance should be clear. Chill haze should not be present"],["Malt aroma & flavor","A malty sweet aroma and flavor should be present at low levels. Light biscuity attributes may be present."],["Hop aroma & flavor","Hop aroma and flavor is pronounced and aromatic, derived from late hopping and dry hopping with noble-type hops. Floral,
