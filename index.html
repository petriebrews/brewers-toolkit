h, expressed as floral, herbal, earthy, stone fruit or other attributes from high hopping rates."],["Bitterness","Medium to high"],["Fermentation","Fruity esters are medium to high. Traditional interpretations are characterized by medium to medium-high alcohol content. The use of water with high mineral content results in a crisp, dry beer with a subtle and balanced character of sulfur compounds. Diacetyl can be absent or may be present at very low levels."],["Body","Medium"],["Notes","A wide range of hop varieties may be used for bitterness or for approximating traditional English hop character. The use of water with high mineral content may result in a crisp, dry beer rather than a malt-accentuated version."]]}]},{"n":"113","name":"Juicy or Hazy India Pale Ale","has":false,"subs":[{"id":"113","name":"Juicy or Hazy India Pale Ale","cat":"Juicy or Hazy India Pale Ale","st":[["Original gravity","1.06-1.07"],["Final gravity","1.012-1.020"],["ABV","6.30%-7.50%"],["IBU","20-50; may differ significantly from perceived bitterness"],["Color SRM (EBC)","3-7 (6-14 EBC)"]],"d":[["Color","Straw to light amber"],["Clarity","Can vary widely from very low haze to very high degree of cloudiness. Starch, yeast, hop, protein or other compounds contribute to a wide range of hazy appearance within this category."],["Malt aroma & flavor","Low to medium-low malt aroma and flavor may be present"],["Hop aroma & flavor","High to very high hop aroma and flavor are present, exhibiting a very wide range of attributes, especially fruity, tropical, juicy, and many others."],["Bitterness","Low to medium. The impression of bitterness is soft and well-integrated into overall balance and may differ significantly from measured or calculated IBU levels."],["Fermentation","Medium to medium-high fruity esters are present, and can contribute to the perception of sweetness and be complementary to the hop profile. Diacetyl should not be present."],["Body","Medium-low to medium-high. A silky or full mouthfeel may contribute to overall flavor profile."],["Notes","Grist may include oats, wheat, or other adjuncts to promote haziness. Lactose may be used to enhance body and balance. Lactose should not lend to, or overwhelm, the flavor character of these beers. The term 'juicy' is frequently used to describe flavor and aroma attributes often present in these beers which result from late, often very large, additions of hops. A juicy character is not required, however. Other hopderived attributes such as citrus, pine, spice, floral or others may be present with or without the presence of juicy attributes. Likewise the term 'hazy' is frequently used to describe the appearance of many examples of these beers. However, some versions may exhibit very low cloudiness. These beers may sometimes exhibit astringency and/or heat (often referred to as 'hop burn') as a result of very high hop usage rates and excessive contact time in beer, which can detract from balance and drinkability when present above low levels. Any use of thiolized yeasts, terpene blends or any other advanced hop products should not overwhelm the beer and should be in harmony with overall flavor profile"]]}]},{"n":"114","name":"West Coast-Style India Pale","has":false,"subs":[{"id":"114","name":"West Coast-Style India Pale","cat":"West Coast-Style India Pale","st":[["Original gravity","1.055-1.07"],["Final gravity","1.005-1.012"],["ABV","6.3%-7.5%"],["IBU","50-75"],["Color SRM (EBC)","2-6 (4-12 EBC)"]],"d":[["Color","Straw to gold"],["Clarity","Chill haze or hop haze is acceptable at low levels"],["Malt aroma & flavor","Low to medium-low. Caramel or roasted malt character should not be present"],["Hop aroma & flavor","High to very high, exhibiting a wide range of attributes including floral, piney, citrus, fruity (berry, tropical, stone fruit and other), sulfur, diesel-like, catty, resinous and many others."],["Bitterness","Medium to very high, but not harsh"],["Fermentation","Fruity esters range from low to medium. DMS, acetaldehyde, and diacetyl should not be present. These beers are characterized by a high degree of attenuation."],["Body","Low to medium-low"],["Notes","These beers are highly attenuated with an assertive hop character and a dry, crisp finish. Versions brewed with darker malts, non-traditional yeasts, fruits, spices, or other flavorings are categorized as Experimental India Pale Ale. Any use of thiolized yeasts, terpene blends or any other advanced hop products should not overwhelm the beer and should be in harmony with overall flavor profile While the West Coast India Pale Ale style has been around for some time, the style itself has progressed over time from original inception to modern day examples - this guideline serves to align directly with modern-day examples of the style.."]]}]},{"n":"201","name":"Tannic Cider","has":false,"subs":[{"id":"201","name":"Tannic Cider","cat":"Tannic Cider","st":[["Perceived Sweetness","Dry to Sweet"],["ABW (ABV)","2.30-7.89% (3.00%-10.00%)"],["Carbonation","Still to Sparkling"]],"d":[["Color","Pale straw to copper/pink"],["Clarity","Cloudy to Brilliant"],["Malt aroma & flavor","Very Low to Medium High. Fresh apple character may or may not be present but should not be a defining characteristic. Dry ciders may have a vinous character and English and Frenchinspired versions can often include bold phenolic characteristics"],["Bitterness","Medium low to High"],["Fermentation","Fruity esters low to medium-high. If malolactic character is present, it should not be a dominant characteristic. Volatile acidity in the form of ethyl acetate is a fault. Brettanomyces character, including funk/barnyard is not a fault when in balance."],["Body","Medium to High"],["Notes","This category focuses on Tannic Ciders utilizing apple or pear varieties often purposefully grown for cider production. These bittersweet/bittersharp varieties often impart significant levels of tannin and varietal specific flavor characteristics. To allow for accurate judging the cidermaker must indicate the regional cider style and/or production technique as well as apple varietal(s) used, sweetness level & carbonation level. Within the framework of the competition, ciders featuring prominent barrel-derived flavor characteristics should be entered as Experimental or BarrelAged Cider. Entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"202","name":"No/Low-Tannin Cider","has":false,"subs":[{"id":"202","name":"No/Low-Tannin Cider","cat":"No/Low-Tannin Cider","st":[["Perceived Sweetness","Dry to Sweet"],["ABW (ABV)","2.30-7.89% (3.0%-10.0%)"],["Carbonation","Still to Sparkling"]],"d":[["Color","Light straw to copper/pink"],["Clarity","Lightly hazy to Brilliant"],["Malt aroma & flavor","Perceived Apple"],["Aroma & Flavor","Medium to High. Fresh apple or pear character should be present and is a defining characteristic."],["Bitterness","Perceived Tannins: None to Low"],["Fermentation","Fruity esters low to medium. Clean fermentation profile without evidence of wild fermentation."],["Body","Low to Full"],["Notes","This category focuses on modern interpretations of cider often utilizing apples or pears of culinary interest. Fermentation character should be clean without evidence of wild or malolactic fermentation. No/Low-Tannin Ciders should be refreshing without sacrificing body or flavor; Intensity of sweetness or dryness should be balanced for Dry/Sweet versions, respectively. To allow for accurate judging the cidermaker may indicate the regional cider style and/or production technique as well as apple varietal(s) used; if apple varietal is specified, judges will expect characteristics of that varietal; if ABV is above typical range, entrant should provide details about apple varieties, growing conditions and production methods used. Within the framework of the competition, ciders featuring prominent barrel-derived flavor characteristics should be entered as Experimental or Barrel-Aged Cider."]]}]},{"n":"203","name":"Fruited Cider","has":false,"subs":[{"id":"203","name":"Fruited Cider","cat":"Fruited Cider","st":[["Perceived Sweetness","Varies"],["ABW (ABV)","2.30-7.89% (3.0%-10.0%)"],["Carbonation","Still to Sparkling"]],"d":[["Color","Varies"],["Clarity","Cloudy to Brilliant"],["Malt aroma & flavor","Apple or pear aroma and flavor should be well integrated into added fruits used while maintaining balance."],["Bitterness","None to High"],["Fermentation","Fermentation characteristics should reflect the base style, with any added fruit providing additional layers of flavor and complexity."],["Body","Low to High"],["Notes","This category focuses on ciders with added fruit. The base cider characteristics can be preserved, transformed, or highlighted. Cider character must be present and should be in harmony with added fruits elements. Within the framework of the competition, ciders featuring both fruits and botanical elements may be appropriately entered here in the Botanical/Spiced cider category, depending on the dominant flavor (Botanical/Spice or Fruit) of the cider. Ciders with prominent barrel-derived flavor characteristics should be entered as Experimental or Barrel-Aged Cider. Ingredients generally used as “fruit” in culinary applications are allowed in this category (i.e. hibiscus, rhubarb, etc.). Ciders using only added vegetables, herbs, chilis or spices should be entered in the Botanical cider category. To allow for accurate judging the cidermaker must indicate the underlying base (e.g. “No/Low Tannin Cider”, “Tannic Cider”) and/or production technique, sweetness level and carbonation level as well as any specific fruit(s) used in production; Entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"204","name":"Botanical or Spiced Cider","has":false,"subs":[{"id":"204","name":"Botanical or Spiced Cider","cat":"Botanical or Spiced Cider","st":[["Perceived Sweetness","Varies"],["ABW (ABV)","2.30-7.89% (3.0%-10.0%)"],["Carbonation","Still to Sparkling"]],"d":[["Color","Light straw to amber but may vary with color of added botanical(s)"],["Clarity","Cloudy to Brilliant"],["Malt aroma & flavor","Apple or pear aroma and flavor should be well integrated into the botanicals used while maintaining balance."],["Bitterness","None to High"],["Fermentation","Fermentation characteristics should reflect the base style, with any experimental treatments adding additional layers of flavor and complexity."],["Body","Low to High"],["Notes","This category focuses on ciders with added botanicals (including herbs, spices, hops, vegetables, chilis). The base cider characteristics can be preserved, transformed, or highlighted. Cider character must be present and should be in harmony with added botanical elements. Within the framework of the competition, ciders featuring both fruits and botanical elements may be appropriately entered here in the Botanical/Spiced cider category, depending on the dominant flavor (Botanical/Spice or Fruit) of the cider. Ciders with prominent barrel-derived flavor characteristics should be entered as Experimental or Barrel-Aged Cider. To allow for accurate judging the cidermaker must indicate the underlying base (e.g. “No/Low Tannin Cider”, “Tannic Cider”) and/or production technique, sweetness level and carbonation level as well as any specific fruit(s) used in production; Entries not accompanied by this information will be at a disadvantage during judging."]]}]},{"n":"205","name":"Experimental, Barrel-Aged or Specialty Cider","has":false,"subs":[{"id":"205","name":"Experimental, Barrel-Aged or Specialty Cider","cat":"Experimental, Barrel-Aged or Specialty Cider","st":[],"d":[["Color","Varies"],["Clarity","Cloudy to Brilliant"],["Malt aroma & flavor","Varies - if appropriate, should highlight the experimental techniques or barrel treatments utilized"],["Bitterness","None to High"],["Fermentation","Fermentation characteristics should reflect the base style, with any experimental treatments adding additional layers of flavor and complexity."],["Body","Low to High"],["Notes","This category focuses on combinations of fruits, spices, adjuncts, fortifications, fermentations, barrel treatments or other experimental processes that produce a cider that does not fit well in any of the other categories. The base cider characteristics can be preserved, transformed, or highlighted. Ciders featuring prominent barrel or wood-aging flavors, sugar concentration or spirit fortification are appropriately categorized here. Ciders that are barrel-aged with a generally neutral in terms of barrel-derived flavor may be appropriately categorized elsewhere. Within the framework of this competition ciders featuring added fruits or botanical elements are appropriately entered in the Fruited or Botanical/Spiced cider categories, based on the dominant flavor. Ciders with prominent barrel-derived flavor characteristics, wild fermentation profiles should be entered as Experimental or Barrel-Aged Cider. To allow for accurate judging the cidermaker must indicate the underlying traditional/contemporary cider style and/or production technique, sweetness level & carbonation level. Entrant must also list any experimental techniques, processes or ingredients used in production. For barrel-aged entries, entrants should specify container/barrel type and aging timeline information. Entries not accompanied by this information will be at a disadvantage during judging. Sweetness, alcohol, and carbonation vary. . Original Gravity (°P) • Apparent Extract/Final Gravity (°P) • Alcohol by Weight (Volume) • Hop Bitterness (IBU) • Color SRM (EBC)"]]}]},{"n":"206","name":"Single Varietal Cider","has":false,"subs":[{"id":"206","name":"Single Varietal Cider","cat":"Single Varietal Cider","st":[["Perceived Sweetness","Dry to Sweet"],["ABW (ABV)","2.30-7.89% (3.0%-10.0%)"],["Carbonation","Still to Sparkling"]],"d":[["Color","Light straw to Amber and can be influenced by the color of added fruit(s) if any."],["Clarity","Cloudy to Brilliant"],["Malt aroma & flavor","Low to High and varies based on underlying cider style and apple varietal. Sweet or low-alcohol ciders may have medium to high apple aroma and flavor. Dry ciders may have low apple aroma and flavor in flavor and may be more vinous with some esters."],["Bitterness","None to High. Specific apple variety and growing conditions will contribute to the flavor and mouthfeel of a varietal cider."],["Fermentation","Fruity esters low to medium-high."],["Body","Low to Full"],["Notes","Single Varietal Ciders are an enjoyable expression of cider made with a specific apple varietal and apple varietal character will be considered in judge evaluation. Single varietal ciders are made from 100% apple, 75% of which must be a single apple variety. Other apple varieties are allowed for blending up to 25% but no pears are included. Balance and quality of apple flavor profiles should be noticeable and overall flavor and aroma can range from subtle to complex. To allow for accurate judging the cidermaker must indicate featured apple variety (>75%) and any other apple varieties (<25%) used in the cider. No pears are included. All varieties and percentages must be listed. Within the framework of the competition, ciders featuring prominent barrel-derived flavor characteristics should be entered as Experimental or Barrel-Aged Cider."]]}]}];
const SETD={gabf:{t:"2026 GABF Style Guidelines",d:GABF,p:GP,note:"Great American Beer Festival beer & cider categories, with full text and specs from the official 2026 guideline PDF."},wbc:{t:"2026 World Beer Cup Style Guidelines",d:WBC,p:WP,note:"World Beer Cup beer & cider categories, with full text and specs from the official 2026 guideline PDF."}};
let cur=null;
function showView(v){["sm","gs","sl","sc"].forEach(i=>$("#"+i).classList.add("hide"));$("#sbk").classList.toggle("hide",v=="m");$(v=="m"?"#sm":v=="b"?"#sl":"#gs").classList.remove("hide");scrollTo(0,0)}
$("#sm").innerHTML=`<h2>Style guidelines</h2><div class="st" data-k="bjcp"><span>2021 BJCP Style Guidelines<br><span class="n">${D.length} beer styles · full specs</span></span></div><div class="st" data-k="gabf"><span>2026 GABF Style Guidelines<br><span class="n">Great American Beer Festival categories</span></span></div><div class="st" data-k="wbc"><span>2026 World Beer Cup Style Guidelines<br><span class="n">World Beer Cup categories</span></span></div>`;
$("#sm").onclick=e=>{const r=e.target.closest(".st");if(r)r.dataset.k=="bjcp"?showView("b"):openG(r.dataset.k)};
$("#sbk").onclick=()=>showView("m");
function openG(k){cur=SETD[k];$("#gs").innerHTML=`<div class="card"><h2>${cur.t}</h2><div class="n">${cur.note}</div></div><input id="gq" type="search" placeholder="Search styles…"><div id="gl"></div><div id="gc" class="hide"></div>`;
$("#gq").oninput=glist;glist();showView("g")}
function glist(){const q=$("#gq").value.toLowerCase();let h="";cur.d.forEach(c=>{const m=c.subs.filter(s=>(s.id+s.name+c.name).toLowerCase().includes(q));if(!m.length)return;if(c.has)h+=`<h3>${c.n}. ${c.name}</h3>`;m.forEach(s=>h+=`<div class="st" data-i="${s.id}"><b>${s.id}</b><span>${s.name}</span></div>`)});
$("#gl").innerHTML=h||"<p>No matches.</p>";$("#gl").onclick=e=>{const r=e.target.closest(".st");if(r)gcard(cur.d.flatMap(c=>c.subs).find(s=>s.id==r.dataset.i))}}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function plat(v){const m=v.match(/^([\d.]+)-([\d.]+)(\+?)$/);return m?`${v} (${sg2p(+m[1]).toFixed(1)}\u2013${sg2p(+m[2]).toFixed(1)}${m[3]} \u00b0P)`:v}
function gcard(s){let h=`<button id="gb" style="margin-bottom:12px">\u2190 ${cur.t}</button><div class="card"><div class="n">Category ${parseInt(s.id)} \u00b7 ${esc(s.cat)}</div><h2 style="font-size:22px;margin:4px 0">${esc(s.name)}</h2>`;
h+=s.st.map(([k,v])=>`<div class="o"><span>${k}</span><span style="text-align:right">${esc(k.endsWith("gravity")?plat(v):v)}</span></div>`).join("")+`</div>`;
if(s.d.length)h+=`<div class="card">${s.d.map(([k,v])=>`<h3 style="margin:14px 0 4px">${esc(k)}</h3><div>${esc(v)}</div>`).join("")}</div>`;
h+=`<a class="art" href="${cur.p}" target="_blank" rel="noopener">Official guidelines (PDF)</a>`;
$("#gc").innerHTML=h;$("#gl").classList.add("hide");$("#gq").classList.add("hide");$("#gc").classList.remove("hide");scrollTo(0,0);
$("#gb").onclick=()=>{$("#gc").classList.add("hide");$("#gl").classList.remove("hide");$("#gq").classList.remove("hide")}}
</script><script>if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script></body></html>
